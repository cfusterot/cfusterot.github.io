<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psychogeography Archive | Coral Fustero-Torre</title>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --text-color: #666; 
            --paper-bg: #e5e5e2; 
            --ink-texture: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyIiBoZWlnaHQ9IjIiPjxjaXJjbGUgY3g9IjEiIGN5PSIxIiByPSIwLjUiIGZpbGw9IiM3NzciIGZpbGwtb3BhY2l0eT0iMC4yNSIgLz48L3N2Zz4=');
        }

        body {
            font-family: 'Courier Prime', monospace;
            margin: 0;
            background-color: var(--paper-bg);
            color: var(--text-color);
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPjxm Filter id="n"><ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iMC45IiBudW1PY3RhdmVzPSI0IiBzdGl0Y2hUaWxlcz0ic3RpdGNoIi8+PC9maWx0ZXI+PHJlY3Qgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIgZmlsbD0ibm9uZSIgZmlsdGVyPSJ1cmwoI24pIiBvcGFjaXR5PSIwLjA4Ii8+PC9zdmc+');
            overflow-x: hidden;
        }

        header { padding: 3rem 2rem; max-width: 1400px; margin: 0 auto; display: flex; justify-content: space-between; align-items: baseline; position: relative; z-index: 1000; }
        .logo { text-decoration: none; color: var(--text-color); font-weight: 700; font-size: 1.1rem; }
        nav a { text-decoration: none; color: #999; font-size: 0.85rem; }

        main { padding: 0 2rem 10rem 2rem; max-width: 1400px; margin: 0 auto; }

        .section-title {
            font-size: 0.85rem;
            font-weight: 700;
            margin: 2rem 0 6rem 0;
            text-transform: uppercase;
            letter-spacing: 4px;
            opacity: 0.4;
            text-align: center;
        }

        /* --- COMPACT BOOK PAGE LAYOUT --- */
        .archive-stream {
            width: 100%;
            column-count: 5; 
            column-gap: 25px; 
            padding-bottom: 5rem;
        }

        .archive-stream > img, .archive-stream > video { display: none; }

        .gallery-item {
            position: relative;
            cursor: pointer;
            z-index: 2;
            break-inside: avoid;
            margin-bottom: 35px; 
            content-visibility: auto;
            
            --rot: 0deg; 
            --dur: 15s;
            --del: 0s;
            animation: drift var(--dur) ease-in-out var(--del) infinite alternate;
            transition: z-index 0s, transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); 
            will-change: transform;
        }

        /* --- SIZING & ALIGNMENT UTILITIES --- */
        .w-60 { width: 60%; }
        .w-80 { width: 80%; }
        .w-100 { width: 100%; }

        .align-left { margin-right: auto; margin-left: 0; }
        .align-center { margin-left: auto; margin-right: auto; }
        .align-right { margin-left: auto; margin-right: 0; }

        @keyframes drift {
            0% { transform: translateY(0px) rotate(var(--rot)); }
            100% { transform: translateY(-10px) rotate(calc(var(--rot) + 2deg)); } 
        }

        /* Base styles for all media */
        .gallery-item img, .gallery-item video {
            width: 100%;
            height: auto; 
            display: block;
            filter: grayscale(100%) contrast(90%) brightness(115%);
            opacity: 0.85;
            transition: all 0.4s ease-in-out; 
            will-change: filter, clip-path, opacity;
            border-radius: 2px; 
        }

        /* Texture overlay for standard geometric cuts/photos */
        .gallery-item::after {
            content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background-image: var(--ink-texture); background-size: 2px 2px;
            mix-blend-mode: multiply; pointer-events: none; opacity: 0.5; z-index: 3;
            transition: opacity 0.4s;
        }

        /* --- SHAPE CLASSES --- */
        .cut-map1 img { clip-path: polygon(10% 0, 90% 5%, 100% 40%, 85% 95%, 40% 100%, 0 70%, 5% 20%); }
        .cut-map2 img { clip-path: polygon(0 15%, 100% 0, 90% 100%, 15% 85%); }
        .cut-map3 img { clip-path: polygon(30% 0, 100% 30%, 70% 100%, 0 80%, 10% 20%); }
        .cut-trapezoid img { clip-path: polygon(15% 0%, 85% 0%, 100% 100%, 0% 100%); }
        .cut-rhomboid img  { clip-path: polygon(20% 0%, 100% 0%, 80% 100%, 0% 100%); }
        .shape-circle video { clip-path: circle(50% at 50% 50%); aspect-ratio: 1; object-fit: cover; border-radius: 50%; }

        /* --- DYNAMIC PROJECT HIGHLIGHTING --- */
        /* STANDARD items highlighted */
        .gallery-item:not(.organic-cutout).highlight-active img,
        .gallery-item:not(.organic-cutout).highlight-active video {
            filter: grayscale(0%) contrast(100%) brightness(100%) !important;
            opacity: 1 !important;
        }
        .gallery-item:not(.organic-cutout).highlight-active::after { 
            opacity: 0 !important; 
        }

        /* ORGANIC CUTOUT items highlighted (ONLY affect the PNG, keep JPG hidden) */
        .organic-cutout.highlight-active .cutout-img {
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.15)) grayscale(0%) contrast(100%) brightness(100%) !important;
            opacity: 1 !important;
        }

        /* --- INDIVIDUAL ITEM HOVER EFFECTS (THE REVEAL) --- */
        .archive-stream .gallery-item:hover {
            z-index: 100 !important;
            animation-play-state: paused;
            transform: scale(1.2) !important; 
        }

        /* STANDARD items Reveal */
        .archive-stream .gallery-item:not(.organic-cutout):hover img, 
        .archive-stream .gallery-item:not(.organic-cutout):hover video {
            clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%) !important; 
            border-radius: 2px !important; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
            filter: grayscale(0%) contrast(100%) brightness(100%) !important;
            opacity: 1 !important;
            position: relative;
            z-index: 101;
        }

        .archive-stream .gallery-item:not(.organic-cutout):hover::after {
            opacity: 0 !important;
        }


        /* --- CUSTOM TRANSPARENT PNG LOGIC (CSS GRID STACKING) --- */
        /* This prevents the multi-column absolute position bug entirely */
        .organic-cutout {
            display: grid !important; 
            grid-template-columns: 1fr;
            grid-template-rows: 1fr;
        }
        .organic-cutout::after {
            display: none !important; /* No texture block on organic shapes */
        }
        
        /* Both images share the exact same grid cell, guaranteeing perfect overlap */
        .organic-cutout .cutout-img,
        .organic-cutout .full-reveal-img {
            grid-column: 1 / 2;
            grid-row: 1 / 2;
            width: 100%;
            height: auto;
            border-radius: 2px;
        }

        /* The transparent PNG setup */
        .organic-cutout .cutout-img {
            z-index: 2;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.15)) grayscale(100%) contrast(90%) brightness(115%);
        }

        /* The hidden full JPG setup */
        .organic-cutout .full-reveal-img {
            z-index: 1;
            opacity: 0 !important; /* Hidden strictly by opacity */
            pointer-events: none;
            box-shadow: none !important;
        }

        /* SMOOTH STACK CROSSFADE ON HOVER */
        .archive-stream .organic-cutout:hover .cutout-img {
            opacity: 0 !important; /* Fade out PNG */
        }
        .archive-stream .organic-cutout:hover .full-reveal-img {
            opacity: 1 !important; /* Fade in JPG */
            box-shadow: 0 20px 40px rgba(0,0,0,0.25) !important;
            filter: grayscale(0%) contrast(100%) brightness(100%) !important;
        }

        /* Lightbox */
        .lightbox { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.98); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .lightbox-content { position: relative; max-width: 85%; max-height: 85vh; }
        #lightbox-img, #lightbox-video { max-width: 100%; max-height: 85vh; filter: none !important; box-shadow: 0 20px 60px rgba(0,0,0,0.1); }
        .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: none; border: none; font-size: 2.5rem; cursor: pointer; padding: 20px; color: var(--text-color); font-family: 'Courier Prime', monospace;}
        #prev-btn { left: -80px; } #next-btn { right: -80px; }

        @media (max-width: 1200px) { .archive-stream { column-count: 4; column-gap: 20px; } }
        @media (max-width: 900px) { .archive-stream { column-count: 3; column-gap: 20px; } }
        @media (max-width: 600px) { .archive-stream { column-count: 2; column-gap: 15px; } #prev-btn { left: -40px; } #next-btn { right: -40px; } }
        footer { padding: 5rem 2rem; text-align: center; font-size: 0.7rem; color: #ccc; }
    </style>
</head>

    <script>
        function initializeArchive() {
            const stream = document.getElementById('main-stream');
            
            const dynamicItems = Array.from(stream.querySelectorAll('img[data-category], video[data-category]'));
            const films = dynamicItems.filter(item => item.getAttribute('data-category') === 'film');
            const others = dynamicItems.filter(item => item.getAttribute('data-category') !== 'film');

            others.sort(() => Math.random() - 0.5);

            films.sort(() => Math.random() - 0.5);
            films.forEach((film) => {
                const randomTopIndex = Math.floor(Math.random() * Math.min(12, others.length));
                others.splice(randomTopIndex, 0, film);
            });

            const elements = others;
            let mediaItems = []; 
            
            const collageShapes = ['cut-map1', 'cut-map2', 'cut-map3', 'cut-trapezoid', 'cut-rhomboid'];
            const randomWidths = ['w-60', 'w-80', 'w-100'];
            const randomAligns = ['align-left', 'align-center', 'align-right'];
            
            elements.forEach((media) => {
                const category = media.getAttribute('data-category');
                const project = media.getAttribute('data-project'); 
                const fullSrc = media.getAttribute('data-full-src'); 
                const cutoutSrc = media.getAttribute('src'); 
                
                const wrapper = document.createElement('div');
                wrapper.className = 'gallery-item';
                
                // STACKING LOGIC FOR TRANSPARENT PNGS (Using CSS Grid instead of absolute positioning)
                if (fullSrc) {
                    wrapper.classList.add('organic-cutout');
                    
                    // The full JPG layer
                    const fullImg = document.createElement('img');
                    fullImg.src = fullSrc;
                    fullImg.className = 'full-reveal-img';
                    wrapper.appendChild(fullImg);
                    
                    media.classList.add('cutout-img');
                }

                wrapper.classList.add(randomWidths[Math.floor(Math.random() * randomWidths.length)]);
                wrapper.classList.add(randomAligns[Math.floor(Math.random() * randomAligns.length)]);

                wrapper.setAttribute('data-category', category);
                if (project) wrapper.setAttribute('data-project', project);

                if (category === 'collage' && !fullSrc) {
                    wrapper.classList.add(collageShapes[Math.floor(Math.random() * collageShapes.length)]);
                } else if (category === 'film') {
                    wrapper.classList.add('shape-circle');
                    media.play(); 
                }

                const randomRot = (Math.random() * 8 - 4).toFixed(1); 
                const randomDur = (14 + Math.random() * 10).toFixed(1); 
                const randomDel = -(Math.random() * 20).toFixed(1);    

                wrapper.style.setProperty('--rot', `${randomRot}deg`);
                wrapper.style.setProperty('--dur', `${randomDur}s`);
                wrapper.style.setProperty('--del', `${randomDel}s`);
                
                stream.appendChild(wrapper); 
                wrapper.appendChild(media);
                
                mediaItems.push({ 
                    type: media.tagName.toLowerCase(), 
                    src: cutoutSrc, 
                    fullSrc: fullSrc 
                });
                
                wrapper.addEventListener('mouseenter', () => {
                    if (project) {
                        document.querySelectorAll(`.gallery-item[data-project="${project}"]`).forEach(el => {
                            el.classList.add('highlight-active');
                        });
                    }
                });

                wrapper.addEventListener('mouseleave', () => {
                    document.querySelectorAll('.gallery-item.highlight-active').forEach(el => {
                        el.classList.remove('highlight-active');
                    });
                });

                wrapper.onclick = () => { 
                    window.currentIndex = mediaItems.findIndex(item => item.src === cutoutSrc);
                    updateLightbox(); 
                };
            });

            window.mediaItems = mediaItems;
            window.currentIndex = 0;
        }

        function updateLightbox() {
            const item = window.mediaItems[window.currentIndex]; 
            const lbImg = document.getElementById('lightbox-img'); 
            const lbVid = document.getElementById('lightbox-video');

            if (item.type === 'img') { 
                lbImg.src = item.fullSrc ? item.fullSrc : item.src; 
                lbImg.style.display = 'block'; 
                lbVid.style.display = 'none'; 
                lbVid.pause(); 
            } else { 
                lbVid.src = item.src; 
                lbVid.style.display = 'block'; 
                lbImg.style.display = 'none'; 
                lbVid.play(); 
            }
            document.getElementById('lightbox').style.display = 'flex';
        }

        window.changeMedia = (step) => {
            window.currentIndex = (window.currentIndex + step + window.mediaItems.length) % window.mediaItems.length;
            updateLightbox();
        };

        window.closeLightbox = () => { 
            document.getElementById('lightbox').style.display = 'none'; 
            document.getElementById('lightbox-video').pause();
        };

        initializeArchive();
    </script>
