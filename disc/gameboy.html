<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psychogeographic Portfolio | Coral Fustero-Torre</title>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --text-color: #444; 
            --paper-bg: #e5e5e2; 
            --accent-red: #d93829; 
        }

        /* Forces the typewriter font onto absolutely everything */
        * {
            font-family: 'Courier Prime', monospace !important;
        }

        body {
            margin: 0;
            background-color: var(--paper-bg);
            color: var(--text-color);
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPjxm Filter id="n"><ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iMC45IiBudW1PY3RhdmVzPSI0IiBzdGl0Y2hUaWxlcz0ic3RpdGNoIi8+PC9maWx0ZXI+PHJlY3Qgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIgZmlsb=Im5vbmUiIGZpbHRlcj0idXJsKCNuKSIgb3BhY2l0eT0iMC4wOCIvPjwvc3ZnPg==');
            overflow-x: hidden;
            position: relative;
            transition: background-color 0.8s ease;
        }

        body.is-zoomed { background-color: #d1d1ce; }

        header { padding: 2rem; max-width: 1400px; margin: 0 auto; display: flex; justify-content: space-between; align-items: baseline; position: relative; z-index: 4000; }
        .logo { text-decoration: none; color: var(--text-color); font-weight: 700; font-size: 1.1rem; }
        nav a { text-decoration: none; color: #999; font-size: 0.85rem; }

        #canvas-wrapper {
            position: relative;
            width: 100%;
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            transform-origin: top center;
            z-index: 1;
        }

        #map-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%; 
            pointer-events: none;
            z-index: 1;
        }

        main { position: relative; width: 100vw; height: 11000px; z-index: 2; }
        .archive-stream { position: absolute; width: 100%; height: 100%; top: 0; left: 0; }
        #main-stream > img, #main-stream > video { display: none; }

        .gallery-item { position: absolute; cursor: pointer; z-index: 10; }

        .gallery-item.ready-to-move {
            transition: left 1.5s cubic-bezier(0.25, 1, 0.5, 1), 
                        top 1.5s cubic-bezier(0.25, 1, 0.5, 1), 
                        transform 1.5s cubic-bezier(0.25, 1, 0.5, 1),
                        z-index 0.5s ease;
        }

        .media-container { width: 100%; height: 100%; position: relative; }
        
        .gallery-item img, .gallery-item video { 
            width: 100%; height: 100%; object-fit: cover; display: block; 
            filter: grayscale(100%) contrast(110%) brightness(95%);
            transition: filter 0.4s ease, transform 0.4s ease, clip-path 0.4s ease, box-shadow 0.4s ease;
            background-color: #ccc;
        }

        .gallery-item.project-hovered { z-index: 5000 !important; }
        .gallery-item.project-hovered img, .gallery-item.project-hovered video { filter: grayscale(0%) contrast(105%) brightness(100%); }
        
        /* HOVER FIX: Stays exactly the same size, but reveals missing corners */
        .gallery-item:hover img, .gallery-item:hover video {
            box-shadow: 0 15px 35px rgba(0,0,0,0.3); 
            border-radius: 2px;
            clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%) !important; 
            z-index: 6000; 
            position: relative;
        }

        /* Scales only when the map is fully zoomed out so you can actually see what you hover */
        body.is-zoomed .gallery-item:hover img, body.is-zoomed .gallery-item:hover video { transform: scale(2.0); box-shadow: 0 25px 50px rgba(0,0,0,0.4); }

        .shape-block img, .shape-block video, img.shape-block, video.shape-block { clip-path: inset(1px); } 
        .shape-chamfer-tr img, .shape-chamfer-tr video, img.shape-chamfer-tr, video.shape-chamfer-tr { clip-path: polygon(1px 1px, calc(100% - 25px) 1px, calc(100% - 1px) 25px, calc(100% - 1px) calc(100% - 1px), 1px calc(100% - 1px)); } 
        .shape-chamfer-bl img, .shape-chamfer-bl video, img.shape-chamfer-bl, video.shape-chamfer-bl { clip-path: polygon(1px 1px, calc(100% - 1px) 1px, calc(100% - 1px) calc(100% - 1px), 25px calc(100% - 1px), 1px calc(100% - 25px)); } 
        .shape-slant-top img, .shape-slant-top video, img.shape-slant-top, video.shape-slant-top { clip-path: polygon(1px 15px, calc(100% - 1px) 1px, calc(100% - 1px) calc(100% - 1px), 1px calc(100% - 1px)); } 
        .shape-slant-bottom img, .shape-slant-bottom video, img.shape-slant-bottom, video.shape-slant-bottom { clip-path: polygon(1px 1px, calc(100% - 1px) 1px, calc(100% - 1px) calc(100% - 15px), 1px calc(100% - 1px)); } 

        .size-xxs { width: 60px; height: 60px; }     
        .size-xs { width: 90px; height: 90px; }      
        .size-s { width: 130px; height: 130px; }     
        .size-m { width: 180px; height: 180px; }     
        .size-l { width: 240px; height: 240px; }     
        .size-xl { width: 300px; height: 300px; }    
        .size-wide { width: 240px; height: 120px; }  
        .size-tall { width: 120px; height: 240px; }  

        @media (max-width: 768px) {
            .size-xxs { width: 30px; height: 30px; } .size-xs { width: 45px; height: 45px; } .size-s { width: 65px; height: 65px; } .size-m { width: 90px; height: 90px; } .size-l { width: 120px; height: 120px; } .size-xl { width: 150px; height: 150px; } .size-wide { width: 120px; height: 60px; } .size-tall { width: 60px; height: 120px; }
            #zoom-controls { bottom: 20px !important; right: 20px !important; } #zoom-controls button { width: 35px !important; height: 35px !important; font-size: 1.2rem !important; }
        }

        .project-label { position: absolute; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 4px; color: var(--accent-red); font-weight: 700; text-decoration: none; pointer-events: auto; cursor: pointer; z-index: 2000; padding: 4px 0; opacity: 0; transition: opacity 1s ease 0.5s, color 0.3s ease; }
        .project-label:hover { color: #000; text-decoration: underline; }

        .project-desc {
            position: absolute; font-size: 0.95rem; line-height: 1.6; color: #555; max-width: 350px; pointer-events: auto; z-index: 2000; padding: 15px; border-left: 2px solid var(--accent-red); background: rgba(229, 229, 226, 0.95); backdrop-filter: blur(3px); opacity: 0; transition: opacity 1s ease 0.8s; 
        }

        /* Flâneries link styling (No square, no symbols, text-only underline) */
        .portal-btn {
            display: inline-block; 
            margin-top: 15px; 
            padding: 0; 
            border: none; 
            color: var(--text-color); 
            font-size: 0.95rem; 
            font-weight: bold; 
            cursor: pointer; 
            background: transparent; 
            text-decoration: underline;
            transition: color 0.2s ease;
        }
        .portal-btn:hover { color: var(--accent-red); }

        #zoom-controls { position: fixed; bottom: 40px; right: 40px; display: flex; gap: 12px; z-index: 8000; }
        #zoom-controls button { width: 40px; height: 40px; border-radius: 4px; background: transparent; border: 1px solid var(--text-color); color: var(--text-color); font-weight: 400; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease; padding: 0; }
        #zoom-controls button:hover { background: var(--text-color); color: var(--paper-bg); transform: scale(1.05); }

        .lightbox { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); display: none; justify-content: center; align-items: center; z-index: 9999; }
        .lightbox-content { position: relative; max-width: 85%; max-height: 85vh; }
        #lightbox-img, #lightbox-video { max-width: 100%; max-height: 85vh; box-shadow: 0 30px 60px rgba(0,0,0,0.2); }
        .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: none; border: none; font-size: 2rem; cursor: pointer; color: #666; }
        #prev-btn { left: -60px; } #next-btn { right: -60px; }
        #lightbox-counter { position: absolute; bottom: -40px; left: 50%; transform: translateX(-50%); font-size: 0.8rem; color: #bbb; }

        footer { position: relative; width: 100%; padding: 5rem 0; text-align: center; font-size: 0.7rem; color: #aaa; z-index: 10; }

        /* ==========================================================================
           THE FLÂNERIES DRAWER (ARCHIVAL INDEX)
           ========================================================================== */
        #flanerie-drawer {
            position: fixed;
            top: 100%; 
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--paper-bg);
            z-index: 9500;
            transition: top 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            overflow-y: auto;
            padding: 4rem 2rem;
            box-sizing: border-box;
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPjxm Filter id="n"><ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iMC45IiBudW1PY3RhdmVzPSI0IiBzdGl0Y2hUaWxlcz0ic3RpdGNoIi8+PC9maWx0ZXI+PHJlY3Qgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIgZmlsb=Im5vbmUiIGZpbHRlcj0idXJsKCNuKSIgb3BhY2l0eT0iMC4wOCIvPjwvc3ZnPg==');
        }
        
        #flanerie-drawer.open { top: 0; }
        
        /* Hidden by default so it doesn't appear on screen randomly */
        .close-drawer {
            display: none; 
            position: absolute; top: 30px; right: 40px; font-size: 1.5rem; cursor: pointer; background: none; border: none; color: var(--text-color); z-index: 9600;
        }
        .close-drawer:hover { color: var(--accent-red); }
        
        /* Only show the close button when the drawer itself is open */
        #flanerie-drawer.open .close-drawer { display: block; }

        .archive-table { width: 100%; max-width: 1100px; margin: 0 auto; }
        .archive-title { font-size: 2rem; text-transform: uppercase; border-bottom: 2px solid var(--text-color); padding-bottom: 1rem; margin-bottom: 2rem; }

        .archive-header { display: flex; font-weight: bold; border-bottom: 1px solid var(--text-color); padding-bottom: 10px; margin-bottom: 10px; font-size: 0.85rem; text-transform: uppercase; color: #777;}
        .col-time { width: 15%; }
        .col-media { width: 45%; }
        .col-notes { width: 40%; }

        .archive-row { display: flex; border-bottom: 1px solid #ccc; padding: 40px 0; align-items: flex-start; }
        .archive-row .col-time { font-weight: bold; font-size: 0.9rem; }
        .archive-row .col-media { padding-right: 40px; }
        
        .archive-row .col-media img, .archive-row .col-media video { 
            object-fit: cover;
            display: block; 
            filter: grayscale(100%); 
            cursor: pointer; 
            transition: filter 0.3s ease; 
        }
        .archive-row .col-media img:hover, .archive-row .col-media video:hover { filter: grayscale(0%); }
        .archive-row .col-notes { font-size: 0.9rem; line-height: 1.5; color: #333; }

        @media (max-width: 768px) {
            .archive-header { display: none; } 
            .archive-row { flex-direction: column; padding: 20px 0; }
            .col-time, .col-media, .col-notes { width: 100%; }
            .col-time { margin-bottom: 10px; }
            .col-media { margin-bottom: 15px; padding-right: 0; }
        }
    </style>

    </div>

    <div id="flanerie-drawer">
        <button class="close-drawer" onclick="closeFlanerie()">[ CLOSE X ]</button>
        <div class="archive-table">
            <h1 class="archive-title" id="flanerie-title">FLÂNERIES</h1>
            <div class="archive-header">
                <div class="col-time">Time</div>
                <div class="col-media">Visual Encounter</div>
                <div class="col-notes">Field Notes / Observations</div>
            </div>
            <div id="flanerie-content">
                </div>
        </div>
    </div>

    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <div class="lightbox-content" onclick="event.stopPropagation()">
            <button id="prev-btn" class="nav-btn" onclick="changeMedia(-1)">←</button>
            <img id="lightbox-img" src="" style="display:none;">
            <video id="lightbox-video" src="" controls loop autoplay playsinline style="display:none;"></video>
            <button id="next-btn" class="nav-btn" onclick="changeMedia(1)">→</button>
            <div id="lightbox-counter"></div>
        </div>
    </div>

    <script>
        const CONNECTION_STYLE = { color: "#bbb", width: "1.5", dashArray: "8,8", curveOffsetMobile: 50, curveOffsetDesktop: 250 };
        if ('scrollRestoration' in history) { history.scrollRestoration = 'manual'; }
        window.scrollTo(0, 0);

        const DOM_STATE = { projects: {} };
        const VARIED_SHAPES = ['shape-block', 'shape-block', 'shape-block', 'shape-block', 'shape-chamfer-tr', 'shape-chamfer-bl', 'shape-slant-top', 'shape-slant-bottom'];
        const centerDefs = [ {x: 30, y: 600}, {x: 70, y: 1900}, {x: 30, y: 3200}, {x: 70, y: 4500}, {x: 30, y: 5800}, {x: 70, y: 7100}, {x: 30, y: 8400} ];

        let projectCounter = 0;
        let currentScale = 1;

        // ==========================================================================
        // FLÂNERIES DATA (Paths accurately updated to img/walkthisway/[project]/flaneuries/)
        // ==========================================================================
        const FIELD_NOTES = {
            berlin: [
                { time: "09:15", type: "video", src: "img/walkthisway/berlin/flaneuries/1B2827BC-C290-4BB3-B2F4-FAD4F554026A_3.mov", text: "Commuters outside the station. The rhythm of the city starts early. Everyone moving with purpose.", size: "size-m" },
                { time: "11:30", type: "video", src: "img/walkthisway/berlin/flaneuries/1A48B6DD-8C37-4A84-8A98-51D3EE52BE2C_3.mov", text: "Waiting at the food stand. A quiet moment of pause amidst the concrete.", size: "size-tall" },
                { time: "14:20", type: "video", src: "img/walkthisway/berlin/flaneuries/1B6EA93D-C692-4C9B-9412-C5F6AD05A854_3.mov", text: "Interior glimpse. Groups gathering, the hum of conversation.", size: "size-wide" },
                { time: "15:45", type: "video", src: "img/walkthisway/berlin/flaneuries/1A904AE4-F387-4C18-8CD8-4CFCD3BC4C4E_3.mov", text: "Resting on the brick wall. A brief escape to eat ice cream.", size: "size-l" },
                { time: "17:00", type: "video", src: "img/walkthisway/berlin/flaneuries/1A2950C0-8FDA-4C61-923C-A82D6E3EAAA6_3.mov", text: "Walking past the market crates. The layers of the neighborhood.", size: "size-tall" },
                { time: "18:10", type: "img", src: "img/walkthisway/berlin/flaneuries/1A600455-9811-48B1-9F52-C883E4828BF9.jpeg", text: "Evening shadows elongating.", size: "size-m" },
                { time: "18:45", type: "video", src: "img/walkthisway/berlin/flaneuries/1B3F909A-B76C-4767-A8E3-9333CF581B94_3.mov", text: "Watching the street empty out.", size: "size-wide" },
                { time: "19:30", type: "img", src: "img/walkthisway/berlin/flaneuries/1B0161B8-5933-4804-9DA9-5567E71E2B98.jpeg", text: "Nightfall approaches.", size: "size-xl" },
                { time: "21:00", type: "img", src: "img/walkthisway/berlin/flaneuries/1BA01F62-7DE3-4A32-9ACF-DA8DCD63D650.jpeg", text: "The end of the route.", size: "size-l" }
            ],
            spain: [
                { time: "10:00", type: "img", src: "img/walkthisway/spain/flaneuries/R1-01880-0027.jpg", text: "Morning light in the plaza.", size: "size-m" }
            ]
        };

        window.changeZoom = (delta) => {
            const wrapper = document.getElementById('canvas-wrapper');
            const minScale = window.innerWidth < 768 ? 0.15 : 0.05;
            currentScale = Math.max(minScale, Math.min(2, currentScale + delta));
            if (currentScale < 1) {
                document.body.classList.add('is-zoomed');
                Object.keys(DOM_STATE.projects).forEach(projName => { if (!DOM_STATE.projects[projName].built) buildNeighborhood(projName); });
            } else {
                document.body.classList.remove('is-zoomed');
            }
            wrapper.style.transform = `scale(${currentScale})`;
        };

        window.resetCamera = () => {
            currentScale = 1; document.body.classList.remove('is-zoomed'); document.getElementById('canvas-wrapper').style.transform = 'scale(1)';
        };

        function* getGridSpiral(startX, startY, step) {
            let x = 0, y = 0, dx = step, dy = 0, segmentLength = 1, segmentPassed = 0;
            while (true) {
                yield { x: startX + x, y: startY + y };
                x += dx; y += dy; segmentPassed++;
                if (segmentPassed === segmentLength) {
                    segmentPassed = 0; let temp = dx; dx = -dy; dy = temp; if (dy === 0) segmentLength++;
                }
            }
        }

        function getSizesForProjectCount(count) {
            if (count > 15) return ['size-xs', 'size-s', 'size-m', 'size-tall', 'size-wide'];
            if (count > 8)  return ['size-s', 'size-m', 'size-l', 'size-tall', 'size-wide'];
            return ['size-m', 'size-l', 'size-xl', 'size-tall', 'size-wide'];
        }

        function initializeArchive() {
            const stream = document.getElementById('main-stream');
            const rawMedia = Array.from(stream.querySelectorAll(':scope > img, :scope > video'));
            const windowW = window.innerWidth;
            const isMobile = windowW < 1024;

            const projectCounts = {};
            rawMedia.forEach(m => { const name = m.getAttribute('data-project'); projectCounts[name] = (projectCounts[name] || 0) + 1; });

            rawMedia.forEach(media => {
                const name = media.getAttribute('data-project');
                const descSource = rawMedia.find(m => m.getAttribute('data-project') === name && m.hasAttribute('data-project-desc'));

                if (!DOM_STATE.projects[name]) {
                    const projIndex = projectCounter++;
                    const def = centerDefs[projIndex % centerDefs.length];
                    const targetCenterY = isMobile ? 600 + (projIndex * 1300) : def.y;

                    DOM_STATE.projects[name] = { index: projIndex, name: name, built: false, description: descSource ? descSource.getAttribute('data-project-desc') : '', elements: [], labelEl: null, descEl: null, context: null, targetCenterY: targetCenterY };

                    const label = document.createElement('a');
                    label.className = 'project-label';
                    label.innerText = name.toUpperCase(); 
                    label.href = "javascript:void(0)"; 
                    
                    label.onclick = (e) => {
                        e.stopPropagation(); e.preventDefault();
                        if (currentScale < 1) {
                            resetCamera(); setTimeout(() => { window.scrollTo({ top: DOM_STATE.projects[name].targetCenterY - 200, behavior: 'smooth' }); }, 400);
                        } else {
                            const firstMedia = document.querySelector(`.gallery-item[data-project="${name}"] img, .gallery-item[data-project="${name}"] video`);
                            if(firstMedia) openMapLightbox(name, firstMedia.getAttribute('src'));
                        }
                    };

                    stream.appendChild(label);
                    DOM_STATE.projects[name].labelEl = label;

                    if (DOM_STATE.projects[name].description) {
                        const desc = document.createElement('div');
                        desc.className = 'project-desc';
                        
                        let content = `<p>${DOM_STATE.projects[name].description}</p>`;
                        
                        // FLÂNERIES BUTTON LOGIC (Underlined link style, no borders)
                        if (FIELD_NOTES[name]) {
                            content += `<button class="portal-btn" onclick="openFlanerie('${name}')">FLÂNERIES</button>`;
                        }
                        
                        desc.innerHTML = content;
                        stream.appendChild(desc);
                        DOM_STATE.projects[name].descEl = desc;
                    }
                }

                const clone = media.cloneNode(true);
                clone.classList.remove('raw-media');
                clone.setAttribute('loading', 'lazy');

                const wrapper = document.createElement('div');
                wrapper.className = 'gallery-item';
                wrapper.style.zIndex = Math.floor(Math.random() * 500) + 10;
                wrapper.dataset.project = name;

                const allowedSizes = getSizesForProjectCount(projectCounts[name]);
                const sizeClass = media.getAttribute('data-size') || allowedSizes[Math.floor(Math.random() * allowedSizes.length)];

                if(media.getAttribute('data-shape')) wrapper.classList.add(media.getAttribute('data-shape'));
                else wrapper.classList.add(VARIED_SHAPES[Math.floor(Math.random() * VARIED_SHAPES.length)]);
                
                wrapper.classList.add(sizeClass);

                const container = document.createElement('div');
                container.className = 'media-container';
                if(media.tagName === 'VIDEO') media.play();
                container.appendChild(media);
                wrapper.appendChild(container);

                const targetY = DOM_STATE.projects[name].targetCenterY;
                const spreadX = Math.max(20, Math.random() * (windowW - 250));
                const spreadY = targetY + (Math.random() * 1000 - 500); 
                const spreadRot = (Math.random() * 120 - 60).toFixed(1); 
                
                wrapper.style.left = `${spreadX}px`; wrapper.style.top = `${spreadY}px`; wrapper.style.transform = `rotate(${spreadRot}deg)`;

                wrapper.addEventListener('mouseenter', () => {
                    if (!DOM_STATE.projects[name].built) buildNeighborhood(name);
                    document.querySelectorAll(`.gallery-item[data-project="${name}"]`).forEach(el => el.classList.add('project-hovered'));
                });

                wrapper.addEventListener('mouseleave', () => { document.querySelectorAll(`.gallery-item[data-project="${name}"]`).forEach(el => el.classList.remove('project-hovered')); });

                wrapper.onclick = (e) => {
                    e.stopPropagation();
                    if (currentScale < 1) {
                        resetCamera(); setTimeout(() => { window.scrollTo({ top: DOM_STATE.projects[name].targetCenterY - 200, behavior: 'smooth' }); }, 400); 
                    } else {
                        openMapLightbox(name, media.getAttribute('src'));
                    }
                };
                
                stream.appendChild(wrapper);
                wrapper.offsetWidth; requestAnimationFrame(() => { wrapper.classList.add('ready-to-move'); });
                DOM_STATE.projects[name].elements.push(wrapper);
            });
        }

        function buildNeighborhood(projectName) {
            const proj = DOM_STATE.projects[projectName];
            proj.built = true; 
            const windowW = window.innerWidth;
            const isMobile = windowW < 1024; 
            const def = centerDefs[proj.index % centerDefs.length];
            const minX = isMobile ? 20 : 450; 
            const mainCenterX = Math.max(minX, (def.x * windowW / 100));
            const mainCenterY = proj.targetCenterY; 
            proj.context = { x: mainCenterX, y: mainCenterY };

            const occupiedRects = [];
            let textStartX = isMobile ? 20 : mainCenterX - 400;
            let currentTextY = mainCenterY - 100; 

            proj.labelEl.style.left = `${textStartX}px`; proj.labelEl.style.top = `${currentTextY}px`; proj.labelEl.style.opacity = '1';
            occupiedRects.push({ l: textStartX - 20, r: textStartX + 350, t: currentTextY - 20, b: currentTextY + 60 });
            currentTextY += 50;

            if (proj.descEl) {
                proj.descEl.style.left = `${textStartX}px`; proj.descEl.style.top = `${currentTextY}px`; proj.descEl.style.opacity = '1';
                occupiedRects.push({ l: textStartX - 20, r: textStartX + 350, t: currentTextY - 20, b: currentTextY + 250 });
            }

            proj.elements.forEach((wrapper) => {
                wrapper.style.transform = `rotate(0deg)`; wrapper.style.zIndex = 10; 
                const w = wrapper.offsetWidth || 130; const h = wrapper.offsetHeight || 130;
                let found = false; const gridSearch = getGridSpiral(mainCenterX, mainCenterY, 10);

                while (!found) {
                    const pos = gridSearch.next().value;
                    const testRect = { l: pos.x - w/2, r: pos.x + w/2, t: pos.y - h/2, b: pos.y + h/2 };
                    const isOutOfBounds = (testRect.l < 20 || testRect.r > windowW - 20);
                    const collision = isOutOfBounds || occupiedRects.some(r => { return (testRect.l < r.r && testRect.r > r.l && testRect.t < r.b && testRect.b > r.t); });

                    if (!collision) {
                        wrapper.style.left = `${testRect.l}px`; wrapper.style.top = `${testRect.t}px`; occupiedRects.push(testRect); found = true;
                    }
                }
            });
            updateMapLines();
        }

        function updateMapLines() {
            const svg = document.getElementById('map-canvas'); svg.innerHTML = ''; 
            const isMobile = window.innerWidth < 768; 
            const builtProjects = Object.values(DOM_STATE.projects).filter(p => p.built).sort((a, b) => a.index - b.index);

            for (let i = 0; i < builtProjects.length - 1; i++) {
                const start = builtProjects[i].context; const end = builtProjects[i+1].context;
                if (builtProjects[i+1].index - builtProjects[i].index === 1) {
                    const line = document.createElementNS("http://www.w3.org/2000/svg", "path");
                    const curveOffset = isMobile ? CONNECTION_STYLE.curveOffsetMobile : CONNECTION_STYLE.curveOffsetDesktop; 
                    const d = `M ${start.x} ${start.y} Q ${(start.x + end.x)/2 + curveOffset} ${(start.y + end.y)/2} ${end.x} ${end.y}`;
                    line.setAttribute("d", d); line.setAttribute("stroke", CONNECTION_STYLE.color); line.setAttribute("stroke-width", CONNECTION_STYLE.width); line.setAttribute("fill", "none"); line.setAttribute("stroke-dasharray", CONNECTION_STYLE.dashArray);
                    line.style.opacity = 0; line.style.transition = "opacity 1.5s ease 0.5s"; svg.appendChild(line);
                    setTimeout(() => line.style.opacity = 1, 50);
                }
            }
        }

        function openFlanerie(cityKey) {
            const drawer = document.getElementById('flanerie-drawer');
            const title = document.getElementById('flanerie-title');
            const content = document.getElementById('flanerie-content');
            
            title.innerText = `FLÂNERIES: ${cityKey}`;
            content.innerHTML = ''; 

            const data = FIELD_NOTES[cityKey] || [];
            
            data.forEach((note, index) => {
                const row = document.createElement('div');
                row.className = 'archive-row';
                
                const sizeClass = note.size || 'size-l'; 
                const shapeClass = VARIED_SHAPES[Math.floor(Math.random() * VARIED_SHAPES.length)];

                let mediaHTML = '';
                if (note.type === 'video') {
                    mediaHTML = `<video class="${sizeClass} ${shapeClass}" src="${note.src}" muted loop autoplay playsinline onclick="openDrawerLightbox('${cityKey}', ${index})"></video>`;
                } else {
                    mediaHTML = `<img class="${sizeClass} ${shapeClass}" src="${note.src}" loading="lazy" onclick="openDrawerLightbox('${cityKey}', ${index})">`;
                }

                row.innerHTML = `
                    <div class="col-time">${note.time}</div>
                    <div class="col-media">${mediaHTML}</div>
                    <div class="col-notes">${note.text}</div>
                `;
                content.appendChild(row);
            });

            drawer.classList.add('open');
            document.body.style.overflow = 'hidden'; 
        }

        function closeFlanerie() {
            document.getElementById('flanerie-drawer').classList.remove('open');
            document.body.style.overflow = '';
        }

        window.activeLightboxItems = [];
        window.currentIndex = 0;

        function openMapLightbox(project, startSrc) {
            const items = Array.from(document.querySelectorAll(`.gallery-item[data-project="${project}"] img, .gallery-item[data-project="${project}"] video`));
            window.activeLightboxItems = items.map(media => ({ type: media.tagName.toLowerCase(), src: media.getAttribute('src') }));
            window.currentIndex = window.activeLightboxItems.findIndex(item => startSrc.includes(item.src));
            if (window.currentIndex === -1) window.currentIndex = 0;
            updateLightbox(); 
        }

        function openDrawerLightbox(cityKey, index) {
            const data = FIELD_NOTES[cityKey];
            window.activeLightboxItems = data.map(item => ({ type: item.type, src: item.src }));
            window.currentIndex = index;
            updateLightbox();
        }

        function updateLightbox() {
            if(!window.activeLightboxItems || window.activeLightboxItems.length === 0) return;
            const item = window.activeLightboxItems[window.currentIndex]; 
            const lbImg = document.getElementById('lightbox-img'); 
            const lbVid = document.getElementById('lightbox-video');
            
            if (item.type === 'img') { 
                lbImg.src = item.src; lbImg.style.display = 'block'; lbVid.style.display = 'none'; lbVid.pause(); 
            } else { 
                lbVid.src = item.src; lbVid.style.display = 'block'; lbImg.style.display = 'none'; lbVid.play(); 
            }
            document.getElementById('lightbox-counter').innerText = `${window.currentIndex + 1} / ${window.activeLightboxItems.length}`;
            document.getElementById('lightbox').style.display = 'flex';
        }

        window.changeMedia = (step) => {
            window.currentIndex = (window.currentIndex + step + window.activeLightboxItems.length) % window.activeLightboxItems.length;
            updateLightbox();
        };

        window.closeLightbox = () => { 
            document.getElementById('lightbox').style.display = 'none'; document.getElementById('lightbox-video').pause();
        };

        document.addEventListener('keydown', (e) => {
            const lb = document.getElementById('lightbox');
            if (lb.style.display === 'flex') {
                if (e.key === 'ArrowLeft') changeMedia(-1);
                if (e.key === 'ArrowRight') changeMedia(1);
                if (e.key === 'Escape') closeLightbox();
            }
        });

        window.addEventListener('DOMContentLoaded', initializeArchive);
    </script>
