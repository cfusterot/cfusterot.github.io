<script>
/* Load the published Source composition from its single authoritative path.
   The timestamp prevents GitHub Pages/browser cache from showing an older
   layout after layouts/source_layout.js is replaced. */
window.__SOURCE_LAYOUT_READY__ = new Promise(resolve => {
  const script = document.createElement("script");
  script.src = "layouts/source_layout.js?v=" + Date.now();
  script.onload = () => resolve(true);
  script.onerror = () => {
    console.error("Could not load layouts/source_layout.js");
    resolve(false);
  };
  document.head.appendChild(script);
});
</script>
<script>
/* Always fetch the current Source catalogue. A normal <script src> may remain
   cached after Publicar_Imagenes_Web.command regenerates the manifest. */
window.loadSourceMediaManifest = async function () {
  if (location.protocol === "file:") {
    return await new Promise(resolve => {
      window.SOURCE_MEDIA = [];
      const script = document.createElement("script");
      script.src = "source_media_manifest.js?v=" + Date.now();
      script.onload = () => resolve(Array.isArray(window.SOURCE_MEDIA));
      script.onerror = () => {
        console.error("Could not load source_media_manifest.js");
        resolve(false);
      };
      document.head.appendChild(script);
    });
  }

  try {
    const response = await fetch(
      "source_media_manifest.js?v=" + Date.now(),
      {cache: "no-store"}
    );
    if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);

    const code = await response.text();
    const holder = {};
    new Function("window", code)(holder);
    window.SOURCE_MEDIA = Array.isArray(holder.SOURCE_MEDIA)
      ? holder.SOURCE_MEDIA
      : [];
    return true;
  } catch (error) {
    console.error("Could not load source_media_manifest.js:", error);
    window.SOURCE_MEDIA = [];
    return false;
  }
};
window.__SOURCE_MEDIA_READY__ = window.loadSourceMediaManifest();
</script>

<script>
/* Persist the user's folder state. First visit = all closed. */
(function () {
    const KEY = "archiveTreeOpenStateV2";

    function loadState() {
        try { return JSON.parse(localStorage.getItem(KEY) || "{}"); }
        catch { return {}; }
    }

    function saveState(state) {
        try { localStorage.setItem(KEY, JSON.stringify(state)); }
        catch {}
    }

    function restoreTree() {
        const state = loadState();

        document.querySelectorAll(".file-tree details[data-tree-id]").forEach(details => {
            const id = details.dataset.treeId;
            details.open = Object.prototype.hasOwnProperty.call(state, id)
                ? !!state[id]
                : false;

            details.addEventListener("toggle", () => {
                const current = loadState();
                current[id] = details.open;
                saveState(current);
            });
        });

        document.documentElement.classList.remove("tree-state-pending");
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", restoreTree, {once:true});
    } else {
        restoreTree();
    }
})();
</script>

<script>
(async function(){
  await (window.__SOURCE_LAYOUT_READY__ || Promise.resolve());
  const LOCAL = location.protocol === "file:" ||
                location.hostname === "localhost" ||
                location.hostname === "127.0.0.1";

  const stage = document.getElementById("source-stage");
  const main = stage.closest(".source-main");
  const controls = document.getElementById("source-editor-controls");
  const status = document.getElementById("source-save-status");
  const popover = document.getElementById("source-popover");
  const popTitle = document.getElementById("source-popover-title");
  const popDescription = document.getElementById("source-popover-description");
  const popLink = document.getElementById("source-popover-link");
  const KEY = "sourceManualLayoutV2";
  const WINDOW_NAME_PREFIX = "SOURCE_LAYOUT_V2:";

  let editing = false;
  let selected = null;
  let maxZ = 1000;
  let stageScale = 1;
  let geometryFrame = 0;

  function elements(){ return Array.from(stage.querySelectorAll(".source-item")); }

  function updateStageGeometry(){
    geometryFrame = 0;
    const items = elements();
    const availableWidth = Math.max(1, main.clientWidth || window.innerWidth);
    let contentRight = availableWidth;
    let contentBottom = 0;

    items.forEach(el => {
      const left = Number.parseFloat(el.style.left) || el.offsetLeft || 0;
      const top = Number.parseFloat(el.style.top) || el.offsetTop || 0;
      const width = el.offsetWidth || Number.parseFloat(el.style.width) || 0;
      const height = el.offsetHeight || 0;
      contentRight = Math.max(contentRight, left + width);
      contentBottom = Math.max(contentBottom, top + height);
    });

    const canvasWidth = Math.max(960, Math.ceil(contentRight + 40));
    const isMobile = window.matchMedia("(max-width:800px)").matches;
    stageScale = isMobile ? Math.min(1, availableWidth / canvasWidth) : 1;

    const bottomSpace = editing ? Math.max(520, window.innerHeight * .6) : 70;
    const naturalHeight = Math.max(items.length ? contentBottom + bottomSpace : window.innerHeight, 1);
    const renderedHeight = Math.ceil(naturalHeight * stageScale);

    stage.style.width = canvasWidth + "px";
    stage.style.height = Math.ceil(naturalHeight) + "px";
    stage.style.transform = `scale(${stageScale})`;
    main.style.height = renderedHeight + "px";
    main.style.minHeight = isMobile ? "0px" : "100vh";
  }

  function scheduleStageGeometry(){
    if (geometryFrame) cancelAnimationFrame(geometryFrame);
    geometryFrame = requestAnimationFrame(updateStageGeometry);
  }

  function currentStageScale(){
    return stageScale || 1;
  }

  const itemResizeObserver = "ResizeObserver" in window
    ? new ResizeObserver(scheduleStageGeometry)
    : null;

  function makeId(){
    return "source-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,7);
  }

  function ensureHandle(el){
    if (el.querySelector(":scope > .source-resize-handle")) return;
    const handle = document.createElement("span");
    handle.className = "source-resize-handle";
    el.appendChild(handle);
    bindResize(el, handle);
  }

  function recordFor(el){
    const img = el.querySelector(":scope > img");
    return {
      id: el.dataset.sourceId,
      type: el.dataset.type || (img ? "image" : "concept"),
      src: img ? img.getAttribute("src") : "",
      text: img ? "" : el.childNodes[0]?.textContent?.trim() || el.dataset.title || "",
      title: el.dataset.title || "",
      description: el.dataset.description || "",
      href: el.dataset.href || "",
      left: el.style.left || "20px",
      top: el.style.top || "20px",
      width: el.style.width || "",
      transform: el.style.transform || "",
      zIndex: el.style.zIndex || ""
    };
  }

  function serialize(){ return elements().map(recordFor); }

  function showSaved(){
    if (!status) return;
    status.style.display = "block";
    status.textContent = "saved ✓";
    clearTimeout(showSaved.timer);
    showSaved.timer = setTimeout(() => status.style.display = "none", 1200);
  }

  function saveLocal(show=true){
    const data = serialize();
    const raw = JSON.stringify(data);
    try { localStorage.setItem(KEY, raw); } catch {}
    try { window.name = WINDOW_NAME_PREFIX + raw; } catch {}
    if (show) showSaved();
  }

  function loadSaved(){
    /*
      LOCAL editing:
        localStorage/window.name override layouts/source_layout.js while arranging.

      PUBLIC / GitHub Pages:
        layouts/source_layout.js is authoritative.
        Never let an old browser-local copy override the published file.
    */
    if (!LOCAL) {
      return Array.isArray(window.SOURCE_LAYOUT) ? window.SOURCE_LAYOUT : null;
    }

    let saved = null;

    try {
      const raw = localStorage.getItem(KEY);
      if (raw) saved = JSON.parse(raw);
    } catch {}

    if (!saved) {
      try {
        if (window.name && window.name.startsWith(WINDOW_NAME_PREFIX)) {
          saved = JSON.parse(window.name.slice(WINDOW_NAME_PREFIX.length));
        }
      } catch {}
    }

    if (!saved && Array.isArray(window.SOURCE_LAYOUT)) {
      saved = window.SOURCE_LAYOUT;
    }

    return saved;
  }

  function normalizeLayoutItem(rawItem){
    const item = {...(rawItem || {})};
    const preview = String(item.src || "").match(
      /^(.*\/)(?:_pdf_previews|pdf_previews)\/([^/?#]+)\.(?:jpe?g|png|webp)([?#].*)?$/i
    );

    /* Migrate PDF cards saved by older editor versions. This also repairs an
       old localStorage draft before it can be downloaded again. */
    if (item.type === "pdf" || preview) {
      item.type = "pdf";
      if (preview) {
        item.src = `${preview[1]}pdf_previews/${preview[2]}.jpg${preview[3] || ""}`;
        if (!item.href) item.href = `${preview[1]}${preview[2]}.pdf`;
      }
    }
    return item;
  }

  function createElement(rawItem){
    const item = normalizeLayoutItem(rawItem);
    const isMedia = item.type === "image" || item.type === "pdf";
    const el = document.createElement("div");
    el.className = "source-item " + (isMedia ? "source-image" : "source-concept");
    el.dataset.sourceId = item.id || makeId();
    el.dataset.type = item.type || "concept";
    el.dataset.title = item.title || "";
    el.dataset.description = item.description || "";
    el.dataset.href = item.href || "";

    el.style.left = item.left || "20px";
    el.style.top = item.top || "20px";
    if (item.width) el.style.width = item.width;
    if (item.transform !== undefined) el.style.transform = item.transform;
    if (item.zIndex !== undefined) el.style.zIndex = item.zIndex;

    if (isMedia) {
      const img = document.createElement("img");
      img.src = item.src || "";
      img.alt = item.title || "";
      img.addEventListener("load", scheduleStageGeometry, {once:true});
      img.addEventListener("error", scheduleStageGeometry, {once:true});
      el.appendChild(img);
    } else {
      el.appendChild(document.createTextNode(item.text || item.title || "concept"));
    }

    stage.appendChild(el);
    bindItem(el);
    scheduleStageGeometry();
    return el;
  }

  function rebuild(layout){
    stage.innerHTML = "";
    (layout || []).forEach(createElement);
    scheduleStageGeometry();
  }

  function showPopover(el){
    if (editing) return;
    popTitle.textContent = el.dataset.title || "source";
    popDescription.textContent = el.dataset.description || "";
    const href = el.dataset.href || "";
    popLink.style.display = href ? "inline-block" : "none";
    popLink.href = href || "#";
    popLink.textContent = el.dataset.type === "pdf" ? "[ open PDF ]" : "[ open source ]";

    const r = el.getBoundingClientRect();
    const width = 330;
    const left = Math.min(window.innerWidth - width - 14, Math.max(14, r.right + 12));
    const top = Math.min(window.innerHeight - 170, Math.max(14, r.top));
    popover.style.left = left + "px";
    popover.style.top = top + "px";
    popover.classList.add("open");
  }

  function select(el){
    elements().forEach(x => x.classList.remove("selected-source"));
    ensureHandle(el);
    el.classList.add("selected-source");
    selected = el;
  }

  function bindResize(el, handle){
    handle.addEventListener("pointerdown", ev => {
      if (!editing) return;
      ev.preventDefault();
      ev.stopPropagation();
      select(el);

      const startX = ev.clientX;
      const startW = el.getBoundingClientRect().width;
      handle.setPointerCapture(ev.pointerId);

      const move = e => {
        const scale = currentStageScale();
        el.style.width = Math.max(55, (startW + (e.clientX - startX)) / scale) + "px";
        scheduleStageGeometry();
      };
      const up = e => {
        try { handle.releasePointerCapture(e.pointerId); } catch {}
        handle.removeEventListener("pointermove", move);
        handle.removeEventListener("pointerup", up);
        saveLocal(false);
        scheduleStageGeometry();
      };

      handle.addEventListener("pointermove", move);
      handle.addEventListener("pointerup", up);
    });
  }

  function bindItem(el){
    ensureHandle(el);
    itemResizeObserver?.observe(el);
    const image = el.querySelector(":scope > img");
    if (image && !image.complete) {
      image.addEventListener("load", scheduleStageGeometry, {once:true});
      image.addEventListener("error", scheduleStageGeometry, {once:true});
    }

    el.addEventListener("click", ev => {
      if (editing) {
        ev.preventDefault();
        ev.stopPropagation();
        select(el);
      } else {
        ev.preventDefault();
        ev.stopPropagation();
        showPopover(el);
      }
    });

    el.addEventListener("dblclick", ev => {
      if (!editing) return;
      ev.preventDefault();
      ev.stopPropagation();
      select(el);
      openMetaEditor(el);
    });

    el.addEventListener("pointerdown", ev => {
      if (!editing || ev.target.classList.contains("source-resize-handle")) return;
      ev.preventDefault();
      ev.stopPropagation();
      select(el);

      const r = el.getBoundingClientRect();
      const scale = currentStageScale();
      const ox = (ev.clientX - r.left) / scale;
      const oy = (ev.clientY - r.top) / scale;
      el.classList.add("source-dragging");
      el.setPointerCapture(ev.pointerId);

      const move = e => {
        if (e.clientY > window.innerHeight - 48) window.scrollBy(0, 18);
        if (e.clientY < 48) window.scrollBy(0, -18);
        const liveStageRect = stage.getBoundingClientRect();
        el.style.left = Math.max(0, (e.clientX - liveStageRect.left) / scale - ox) + "px";
        el.style.top = Math.max(0, (e.clientY - liveStageRect.top) / scale - oy) + "px";
        scheduleStageGeometry();
      };
      const up = e => {
        try { el.releasePointerCapture(e.pointerId); } catch {}
        el.classList.remove("source-dragging");
        el.removeEventListener("pointermove", move);
        el.removeEventListener("pointerup", up);
        saveLocal(false);
        scheduleStageGeometry();
      };

      el.addEventListener("pointermove", move);
      el.addEventListener("pointerup", up);
    });
  }

  document.getElementById("source-popover-close").addEventListener("click", () => {
    popover.classList.remove("open");
  });

  document.addEventListener("click", ev => {
    if (!popover.contains(ev.target) && !ev.target.closest(".source-item")) {
      popover.classList.remove("open");
    }
  });

  const saved = loadSaved();
  if (Array.isArray(saved) && saved.length) {
    rebuild(saved);
  } else {
    elements().forEach(bindItem);
  }

  scheduleStageGeometry();
  window.addEventListener("load", scheduleStageGeometry, {once:true});
  window.addEventListener("resize", scheduleStageGeometry);

  if (!LOCAL) {
    controls.remove();
    document.getElementById("source-editor-toggle")?.remove();
    return;
  }

  const toggle = document.getElementById("source-editor-toggle");
  const done = document.getElementById("source-done");
  toggle.style.display = "block";

  function setEditing(value){
    editing = !!value;
    document.body.classList.toggle("source-edit-mode", editing);
    scheduleStageGeometry();

    if (!editing) {
      elements().forEach(x => x.classList.remove("selected-source"));
      selected = null;
      metaEditor.classList.remove("visible");
      libraryPanel.classList.remove("open");
      saveLocal(false);
    }
  }

  toggle.onclick = () => setEditing(true);
  done.onclick = () => setEditing(false);



  const libraryPanel = document.getElementById("source-library");
  const libraryGrid = document.getElementById("source-library-grid");
  const libraryStatus = document.getElementById("source-library-status");
  const metaEditor = document.getElementById("source-meta-editor");
  const metaTitle = document.getElementById("source-meta-title");
  const metaDescription = document.getElementById("source-meta-description");
  const metaHref = document.getElementById("source-meta-href");

  function sourceMediaCatalogue(){
    const media = Array.isArray(window.SOURCE_MEDIA) ? window.SOURCE_MEDIA : [];
    return media.filter(x => x && x.src);
  }

  function safeSourceUrl(src){
    return String(src||"")
      .split("/")
      .map(part=>{
        try{return encodeURIComponent(decodeURIComponent(part))}
        catch{return encodeURIComponent(part)}
      })
      .join("/");
  }

  async function scanLocalSourceDirectory(){
    if(!LOCAL || location.protocol==="file:") return [];

    const siteRoot=new URL(".",location.href);
    const sourceRoot=new URL("img/source/",siteRoot);
    const queue=[sourceRoot];
    const visited=new Set();
    const records=[];
    const allowed=/\.(?:jpe?g|png|webp|gif|avif|bmp|svg)$/i;

    while(queue.length){
      const directory=queue.shift();
      if(visited.has(directory.href)) continue;
      visited.add(directory.href);

      let response;
      try{
        response=await fetch(directory.href+"?v="+Date.now(),{cache:"no-store"});
      }catch{
        continue;
      }
      if(!response.ok) continue;

      const html=await response.text();
      const doc=new DOMParser().parseFromString(html,"text/html");

      doc.querySelectorAll("a[href]").forEach(anchor=>{
        const href=anchor.getAttribute("href")||"";
        if(!href || href.startsWith("?") || href.startsWith("#") || href==="../") return;

        const url=new URL(href,directory);
        if(url.origin!==location.origin || !url.pathname.startsWith(sourceRoot.pathname)) return;

        if(url.pathname.endsWith("/")){
          if(!visited.has(url.href)) queue.push(url);
          return;
        }
        if(!allowed.test(url.pathname)) return;

        const relativePath=url.pathname.startsWith(siteRoot.pathname)
          ? url.pathname.slice(siteRoot.pathname.length)
          : url.pathname.replace(/^\/+/, "");
        const filename=decodeURIComponent(url.pathname.split("/").pop()||"");
        records.push({
          src:relativePath,
          title:filename.replace(/\.[^.]+$/,"").replaceAll("_"," ").replaceAll("-"," "),
          description:"",
          href:""
        });
      });
    }

    return records;
  }

  function mergeSourceMedia(extra){
    const merged=new Map();
    /* Folder scanning is a local fallback. Manifest records come last so PDF
       metadata (type and href) cannot be replaced by a plain image record. */
    [...(Array.isArray(extra)?extra:[]),...sourceMediaCatalogue()].forEach(entry=>{
      if(!entry?.src) return;
      const key=safeSourceUrl(entry.src);
      merged.set(key,{...entry,src:key});
    });
    window.SOURCE_MEDIA=Array.from(merged.values());
  }

  async function refreshSourceCatalogue(forceManifest=false){
    if(forceManifest){
      window.__SOURCE_MEDIA_READY__=window.loadSourceMediaManifest();
    }
    const manifestLoaded=await window.__SOURCE_MEDIA_READY__;
    const manifestCount=sourceMediaCatalogue().length;
    const live=await scanLocalSourceDirectory();
    mergeSourceMedia(live);

    if(libraryStatus){
      libraryStatus.textContent=
        `${sourceMediaCatalogue().length} images detected · manifest ${manifestCount}`+
        (LOCAL && location.protocol!=="file:" ? ` · folder scan ${live.length}` : "")+
        (manifestLoaded ? "" : " · manifest unavailable");
    }
  }

  function usedImageSources(){
    return new Set(
      elements()
        .map(el => safeSourceUrl(el.querySelector(":scope > img")?.getAttribute("src")))
        .filter(Boolean)
    );
  }

  function renderSourceLibrary(){
    libraryGrid.innerHTML = "";
    const used = usedImageSources();

    const catalogue=sourceMediaCatalogue();
    if(!catalogue.length){
      const empty=document.createElement("div");
      empty.style.cssText="grid-column:1/-1;font-size:10px;line-height:1.4;padding:8px";
      empty.textContent="No Source media found. Run Publicar_Imagenes_Web.command and press refresh.";
      libraryGrid.appendChild(empty);
      return;
    }

    catalogue.forEach(entry => {
      const safeSrc=safeSourceUrl(entry.src);
      const card = document.createElement("div");
      card.className = "source-library-item";
      if (used.has(safeSrc)) card.classList.add("used");

      const img = document.createElement("img");
      img.src = safeSrc;
      img.alt = entry.title || entry.src.split("/").pop();

      const label = document.createElement("div");
      label.textContent = (entry.type === "pdf" ? "PDF · " : "") +
        (entry.title || entry.src.split("/").pop());

      img.addEventListener("error", () => {
        card.classList.add("source-library-load-error");
        label.textContent = "IMAGE ERROR · " + (entry.title || entry.src.split("/").pop());
        label.title = img.src;
      }, {once:true});

      card.append(img,label);
      card.addEventListener("click", () => {
        const el = createElement({
          id: makeId(),
          type: entry.type === "pdf" ? "pdf" : "image",
          src: safeSrc,
          title: entry.title || "",
          description: entry.description || "",
          href: entry.href || "",
          left: (60 + Math.random()*520) + "px",
          top: (70 + Math.random()*700) + "px",
          width: (160 + Math.random()*120) + "px",
          transform: "rotate(0deg)"
        });
        setEditing(true);
        select(el);
        openMetaEditor(el);
        saveLocal(false);
        renderSourceLibrary();
      });

      libraryGrid.appendChild(card);
    });
  }

  function openMetaEditor(el){
    if (!el) return;
    selected = el;
    metaTitle.value = el.dataset.title || "";
    metaDescription.value = el.dataset.description || "";
    metaHref.value = el.dataset.href || "";
    metaEditor.classList.add("visible");
  }

  document.getElementById("source-library-open").onclick = async () => {
    await refreshSourceCatalogue(false);
    renderSourceLibrary();
    libraryPanel.classList.add("open");
    libraryPanel.setAttribute("aria-hidden","false");
  };

  document.getElementById("source-library-close").onclick = () => {
    libraryPanel.classList.remove("open");
    libraryPanel.setAttribute("aria-hidden","true");
  };

  document.getElementById("source-library-refresh").onclick = async () => {
    await refreshSourceCatalogue(true);
    renderSourceLibrary();
  };

  document.getElementById("source-edit-meta").onclick = () => {
    if (selected) openMetaEditor(selected);
  };

  document.getElementById("source-meta-apply").onclick = () => {
    if (!selected) return;
    selected.dataset.title = metaTitle.value.trim();
    selected.dataset.description = metaDescription.value.trim();
    selected.dataset.href = metaHref.value.trim();

    if (selected.dataset.type === "concept") {
      const handle = selected.querySelector(":scope > .source-resize-handle");
      selected.childNodes[0].textContent = metaTitle.value.trim() || "concept";
      if (handle && handle.parentNode !== selected) selected.appendChild(handle);
    } else {
      const img = selected.querySelector(":scope > img");
      if (img) img.alt = metaTitle.value.trim();
    }

    saveLocal(false);
    showSaved();
    scheduleStageGeometry();
  };

  document.getElementById("source-meta-close").onclick = () => {
    metaEditor.classList.remove("visible");
  };

  document.getElementById("source-add-text").onclick = () => {
    const text = prompt("Concept / text");
    if (!text) return;
    const description = prompt("Description shown when clicked") || "";
    const href = prompt("Optional URL") || "";

    const el = createElement({
      id: makeId(),
      type: "concept",
      text,
      title: text,
      description,
      href,
      left: (90 + Math.random()*520) + "px",
      top: (100 + Math.random()*650) + "px",
      width: (150 + Math.random()*120) + "px",
      transform: "rotate(0deg)"
    });
    setEditing(true);
    select(el);
    saveLocal(false);
  };

  document.getElementById("source-remove").onclick = () => {
    if (!selected) return;
    selected.remove();
    selected = null;
    metaEditor.classList.remove("visible");
    saveLocal(false);
    scheduleStageGeometry();
  };

  document.getElementById("source-front").onclick = () => {
    if (!selected) return;
    selected.style.zIndex = ++maxZ;
    saveLocal(false);
  };

  document.getElementById("source-save").onclick = () => saveLocal(true);

  document.getElementById("source-reset").onclick = () => {
    try { localStorage.removeItem(KEY); } catch {}
    if (window.name.startsWith(WINDOW_NAME_PREFIX)) window.name = "";
    location.reload();
  };

  document.getElementById("source-download").onclick = () => {
    const js = "window.SOURCE_LAYOUT = " + JSON.stringify(serialize(), null, 2) + ";\n";
    const blob = new Blob([js], {type:"text/javascript"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "source_layout.js";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  };
})();
</script>
