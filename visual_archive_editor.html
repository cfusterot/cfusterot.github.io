<script>
/* v12.36 — single source of truth: the current file in /layouts/. */
window.__VA_VIEW__ = new URLSearchParams(location.search).get("view") || "";

window.__VA_LAYOUT_BASENAME__ =
  window.__VA_VIEW__
    ? `visual_archive_layout_${window.__VA_VIEW__}.js`
    : "visual_archive_layout.js";

/* Prefer the organised /layouts folder, but also recognise older repositories
   where the same file lived beside visual_archive_editor.html. */
window.__VA_LAYOUT_CANDIDATES__ = [
  `layouts/${window.__VA_LAYOUT_BASENAME__}`,
  window.__VA_LAYOUT_BASENAME__
];
window.__VA_LAYOUT_FILE__ = window.__VA_LAYOUT_CANDIDATES__[0];

window.__VA_LAYOUT_READY__ = (async () => {
  const errors = [];

  for (const filename of window.__VA_LAYOUT_CANDIDATES__) {
    try {
      const response = await fetch(
        filename + "?v=" + Date.now(),
        { cache: "no-store" }
      );

      if (!response.ok) {
        throw new Error(`${response.status} ${response.statusText}`);
      }

      const code = await response.text();
      const holder = {};
      new Function("window", code)(holder);
      const layout = holder.VISUAL_ARCHIVE_LAYOUT;

      if (!layout || !Array.isArray(layout.items)) {
        throw new Error("file does not define window.VISUAL_ARCHIVE_LAYOUT");
      }

      window.__VA_LAYOUT_FILE__ = filename;
      window.VISUAL_ARCHIVE_LAYOUT = layout;
      window.__VA_LAYOUT_LOADED__ = true;
      return true;
    } catch (err) {
      errors.push(`${filename}: ${err.message}`);
    }
  }

  console.error("Could not read a Visual Archive layout:", errors.join(" | "));
  window.VISUAL_ARCHIVE_LAYOUT = {items:[], removed:[], annotations:[]};
  window.__VA_LAYOUT_LOADED__ = false;
  return false;
})();
</script>

.resize-handle.ne {

/* ===== file:/// archive shell ===== */
:root { --archive-sidebar: 250px; }

.archive-shell {
    min-height: 100vh;
    display: grid;
    grid-template-columns: var(--archive-sidebar) minmax(0, 1fr);
}

.file-sidebar {
    position: fixed;
    inset: 0 auto 0 0;
    width: var(--archive-sidebar);
    overflow-y: auto;
    z-index: 8000;
    background: transparent;
    border-right: 1px solid rgba(0,0,0,.18);
    padding: 18px 14px 40px;
}

.file-index-title {
    font-family: "Courier Prime", "Courier New", Courier, monospace !important;
    font-size: 20px;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(0,0,0,.18);
}

.file-tree {
    font-size: 12px;
    line-height: 1.75;
}

.file-tree details { margin: 2px 0; }
.file-tree summary { cursor: pointer; list-style: none; white-space: nowrap; }
.file-tree summary::-webkit-details-marker { display: none; }
.file-tree summary::before { content: "▸ "; color: #777; }
.file-tree details[open] > summary::before { content: "▾ "; }
.file-tree .folder::before { content: "📁 "; }
.file-tree .file::before { content: "📄 "; }
.file-tree .children { margin-left: 17px; }
.file-tree a { text-decoration: none; color: inherit; }
.file-tree a:hover { text-decoration: underline; }
.file-tree .active { font-weight: 700; }
.file-tree [aria-current="page"]{ text-decoration: underline; }

.archive-main {
    grid-column: 2;
    min-width: 0;
    padding: 18px 22px 80px;
}

.archive-path {
    font-family: "Courier Prime", "Courier New", Courier, monospace !important;
    font-size: 13px;
    margin: 0 0 22px;
    color: #666;
}

/* Cut-outs / transparent silhouettes */
.wall-item[data-kind="cutout"] img {
    object-fit: contain !important;
    clip-path: none !important;
    background: transparent !important;
}

@media (max-width: 800px) {
    :root { --archive-sidebar: 165px; }
    .file-sidebar { padding: 12px 9px 30px; }
    .file-index-title { font-size: 15px; }
    .file-tree { font-size: 10px; }
    .archive-main { padding: 14px 10px 60px; }
}


/* ===== 1990s desktop / classic file-browser styling ===== */

.file-sidebar {
    background: transparent;
    border-right: 2px solid #8b8b8b;
    box-shadow: inset -1px 0 0 #ffffff;
}

.file-index-title,
.archive-path,
.file-tree,
.file-tree a,
.file-tree summary,
.file-tree span {
    font-family: "Courier Prime", "Courier New", Courier, monospace !important;
    letter-spacing: 0;
}

.file-index-title {
    font-size: 17px;
    font-weight: 700;
    color: #111;
    background: #c0c0c0;
    border: 2px solid;
    border-color: #ffffff #7b7b7b #7b7b7b #ffffff;
    padding: 7px 8px 6px;
    margin-bottom: 13px;
}

.archive-path {
    display: inline-block;
    font-size: 12px;
    color: #111;
    background: #f1f1f1;
    border: 1px solid #9a9a9a;
    box-shadow:
        inset 1px 1px 0 #ffffff,
        inset -1px -1px 0 #c0c0c0;
    padding: 4px 7px;
}

.file-tree {
    color: #111;
    font-size: 12px;
    line-height: 1.55;
}

.file-tree details {
    margin: 1px 0;
}

.file-tree summary {
    cursor: pointer;
    list-style: none;
    white-space: nowrap;
}

.file-tree summary::-webkit-details-marker {
    display: none;
}

/* Tiny old-GUI disclosure triangles */
.file-tree summary::before {
    content: "▶";
    display: inline-block;
    width: 12px;
    margin-right: 2px;
    font-size: 8px;
    vertical-align: 1px;
    color: #111;
}

.file-tree details[open] > summary::before {
    content: "▼";
}

/*
  Classic 90s-style folder icon made only with CSS.
  No emoji: looks closer to old Mac/Windows UI.
*/
.file-tree .folder::before {
    content: "";
    display: inline-block;
    width: 13px;
    height: 9px;
    margin-right: 5px;
    position: relative;
    top: 1px;

    background: #e8c75c;
    border: 1px solid #574a20;

/* ==========================================================
   SHARED /archive/ FILE BROWSER — classic 90s desktop
   ========================================================== */
:root { --archive-sidebar: 250px; }

.archive-shell {
    min-height: 100vh;
    display: grid;
    grid-template-columns: var(--archive-sidebar) minmax(0, 1fr);
}

.file-sidebar {
    position: fixed;
    inset: 0 auto 0 0;
    width: var(--archive-sidebar);
    height: 100vh;
    overflow-y: auto;
    z-index: 20000;
    background: transparent;
    border-right: 2px solid #8b8b8b;
    box-shadow: inset -1px 0 0 #fff;
    padding: 18px 14px 40px;
    color: #111;
}

.file-index-title,
.file-tree,
.file-tree a,
.file-tree summary,
.file-tree span,
.archive-path {
    font-family: "Courier Prime", "Courier New", Courier, monospace !important;
    letter-spacing: 0;
}

/* text only — deliberately NOT a button */
.file-index-title {
    font-size: 18px;
    font-weight: 700;
    color: #111;
    background: transparent;
    border: 0;
    box-shadow: none;
    padding: 0 0 11px;
    margin: 0 0 13px;
    border-bottom: 1px solid #8b8b8b;
}

.file-tree {
    font-size: 12px;
    line-height: 1.58;
    color: #111;
}
.file-tree details { margin: 1px 0; }
.file-tree summary {
    cursor: pointer;
    list-style: none;
    white-space: nowrap;
}
.file-tree summary::-webkit-details-marker { display: none; }
.file-tree summary::before {
    content: "▶";
    display: inline-block;
    width: 12px;
    margin-right: 2px;
    font-size: 8px;
    vertical-align: 1px;
}
.file-tree details[open] > summary::before { content: "▼"; }

.file-tree .folder,
.file-tree .file {
    position: relative;
    display: inline-block;
    color: #111;
}

/* classic folder */
.file-tree .folder::before {
    content: "";
    display: inline-block;
    width: 13px;
    height: 9px;
    margin-right: 5px;
    position: relative;
    top: 1px;
    background: #e8c75c;
    border: 1px solid #574a20;
    box-shadow: inset 1px 1px 0 #fff5b0, inset -1px -1px 0 #a1832d;
}
.file-tree .folder::after {
    content: "";
    position: absolute;
    width: 6px;
    height: 3px;
    left: 1px;
    top: 1px;
    transform: translateY(-3px);
    background: #e8c75c;
    border: 1px solid #574a20;
    border-bottom: 0;
    box-shadow: inset 1px 1px 0 #fff5b0;
}

/* classic document */
.file-tree .file::before {
    content: "";
    display: inline-block;
    width: 10px;
    height: 13px;
    margin-right: 6px;
    position: relative;
    top: 2px;
    background: #f4f4f4;
    border: 1px solid #555;
    box-shadow: inset 1px 1px 0 #fff, inset -1px -1px 0 #b8b8b8;
}

.file-tree .children { margin-left: 16px; }
.file-tree a { color: #111; text-decoration: none; }
.file-tree a:hover, .file-tree a:focus {
    color: #fff;
    background: #000080;
    text-decoration: none;
    outline: none;
}
.file-tree .active { font-weight: 700; }
.file-tree [aria-current="page"]{ text-decoration: underline; }

.archive-main {
    grid-column: 2;
    min-width: 0;
    padding: 18px 22px 80px;
}
.archive-path {
    display: inline-block;
    font-size: 12px;
    color: #111;
    background: #f1f1f1;
    border: 1px solid #9a9a9a;
    box-shadow: inset 1px 1px 0 #fff, inset -1px -1px 0 #c0c0c0;
    padding: 4px 7px;
    margin: 0 0 24px;
}

@media (max-width: 800px) {
    :root { --archive-sidebar: 165px; }

    .file-tree { font-size: 10px; }

}


/* v3 polish */
.file-index-title {
    font-size: 12px !important;
    font-weight: 700 !important;
    line-height: 1.58 !important;
    padding-bottom: 8px !important;
}
/* Path labels such as /archive/projects/cv.html are intentionally removed */
.archive-path { display: none !important; }


/* ===== v5 hierarchy + type consistency ===== */
.file-index-title,
.file-tree,
.file-tree summary,
.file-tree summary > a,
.file-tree .folder,
.file-tree .file,
.file-tree a {
    font-size: 12px !important;
    line-height: 1.58 !important;
    font-weight: 400;
}

.file-index-title {
    font-weight: 700 !important;
}

.file-tree .active {
    font-weight: 700 !important;
}

/* The disclosure row itself must never shrink in nested folders. */
.file-tree details,
.file-tree details > summary,
.file-tree details > summary > a,
.file-tree details > summary > span {
    font-size: 12px !important;
}

/* Future science projects placeholder should occupy no visual space yet. */
.science-projects-placeholder:empty {
    display: none;
}




/* ===== v6 precise directory indentation ===== */
.file-tree {
    --tree-indent: 18px;
}

/* Every row has the same baseline box model. */
.file-tree > div,
.file-tree > details,
.file-tree .children > div,
.file-tree .children > details {
    margin: 0 !important;
    padding: 0 !important;
}

/* Top-level entries all start at exactly the same x-position. */
.file-tree > div,
.file-tree > details > summary {
    padding-left: 0 !important;
}

/* Children are indented by one fixed unit per nesting level. */
.file-tree .children {
    margin-left: var(--tree-indent) !important;
    padding-left: 0 !important;
}

/* Nested children add one more identical unit, never an arbitrary extra offset. */
.file-tree .children .children {
    margin-left: var(--tree-indent) !important;
}

/* Keep disclosure triangles in a fixed-width column, so folder labels line up. */
.file-tree summary {
    display: flex !important;
    align-items: baseline !important;
    gap: 0 !important;
}

.file-tree summary::before {
    flex: 0 0 12px !important;
    width: 12px !important;
    margin-right: 2px !important;
}

/* Plain top-level files (index.html) need the same icon column as folder summaries. */
.file-tree > div > a.file {
    display: inline-flex !important;
    align-items: baseline !important;
    margin-left: 14px !important; /* 12px triangle column + 2px gap */
}

/* For nested files, align their document icon with nested folder icons. */
.file-tree .children > div > a.file {
    display: inline-flex !important;
    align-items: baseline !important;
    margin-left: 14px !important;
}

/* Main folder names all use identical typography and line box. */
.file-tree > details > summary > a,
.file-tree > details > summary > span,
.file-tree > details > summary .folder {
    font-size: 12px !important;
    line-height: 1.58 !important;
    font-weight: 400 !important;
}

/* Current active main folder may be bold, but never shifted. */
.file-tree > details > summary .folder.active {
    font-weight: 700 !important;
}

/* Prevent links inside summary from creating browser-default spacing. */
.file-tree summary > a {
    display: inline-flex !important;
    align-items: baseline !important;
    margin: 0 !important;
    padding: 0 !important;
}

/* Make folder/document icons occupy consistent width. */
.file-tree .folder::before {
    width: 13px !important;
    flex: 0 0 13px !important;
}
.file-tree .file::before {
    width: 10px !important;
    flex: 0 0 10px !important;
}

<script>
const wall = document.getElementById("image-wall");

const source = document.getElementById("source-media");

function syncArchiveManifest() {
    if (!Array.isArray(window.ARCHIVE_MEDIA)) return;

    const existing = new Set(
        Array.from(source.querySelectorAll(":scope > img, :scope > video"))
             .map(el => el.getAttribute("src"))
    );

    window.ARCHIVE_MEDIA.forEach(entry => {
        if (!entry || !entry.src || existing.has(entry.src)) return;

        const media = document.createElement(entry.type === "video" ? "video" : "img");
        media.setAttribute("src", entry.src);

        if (entry.project) media.dataset.project = entry.project;
        if (entry.kind) media.dataset.kind = entry.kind;

        /* Cutouts are real transparent objects, never random CSS cut-shapes. */
        if (entry.kind === "cutout") media.dataset.shape = "shape-block";

        source.appendChild(media);
        existing.add(entry.src);
    });
}

syncArchiveManifest();

let lightboxItems = [];
let lightboxIndex = 0;
let selectedItem = null;
const selectedItems = new Set();
let maxZ = 100;

const VA_URL_PARAMS = new URLSearchParams(window.location.search);
const archiveView = VA_URL_PARAMS.get("view") || "";
let USE_LOCAL_DRAFT = VA_URL_PARAMS.get("draft") === "local";
const STORAGE_KEY = "visualArchiveManualLayout_v5" + (archiveView ? "_" + archiveView : "_main");

/* deterministic randomness: same automatic collage after reload */
function mulberry32(seed) {
    return function() {
        let t = seed += 0x6D2B79F5;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
}

const rand = mulberry32(1981);

function choice(arr) {
    return arr[Math.floor(rand() * arr.length)];
}

/*
  Much broader size vocabulary than the previous version.
  This is closer to the reference books: tiny object fragments,
  medium editorial photos and a few dominant images.
*/
const SIZE_PRESETS = [
    [55, 55], [65, 90], [85, 65], [80, 105],
    [95, 95], [105, 135], [120, 80], [120, 150],
    [135, 105], [145, 175], [155, 115], [160, 200],
    [180, 130], [180, 220], [205, 150], [210, 260],
    [235, 170], [240, 240], [260, 185], [275, 225],
    [290, 190], [300, 260]
];

const MOBILE_SCALE = 0.66;

const SHAPES = [
    "shape-block", "shape-block", "shape-block", "shape-block",
    "shape-chamfer-tr", "shape-chamfer-bl",
    "shape-slant-top", "shape-slant-bottom",
    "shape-oval", "shape-circle",
    "shape-arch", "shape-ticket",
    "shape-diamond", "shape-soft-diamond",
    "shape-trapezoid", "shape-inverse-trapezoid",
    "shape-tab-left", "shape-tab-right",
    "shape-torn-1", "shape-torn-2",
    "shape-organic", "shape-pill",
    "shape-halfmoon", "shape-corner-cut",
    "shape-doily-round", "shape-doily-square",
    "shape-beermat-round", "shape-beermat-square",
    "shape-lace-strip", "shape-coaster-flower",
    "shape-triangle-up",
    "shape-triangle-down",
    "shape-triangle-left",
    "shape-triangle-right",
    "shape-hexagon",
    "shape-octagon",
    "shape-parallelogram",
    "shape-chevron"
];

const PRINTS = [
    "", "", "", "", "", "",
    "photocopy", "photocopy",
    "ink-heavy", "faded"
];

/* ----------------------------------------------------------
   COLLISION / AUTO PACKING
   ---------------------------------------------------------- */

function rectsCollide(a, b, gap = 7) {
    return !(
        a.x + a.w + gap <= b.x ||
        b.x + b.w + gap <= a.x ||
        a.y + a.h + gap <= b.y ||
        b.y + b.h + gap <= a.y
    );
}

function findPackedPosition(w, h, placed, containerWidth) {
    const step = 8;
    const maxX = Math.max(0, containerWidth - w);

    /*
      Try positions from top to bottom. For each y we shuffle
      x-start slightly, so the result doesn't read as a strict grid.
    */
    for (let y = 0; y < 30000; y += step) {
        const offset = Math.floor(rand() * 6) * step;

        for (let x0 = offset; x0 <= maxX; x0 += step) {
            const x = Math.min(x0, maxX);
            const rect = {x, y, w, h};

            if (!placed.some(p => rectsCollide(rect, p, 8))) {
                return {x, y};
            }
        }
    }

    return {x: 0, y: placed.length ? Math.max(...placed.map(p => p.y + p.h)) + 8 : 0};
}

function buildWall() {
    let originals = Array.from(
        source.querySelectorAll(":scope > img, :scope > video")
    );

    if (archiveView === "photo") {
        originals = originals.filter(el => {
            const src = el.getAttribute("src") || "";
            return el.tagName === "IMG" &&
                   src.includes("/photography/") &&
                   !src.includes("/photography/derives/");
        });
    } else if (archiveView === "video") {
        originals = originals.filter(el => {
            const src = el.getAttribute("src") || "";
            return el.tagName === "VIDEO" &&
                   src.includes("/super8/");
        });
    } else if (archiveView === "escitalopram") {
        originals = originals.filter(el =>
            (el.getAttribute("src") || "").includes("/collage/") ||
            el.dataset.project === "escitalopram"
        );
    }

    wall.innerHTML = "";
    lightboxItems = [];

    const mobile = window.innerWidth <= 768;
    const scale = mobile ? MOBILE_SCALE : 1;
    const placed = [];
    const containerWidth = wall.clientWidth;

    originals.forEach((original, index) => {
        const item = document.createElement("div");
        item.className = "wall-item";
        item.dataset.index = String(index);
        item.dataset.src = original.getAttribute("src");
        if (original.dataset.kind) item.dataset.kind = original.dataset.kind;
        item.dataset.project = original.dataset.project || "";
        if (original.dataset.summary === "true") item.dataset.summary = "true";

        let [w, h] = choice(SIZE_PRESETS);

        /*
          Preserve a strong mixture:
          occasional tiny fragments, occasional dominant images.
        */
        const roll = rand();

        if (roll < .12) {
            const tiny = choice([[45,45],[50,70],[65,45],[70,55]]);
            w = tiny[0];
            h = tiny[1];
        } else if (roll > .94) {
            const big = choice([[320,230],[300,300],[340,190]]);
            w = big[0];
            h = big[1];
        }

        w *= scale;
        h *= scale;

        item.style.width = `${Math.round(w)}px`;
        item.style.height = `${Math.round(h)}px`;

        item.classList.add(
            original.dataset.shape || choice(SHAPES)
        );

        const print = original.dataset.treatment || choice(PRINTS);
        if (print) item.classList.add(print);

        const pos = findPackedPosition(w, h, placed, containerWidth);

        item.style.left = `${Math.round(pos.x)}px`;
        item.style.top = `${Math.round(pos.y)}px`;

        placed.push({x: pos.x, y: pos.y, w, h});

        const media = original.cloneNode(true);
        media.removeAttribute("data-project-desc");

        if (media.tagName === "IMG") media.loading = "lazy";

        if (media.tagName === "VIDEO") {
            media.muted = true;
            media.loop = true;
            media.playsInline = true;
            media.autoplay = true;
        }

        item.appendChild(media);

        ["nw", "ne", "sw", "se"].forEach(corner => {
            const handle = document.createElement("div");
            handle.className = `resize-handle ${corner}`;
            handle.dataset.corner = corner;
            item.appendChild(handle);
            enableResizing(item, handle, corner);
        });

        lightboxItems.push({
            type: media.tagName === "VIDEO" ? "video" : "img",
            src: media.getAttribute("src")
        });

        item.addEventListener("click", e => {
            if (document.body.classList.contains("edit-mode")) {
                e.stopPropagation();
                selectItem(item, multiSelectModifier(e));
                return;
            }

            openLightbox(index);
        });

        enableDragging(item);

        wall.appendChild(item);
    });

    const bottom = placed.length
        ? Math.max(...placed.map(p => p.y + p.h))
        : 500;

    wall.style.height = `${bottom + 80}px`;

    restoreSavedLayout();
    syncEditorSidebarState();
}

/* ----------------------------------------------------------
   MANUAL ARRANGEMENT MODE
   ---------------------------------------------------------- */

function refreshSelectedClasses(){
  document.querySelectorAll(".wall-item").forEach(el=>{
    el.classList.toggle("selected", el === selectedItem);
    el.classList.toggle("multi-selected", selectedItems.has(el));
  });
}

function multiSelectModifier(evt){
  return !!(evt && (evt.shiftKey || evt.metaKey || evt.ctrlKey));
}

function selectItem(item, additive=false){
  if (!item){
    selectedItem = null;
    selectedItems.clear();
    refreshSelectedClasses();
    return;
  }

  if (additive){
    if (selectedItems.has(item)){
      selectedItems.delete(item);
      if (selectedItem === item){
        selectedItem = Array.from(selectedItems).at(-1) || null;
      }
    } else {
      selectedItems.add(item);
      selectedItem = item;
    }
  } else {
    selectedItems.clear();
    selectedItems.add(item);
    selectedItem = item;
  }

  refreshSelectedClasses();

  const shapeSelect = document.getElementById("shape-select");
  if (selectedItem && shapeSelect){
    const currentShape = EDIT_SHAPES.find(c => selectedItem.classList.contains(c));
    shapeSelect.value = currentShape || "";
  }
}

function selectedArray(){
  return Array.from(selectedItems).filter(el => el && el.isConnected);
}

const SNAP_PX = 6;

function getGuides(){
  let gv = document.getElementById("va-guide-v");
  let gh = document.getElementById("va-guide-h");

  if (!gv){
    gv = document.createElement("div");
    gv.id = "va-guide-v";
    gv.className = "va-guide v";
    wall.appendChild(gv);
  }
  if (!gh){
    gh = document.createElement("div");
    gh.id = "va-guide-h";
    gh.className = "va-guide h";
    wall.appendChild(gh);
  }
  return {gv,gh};
}

function hideGuides(){
  const gv=document.getElementById("va-guide-v");
  const gh=document.getElementById("va-guide-h");
  if(gv)gv.style.display="none";
  if(gh)gh.style.display="none";
}

function snapMove(item,left,top){
  const itemW=item.offsetWidth;
  const itemH=item.offsetHeight;
  const movingX=[left,left+itemW/2,left+itemW];
  const movingY=[top,top+itemH/2,top+itemH];
  let bx=null,by=null;

  document.querySelectorAll("#image-wall > .wall-item").forEach(o=>{
    if(o===item)return;
    const l=parseFloat(o.style.left)||0;
    const t=parseFloat(o.style.top)||0;
    const ow=o.offsetWidth,oh=o.offsetHeight;
    const tx=[l,l+ow/2,l+ow];
    const ty=[t,t+oh/2,t+oh];

    movingX.forEach(mx=>tx.forEach(x=>{
      const d=x-mx;
      if(Math.abs(d)<=SNAP_PX && (!bx || Math.abs(d)<Math.abs(bx.d)))bx={d,x};
    }));
    movingY.forEach(my=>ty.forEach(y=>{
      const d=y-my;
      if(Math.abs(d)<=SNAP_PX && (!by || Math.abs(d)<Math.abs(by.d)))by={d,y};
    }));
  });

  if(bx)left+=bx.d;
  if(by)top+=by.d;

  const {gv,gh}=getGuides();
  if(bx){gv.style.left=bx.x+"px";gv.style.display="block"}else gv.style.display="none";
  if(by){gh.style.top=by.y+"px";gh.style.display="block"}else gh.style.display="none";

  return {left:Math.max(0,left),top:Math.max(0,top)};
}

function enableDragging(item) {
    let startX, startY, startLeft, startTop, groupStarts;

    item.addEventListener("pointerdown", e => {
        if (!document.body.classList.contains("edit-mode")) return;
        if (e.target.classList.contains("resize-handle")) return;

        /*
          Normal drag: select the item immediately.
          Shift-click: preserve the current multi-selection and let the click
          handler toggle this item after pointerup.
        */
        if (!multiSelectModifier(e)) {
            if (!selectedItems.has(item) || selectedItems.size !== 1) {
                selectItem(item, false);
            }
        }

        startX = e.clientX;
        startY = e.clientY;
        startLeft = parseFloat(item.style.left) || 0;
        startTop = parseFloat(item.style.top) || 0;

        const group = [item];

        groupStarts = group.map(el => ({
            el,
            left: parseFloat(el.style.left) || 0,
            top: parseFloat(el.style.top) || 0
        }));

        item.setPointerCapture(e.pointerId);
        let didDrag = false;

        const move = ev => {
            const deltaX = ev.clientX - startX;
            const deltaY = ev.clientY - startY;

            if (!didDrag && Math.hypot(deltaX, deltaY) < 3) return;
            didDrag = true;

            let left = Math.max(0, startLeft + deltaX);
            let top = Math.max(0, startTop + deltaY);

            const snapped = snapMove(item, left, top);
            const dx = snapped.left - startLeft;
            const dy = snapped.top - startTop;

            groupStarts.forEach(g => {
                g.el.style.left = Math.max(0, g.left + dx) + "px";
                g.el.style.top = Math.max(0, g.top + dy) + "px";
            });

            growWallToContent();
        };

        const up = ev => {
            try { item.releasePointerCapture(ev.pointerId); } catch {}
            item.removeEventListener("pointermove", move);
            item.removeEventListener("pointerup", up);
            hideGuides();
        };

        item.addEventListener("pointermove", move);
        item.addEventListener("pointerup", up);
    });
}

function enableResizing(item, handle, corner) {
    let startX, startY, startW, startH, startLeft, startTop;

    handle.addEventListener("pointerdown", e => {
        if (!document.body.classList.contains("edit-mode")) return;

        e.stopPropagation();
        selectItem(item);

        startX = e.clientX;
        startY = e.clientY;
        startW = item.offsetWidth;
        startH = item.offsetHeight;
        startLeft = parseFloat(item.style.left) || 0;
        startTop = parseFloat(item.style.top) || 0;

        handle.setPointerCapture(e.pointerId);

        const move = ev => {
            const dx = ev.clientX - startX;
            const dy = ev.clientY - startY;

            let newW = startW;
            let newH = startH;
            let newLeft = startLeft;
            let newTop = startTop;

            if (corner.includes("e")) {
                newW = Math.max(35, startW + dx);
            }

            if (corner.includes("s")) {
                newH = Math.max(35, startH + dy);
            }

            if (corner.includes("w")) {
                newW = Math.max(35, startW - dx);
                newLeft = startLeft + (startW - newW);
            }

            if (corner.includes("n")) {
                newH = Math.max(35, startH - dy);
                newTop = startTop + (startH - newH);
            }

            /*
              Prevent the object from being resized beyond the top/left
              edge of the collage.
            */
            if (newLeft < 0) {
                newW += newLeft;
                newLeft = 0;
            }

            if (newTop < 0) {
                newH += newTop;
                newTop = 0;
            }

            const others = Array.from(document.querySelectorAll("#image-wall > .wall-item"))
                .filter(x => x !== item);

            let guideX=null,guideY=null;

            if(corner.includes("e") || corner.includes("w")){
                const activeX=corner.includes("e") ? newLeft+newW : newLeft;
                let bestX=null;

                others.forEach(o=>{
                    const l=parseFloat(o.style.left)||0;
                    const ow=o.offsetWidth;

                    [l,l+ow/2,l+ow].forEach(x=>{
                        const d=x-activeX;
                        if(Math.abs(d)<=SNAP_PX && (!bestX||Math.abs(d)<Math.abs(bestX.d))){
                            bestX={d,x};
                        }
                    });
                });

                if(bestX){
                    if(corner.includes("e"))newW+=bestX.d;
                    else {newLeft+=bestX.d;newW-=bestX.d}
                    guideX=bestX.x;
                }
            }

            if(corner.includes("s") || corner.includes("n")){
                const activeY=corner.includes("s") ? newTop+newH : newTop;
                let bestY=null;

                others.forEach(o=>{
                    const t=parseFloat(o.style.top)||0;
                    const oh=o.offsetHeight;

                    [t,t+oh/2,t+oh].forEach(y=>{
                        const d=y-activeY;
                        if(Math.abs(d)<=SNAP_PX && (!bestY||Math.abs(d)<Math.abs(bestY.d))){
                            bestY={d,y};
                        }
                    });
                });

                if(bestY){
                    if(corner.includes("s"))newH+=bestY.d;
                    else {newTop+=bestY.d;newH-=bestY.d}
                    guideY=bestY.y;
                }
            }

            const guides=getGuides();
            if(guideX!==null){
                guides.gv.style.left=guideX+"px";
                guides.gv.style.display="block";
            }else guides.gv.style.display="none";

            if(guideY!==null){
                guides.gh.style.top=guideY+"px";
                guides.gh.style.display="block";
            }else guides.gh.style.display="none";

            item.style.left = `${newLeft}px`;
            item.style.top = `${newTop}px`;
            item.style.width = `${Math.max(35, newW)}px`;
            item.style.height = `${Math.max(35, newH)}px`;

            growWallToContent();
        };

        const up = ev => {
            handle.releasePointerCapture(ev.pointerId);
            handle.removeEventListener("pointermove", move);
            handle.removeEventListener("pointerup", up);
            hideGuides();
        };

        handle.addEventListener("pointermove", move);
        handle.addEventListener("pointerup", up);
    });
}

function growWallToContent() {
    const items = Array.from(document.querySelectorAll(".wall-item"));

    const bottom = items.length
        ? Math.max(...items.map(el => (parseFloat(el.style.top)||0) + el.offsetHeight))
        : 500;

    wall.style.height = `${bottom + 100}px`;
}

/* ===== v12.32 annotation engine ===== */
window.VAAnnotations = (() => {
  let active = null;

  function esc(s){
    return String(s||"")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;");
  }

  function defaults(type){
    if(type==="text") return {w:150,h:34};
    if(type==="box") return {w:170,h:115};
    if(type==="arrow-short") return {w:105,h:55};
    if(type==="arrow-long") return {w:250,h:75};
    if(type==="arrow-curve") return {w:245,h:125};
    if(type==="line-short") return {w:105,h:38};
    if(type==="line-long") return {w:260,h:42};
    return {w:235,h:105};
  }

  function isConnector(type){
    return type.startsWith("arrow-") || type.startsWith("line-");
  }

  function isCurved(type){
    return type.endsWith("-curve");
  }

  function hasArrowHead(type){
    return type.startsWith("arrow-");
  }

  function markup(type,text){
    if(type==="text") return `<div class="va-annotation-text">${esc(text)}</div>`;
    if(type==="box") return "";
    if(isConnector(type)){
      return `<svg class="va-connector-svg" preserveAspectRatio="none" aria-hidden="true">
        <path class="va-connector-path"></path>
        <path class="va-connector-head"></path>
      </svg>`;
    }
    return "";
  }

  function defaultConnector(type,w,h){
    const curved=isCurved(type);
    return curved
      ? {x1:10,y1:h-16,x2:w-12,y2:Math.round(h*.58),cx:Math.round(w*.48),cy:10}
      : {x1:10,y1:Math.round(h*.52),x2:w-12,y2:Math.round(h*.48),cx:Math.round(w/2),cy:Math.round(h/2)};
  }

  function readConnector(item){
    try{
      const value=JSON.parse(item.dataset.connector||"null");
      if(value && ["x1","y1","x2","y2","cx","cy"].every(k=>Number.isFinite(Number(value[k])))){
        return Object.fromEntries(Object.entries(value).map(([k,v])=>[k,Number(v)]));
      }
    }catch{}
    return defaultConnector(item.dataset.noteType,item.offsetWidth||150,item.offsetHeight||60);
  }

  function writeConnector(item,value){
    item.dataset.connector=JSON.stringify(value);
  }

  function renderConnector(item){
    if(!item.classList.contains("va-connector")) return;
    const type=item.dataset.noteType;
    const p=readConnector(item);
    const svg=item.querySelector(".va-connector-svg");
    const path=item.querySelector(".va-connector-path");
    const head=item.querySelector(".va-connector-head");
    if(!svg||!path||!head) return;

    const w=Math.max(1,item.offsetWidth||parseFloat(item.style.width)||1);
    const h=Math.max(1,item.offsetHeight||parseFloat(item.style.height)||1);
    svg.setAttribute("viewBox",`0 0 ${w} ${h}`);
    path.setAttribute("d",isCurved(type)
      ? `M ${p.x1} ${p.y1} Q ${p.cx} ${p.cy} ${p.x2} ${p.y2}`
      : `M ${p.x1} ${p.y1} L ${p.x2} ${p.y2}`);

    if(hasArrowHead(type)){
      const tx=p.x2-(isCurved(type)?p.cx:p.x1);
      const ty=p.y2-(isCurved(type)?p.cy:p.y1);
      const len=Math.max(.001,Math.hypot(tx,ty));
      const ux=tx/len, uy=ty/len;
      const px=-uy, py=ux;
      const back=8, spread=3.4;
      const ax=p.x2-ux*back+px*spread;
      const ay=p.y2-uy*back+py*spread;
      const bx=p.x2-ux*back-px*spread;
      const by=p.y2-uy*back-py*spread;
      head.setAttribute("d",`M ${ax} ${ay} L ${p.x2} ${p.y2} L ${bx} ${by}`);
    }else{
      head.setAttribute("d","");
    }

    item.querySelectorAll(".va-point-handle").forEach(handle=>{
      const key=handle.dataset.point;
      const x=key==="start"?p.x1:key==="end"?p.x2:p.cx;
      const y=key==="start"?p.y1:key==="end"?p.y2:p.cy;
      handle.style.left=x+"px";
      handle.style.top=y+"px";
    });
  }

  function normalizeConnector(item){
    const type=item.dataset.noteType;
    const p=readConnector(item);
    const xs=[p.x1,p.x2], ys=[p.y1,p.y2];
    if(isCurved(type)){xs.push(p.cx);ys.push(p.cy)}
    const pad=14;
    const minX=Math.min(...xs)-pad, minY=Math.min(...ys)-pad;
    const maxX=Math.max(...xs)+pad, maxY=Math.max(...ys)+pad;
    item.style.left=((parseFloat(item.style.left)||0)+minX)+"px";
    item.style.top=((parseFloat(item.style.top)||0)+minY)+"px";
    item.style.width=Math.max(28,maxX-minX)+"px";
    item.style.height=Math.max(28,maxY-minY)+"px";
    p.x1-=minX;p.x2-=minX;p.cx-=minX;
    p.y1-=minY;p.y2-=minY;p.cy-=minY;
    writeConnector(item,p);
    renderConnector(item);
  }

  function select(item){
    document.querySelectorAll(".va-annotation.selected").forEach(x=>x.classList.remove("selected"));
    active=item||null;
    if(active) active.classList.add("selected");
  }

  function enable(item){
    item.addEventListener("click",e=>{
      if(!document.body.classList.contains("edit-mode")) return;
      e.stopPropagation();
      select(item);
    });

    item.addEventListener("dblclick",e=>{
      if(item.dataset.noteType!=="text") return;
      e.stopPropagation();
      const next=prompt("Text:",item.dataset.noteText||"");
      if(next===null) return;
      item.dataset.noteText=next;
      const node=item.querySelector(".va-annotation-text");
      if(node) node.textContent=next;
    });

    item.addEventListener("pointerdown",e=>{
      if(!document.body.classList.contains("edit-mode")) return;
      if(e.target.classList.contains("va-note-handle") || e.target.classList.contains("va-point-handle")) return;
      e.stopPropagation();
      select(item);

      const sx=e.clientX, sy=e.clientY;
      const sl=parseFloat(item.style.left)||0;
      const st=parseFloat(item.style.top)||0;
      item.setPointerCapture(e.pointerId);

      const move=ev=>{
        item.style.left=Math.max(0,sl+ev.clientX-sx)+"px";
        item.style.top=Math.max(0,st+ev.clientY-sy)+"px";
        if(typeof growWallToContent==="function") growWallToContent();
      };
      const up=ev=>{
        try{item.releasePointerCapture(ev.pointerId)}catch{}
        item.removeEventListener("pointermove",move);
        item.removeEventListener("pointerup",up);
      };
      item.addEventListener("pointermove",move);
      item.addEventListener("pointerup",up);
    });

    const handle=item.querySelector(".va-note-handle");
    handle.addEventListener("pointerdown",e=>{
      if(!document.body.classList.contains("edit-mode")) return;
      e.preventDefault();
      e.stopPropagation();
      select(item);

      const sx=e.clientX, sy=e.clientY;
      const sw=item.offsetWidth, sh=item.offsetHeight;
      handle.setPointerCapture(e.pointerId);

      const move=ev=>{
        item.style.width=Math.max(28,sw+ev.clientX-sx)+"px";
        item.style.height=Math.max(20,sh+ev.clientY-sy)+"px";
        if(typeof growWallToContent==="function") growWallToContent();
      };
      const up=ev=>{
        try{handle.releasePointerCapture(ev.pointerId)}catch{}
        handle.removeEventListener("pointermove",move);
        handle.removeEventListener("pointerup",up);
      };
      handle.addEventListener("pointermove",move);
      handle.addEventListener("pointerup",up);
    });

    item.querySelectorAll(".va-point-handle").forEach(point=>{
      point.addEventListener("pointerdown",e=>{
        if(!document.body.classList.contains("edit-mode")) return;
        e.preventDefault();
        e.stopPropagation();
        select(item);
        point.setPointerCapture(e.pointerId);

        const move=ev=>{
          const rect=item.getBoundingClientRect();
          const p=readConnector(item);
          const x=ev.clientX-rect.left;
          const y=ev.clientY-rect.top;
          if(point.dataset.point==="start"){p.x1=x;p.y1=y}
          else if(point.dataset.point==="end"){p.x2=x;p.y2=y}
          else{p.cx=x;p.cy=y}
          writeConnector(item,p);
          renderConnector(item);
        };
        const up=ev=>{
          try{point.releasePointerCapture(ev.pointerId)}catch{}
          point.removeEventListener("pointermove",move);
          point.removeEventListener("pointerup",up);
          normalizeConnector(item);
          if(typeof growWallToContent==="function")growWallToContent();
          if(typeof scheduleLocalDraftSave==="function")scheduleLocalDraftSave();
        };
        point.addEventListener("pointermove",move);
        point.addEventListener("pointerup",up);
      });
    });
  }

  function create(data){
    const item=document.createElement("div");
    item.className="va-annotation";
    item.dataset.noteId=data.id || ("note-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,6));
    item.dataset.noteType=data.type || "text";
    item.dataset.noteText=data.text || "";
    item.dataset.rotation=String(Number(data.rotation)||0);

    const d=defaults(item.dataset.noteType);
    item.style.left=data.left || "80px";
    item.style.top=data.top || "80px";
    item.style.width=data.width || d.w+"px";
    item.style.height=data.height || d.h+"px";
    item.style.zIndex=data.zIndex || "7000";
    item.style.transform=`rotate(${Number(data.rotation)||0}deg)`;

    if(item.dataset.noteType==="box") item.classList.add("va-annotation-box");
    if(isConnector(item.dataset.noteType)) item.classList.add("va-connector");
    item.innerHTML=markup(item.dataset.noteType,item.dataset.noteText);

    const h=document.createElement("div");
    h.className="va-note-handle";
    item.appendChild(h);

    if(isConnector(item.dataset.noteType)){
      const initial=data.connector || defaultConnector(item.dataset.noteType,d.w,d.h);
      writeConnector(item,initial);
      ["start","end"].concat(isCurved(item.dataset.noteType)?["curve"]:[]).forEach(point=>{
        const handle=document.createElement("div");
        handle.className="va-point-handle "+point;
        handle.dataset.point=point;
        handle.title=point==="curve"?"drag to change curvature":`drag ${point} point`;
        item.appendChild(handle);
      });
    }

    enable(item);
    requestAnimationFrame(()=>renderConnector(item));
    return item;
  }

  function add(type){
    const wallEl=document.getElementById("image-wall");
    if(!wallEl){
      alert("Annotation layer cannot find the image wall.");
      return;
    }

    let text="";
    if(type==="text"){
      const value=prompt("Text / word:");
      if(value===null) return;
      text=value || "text";
    }

    const d=defaults(type);
    const rect=wallEl.getBoundingClientRect();
    const x=Math.max(30,Math.min(wallEl.clientWidth-d.w-30,window.innerWidth*.58-rect.left-d.w/2));
    const y=Math.max(30,window.innerHeight*.42-rect.top-d.h/2);

    const item=create({
      type,text,
      left:x+"px",top:y+"px",
      width:d.w+"px",height:d.h+"px",
      zIndex:"7000"
    });

    wallEl.appendChild(item);
    select(item);
    if(typeof growWallToContent==="function") growWallToContent();
  }

  function rotate(delta){
    if(!active || !active.isConnected) return;
    const n=(Number(active.dataset.rotation)||0)+delta;
    active.dataset.rotation=String(n);
    active.style.transform=`rotate(${n}deg)`;
  }

  function serialize(){
    return Array.from(document.querySelectorAll(".va-annotation")).map(item=>({
      id:item.dataset.noteId||"",
      type:item.dataset.noteType||"text",
      text:item.dataset.noteText||"",
      left:item.style.left, top:item.style.top,
      width:item.style.width, height:item.style.height,
      zIndex:item.style.zIndex||"7000",
      rotation:Number(item.dataset.rotation)||0,
      connector:item.classList.contains("va-connector") ? readConnector(item) : undefined
    }));
  }

  function restore(list){
    document.querySelectorAll(".va-annotation").forEach(x=>x.remove());
    (Array.isArray(list)?list:[]).forEach(data=>{
      document.getElementById("image-wall").appendChild(create(data));
    });
  }

  function removeActive(){
    if(active && active.isConnected){
      active.remove();
      active=null;
      return true;
    }
    return false;
  }

  return {add,rotate,serialize,restore,removeActive};
})();

function serializeLayout() {
    const items = Array.from(document.querySelectorAll(".wall-item")).map(item => ({
        src: item.dataset.src,
        left: item.style.left,
        top: item.style.top,
        width: item.style.width,
        height: item.style.height,
        zIndex: item.style.zIndex || "",
        silhouette: item.classList.contains("silhouette"),
        shape: EDIT_SHAPES.find(c => item.classList.contains(c)) || "shape-block",

    }));

    const visibleSources = new Set(items.map(item => item.src));

    const removed = Array.from(
        source.querySelectorAll(":scope > img, :scope > video")
    )
    .map(el => el.getAttribute("src"))
    .filter(src => !visibleSources.has(src));

    return {
        items,
        removed,
        annotations: VAAnnotations.serialize()
    };
}


document.getElementById("delete-item").addEventListener("click", () => {
    const mediaSelection = selectedArray();
    if (selectedItem?.isConnected && !mediaSelection.includes(selectedItem)) {
        mediaSelection.push(selectedItem);
    }

    /* Prefer the visibly selected image(s). An old arrow/text selection must
       never intercept the remove action after the user selects a photograph. */
    if (mediaSelection.length) {
        mediaSelection.forEach(item => {
            const src = item.dataset.src;
            item.remove();

            const original = Array.from(
                source.querySelectorAll(":scope > img, :scope > video")
            ).find(el => el.getAttribute("src") === src);

            if (original) original.dataset.removedFromCollage = "true";
        });

        selectedItems.clear();
        selectedItem = null;
        refreshSelectedClasses();
        growWallToContent();
        return;
    }

    VAAnnotations.removeActive();
});

function updateEditorLayoutStatus(note = "") {
    const el = document.getElementById("editor-layout-status");
    if (!el) return;
    const saved = window.VISUAL_ARCHIVE_LAYOUT;
    const n = saved && Array.isArray(saved.items) ? saved.items.length : 0;
    const wallN = document.querySelectorAll("#image-wall .wall-item").length;
    const sourceName = window.__VA_LAYOUT_FILE__ || "layout unavailable";
    const loaded = window.__VA_LAYOUT_LOADED__ === false ? "NOT FOUND" : "loaded";
    const mode = USE_LOCAL_DRAFT ? "local draft" : "/layouts";
    el.textContent = `${archiveView ? archiveView + "/" : "visual_archive/"} · ${sourceName} · ${loaded} · ${mode} · ${wallN || n} items${note ? " · " + note : ""}`;
}

function activateLocalDraftUrl() {
    USE_LOCAL_DRAFT = true;
    const url = new URL(window.location.href);
    url.searchParams.set("draft", "local");
    url.searchParams.delete("fresh");
    history.replaceState(history.state, "", url);
}

function persistLocalDraft(note = "autosaved") {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(serializeLayout()));
        activateLocalDraftUrl();
        updateEditorLayoutStatus(note);
        return true;
    } catch (err) {
        console.error("Could not save local draft:", err);
        updateEditorLayoutStatus("SAVE FAILED");
        return false;
    }
}

let draftSaveTimer = 0;
function scheduleLocalDraftSave() {
    clearTimeout(draftSaveTimer);
    draftSaveTimer = setTimeout(() => persistLocalDraft(), 120);
}

document.getElementById("save-layout").addEventListener("click", () => {
    if (!persistLocalDraft("saved now")) return;
    const btn = document.getElementById("save-layout");
    const oldText = btn.textContent;
    btn.textContent = "[ saved ✓ ]";
    setTimeout(() => { btn.textContent = oldText; }, 1000);
});

document.getElementById("reset-layout").addEventListener("click", () => {
    localStorage.removeItem(STORAGE_KEY);
    const url = new URL(window.location.href);
    url.searchParams.delete("draft");
    url.searchParams.set("fresh", Date.now().toString());
    window.location.href = url.toString();
});

document.getElementById("reload-from-layouts").addEventListener("click", () => {
    const url = new URL(window.location.href);
    url.searchParams.delete("draft");

});

document.getElementById("load-local-draft").addEventListener("click", () => {

document.getElementById("preview-draft").addEventListener("click", () => {

    url.searchParams.set("draft", "local");
    window.open(url.toString(), "_blank", "noopener");
});

document.getElementById("export-layout").addEventListener("click", async () => {
    const layout = serializeLayout();
    const js =
        "/* Durable Visual Archive summary layout. Keep this file when updating HTML. */\n" +
        "window.VISUAL_ARCHIVE_LAYOUT = " +
        JSON.stringify(layout, null, 2) +
        ";\n";

    const blob = new Blob([js], {type: "text/javascript"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = archiveView
        ? `visual_archive_layout_${archiveView}.js`
        : "visual_archive_layout.js";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);

    try {
        await navigator.clipboard.writeText(JSON.stringify(layout, null, 2));
    } catch {}

    alert("Layout downloaded. Replace the matching file inside /layouts/. The local and online public page will then use the same composition.");
});


document.getElementById("import-layout").addEventListener("click", () => {
    document.getElementById("layout-file-input").click();
});

document.getElementById("layout-file-input").addEventListener("change", async event => {
    const file = event.target.files?.[0];
    if (!file) return;

    const text = await file.text();
    let layout = null;

    try {
        if (file.name.toLowerCase().endsWith(".json")) {
            layout = JSON.parse(text);
        } else {
            const match = text.match(/window\.VISUAL_ARCHIVE_LAYOUT\s*=\s*([\s\S]*);\s*$/);
            if (!match) throw new Error("Invalid layout JS");
            layout = JSON.parse(match[1]);
        }
    } catch (err) {
        alert("Could not read this layout file.");
        return;
    }

    localStorage.setItem(STORAGE_KEY, JSON.stringify(layout));
    const url = new URL(location.href);
    url.searchParams.set("draft", "local");
    url.searchParams.set("fresh", Date.now().toString());
    location.href = url.toString();
});

function syncEditorSidebarState(){
  const view = archiveView || "";
  const vaBranch = document.querySelector('details[data-tree-id="visual-archive"]');
  if (vaBranch) vaBranch.open = true;

  document.querySelectorAll('[data-tree-id="visual-archive"] .active').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('[data-tree-id="visual-archive"] [aria-current="page"]').forEach(el => el.removeAttribute('aria-current'));

  const rootLink = document.querySelector('details[data-tree-id="visual-archive"] > summary a');
  const rootFolder = rootLink ? rootLink.querySelector('.folder') : null;

  if (!view) {
    if (rootFolder) rootFolder.classList.add('active');
    if (rootLink) rootLink.setAttribute('aria-current','page');
  } else {
    const activeLink = document.querySelector(`[data-archive-view="${view}"]`);
    if (activeLink) {
      const folder = activeLink.querySelector('.folder') || activeLink;
      folder.classList.add('active');
      activeLink.setAttribute('aria-current','page');
    }
  }

  const selector = document.getElementById('editor-view');
  if (selector) selector.value = view;
}

function restoreSavedLayout() {
    let saved = window.VISUAL_ARCHIVE_LAYOUT || null;

    if (USE_LOCAL_DRAFT) {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
            try {
                const local = JSON.parse(raw);
                if (local && Array.isArray(local.items)) saved = local;
            } catch {}
        }
    }

    if (!saved || !Array.isArray(saved.items)) return;

    const savedItems = saved.items || [];
    const removed = saved.removed || [];
    const removedSet = new Set(removed);

    document.querySelectorAll(".wall-item").forEach(item => {
        if (removedSet.has(item.dataset.src)) item.remove();
    });

    /*
      Exact durable composition:
      if a layout file contains items, anything not listed is excluded from
      the composition unless it is explicitly being added from the library.
    */
    if (savedItems.length) {
        const wanted = new Set(savedItems.map(x => x.src));
        document.querySelectorAll(".wall-item").forEach(item => {
            if (!wanted.has(item.dataset.src)) item.remove();
        });
    }

    const bySrc = new Map(savedItems.map(x => [x.src, x]));

    document.querySelectorAll(".wall-item").forEach(item => {
        const s = bySrc.get(item.dataset.src);
        if (!s) return;

        item.style.left = s.left;
        item.style.top = s.top;
        item.style.width = s.width;
        item.style.height = s.height;
        item.style.zIndex = s.zIndex || "";

        EDIT_SHAPES.forEach(c => item.classList.remove(c));
        item.classList.add(s.shape || "shape-block");
        item.classList.toggle("silhouette", !!s.silhouette);
    });

    VAAnnotations.restore(saved.annotations || []);
    growWallToContent();
    syncEditorSidebarState();
}

/* ----------------------------------------------------------
   LIGHTBOX
   ---------------------------------------------------------- */

function openLightbox(index) {
    lightboxIndex = index;
    renderLightbox();
    document.getElementById("lightbox").classList.add("open");
    document.body.style.overflow = "hidden";
}

function renderLightbox() {
    if (!lightboxItems.length) return;

    const item = lightboxItems[lightboxIndex];
    const img = document.getElementById("lightbox-img");
    const video = document.getElementById("lightbox-video");

    video.pause();

    if (item.type === "video") {
        img.style.display = "none";
        video.src = item.src;
        video.style.display = "block";
        video.play().catch(() => {});
    } else {
        video.style.display = "none";
        img.src = item.src;
        img.style.display = "block";
    }

    document.getElementById("counter").textContent =
        `${lightboxIndex + 1} / ${lightboxItems.length}`;
}

function moveLightbox(direction) {
    lightboxIndex =
        (lightboxIndex + direction + lightboxItems.length)
        % lightboxItems.length;

    renderLightbox();
}

function closeLightbox() {
    const box = document.getElementById("lightbox");
    const video = document.getElementById("lightbox-video");

    box.classList.remove("open");
    video.pause();
    document.body.style.overflow = "";
}

document.addEventListener("keydown", e => {
    const box = document.getElementById("lightbox");

    if (box.classList.contains("open")) {
        if (e.key === "ArrowLeft") moveLightbox(-1);
        if (e.key === "ArrowRight") moveLightbox(1);
        if (e.key === "Escape") closeLightbox();
        return;
    }

    if (document.body.classList.contains("edit-mode") && selectedItem) {
        if (e.key.toLowerCase() === "s") {
            selectedItem.classList.toggle("silhouette");
        }
    }
});

<script>
/* Persist the user's folder state. First visit = all closed. */
(function () {
    const KEY = "archiveTreeOpenStateV2";

    function loadState() {
        try { return JSON.parse(localStorage.getItem(KEY) || "{}"); }
        catch { return {}; }
    }

    function saveState(state) {
        try { localStorage.setItem(KEY, JSON.stringify(state)); }
        catch {}
    }

    function restoreTree() {
        const state = loadState();

        document.querySelectorAll(".file-tree details[data-tree-id]").forEach(details => {
            const id = details.dataset.treeId;
            details.open = Object.prototype.hasOwnProperty.call(state, id)
                ? !!state[id]
                : false;

            details.addEventListener("toggle", () => {
                const current = loadState();
                current[id] = details.open;
                saveState(current);
            });
        });

        document.documentElement.classList.remove("tree-state-pending");
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", restoreTree, {once:true});
    } else {
        restoreTree();
    }
})();
</script>
<script>
(function(){
const library=document.getElementById("media-library");
const grid=document.getElementById("library-grid");
const filter=document.getElementById("library-filter");
const catalogue=()=>Array.from(source.querySelectorAll(":scope > img, :scope > video"));
const wallSet=()=>new Set(Array.from(wall.querySelectorAll(".wall-item")).map(x=>x.dataset.src));

function bucket(m){
 const s=m.getAttribute("src")||"";
 if(m.dataset.kind==="cutout"||s.includes("/cutouts/"))return"cutout";
 if(m.tagName==="VIDEO"||s.includes("/super8/"))return"video";
 if(m.dataset.project==="source"||s.includes("/img/source/")||s.startsWith("img/source/"))return"source";
 if(m.dataset.project==="escitalopram"||s.includes("/collage/"))return"escitalopram";
 return"photo";
}

function addOne(original){
 const src=original.getAttribute("src");
 if(!src||wallSet().has(src))return;
 const item=document.createElement("div");
 item.className="wall-item shape-block";
 item.dataset.src=src;
 item.dataset.project=original.dataset.project||"";
 if(original.dataset.kind)item.dataset.kind=original.dataset.kind;

 const media=original.cloneNode(true);
 if(media.tagName==="IMG")media.loading="lazy";
 if(media.tagName==="VIDEO"){media.muted=true;media.loop=true;media.playsInline=true;media.autoplay=true}

 const w=(original.dataset.kind==="cutout"?150:180);
 const h=(original.dataset.kind==="cutout"?220:140);
 item.style.width=w+"px";
 item.style.height=h+"px";

 /* Find a free place using the same collision logic as the initial wall.
    This prevents late additions from landing on top of an item that the
    user has already moved manually. */
 const placed=Array.from(wall.querySelectorAll(".wall-item")).map(el=>({
   x:parseFloat(el.style.left)||0,
   y:parseFloat(el.style.top)||0,
   w:el.offsetWidth||parseFloat(el.style.width)||100,
   h:el.offsetHeight||parseFloat(el.style.height)||100
 }));
 const pos=(typeof findPackedPosition==="function")
   ? findPackedPosition(w,h,placed,wall.clientWidth)
   : {x:20,y:placed.length?Math.max(...placed.map(p=>p.y+p.h))+20:20};

 item.style.left=Math.round(pos.x)+"px";
 item.style.top=Math.round(pos.y)+"px";
 item.appendChild(media);

 /* New library items must receive exactly the same editing machinery
    as items created by buildWall(). */
 ["nw","ne","sw","se"].forEach(corner=>{
   const handle=document.createElement("div");
   handle.className=`resize-handle ${corner}`;
   handle.dataset.corner=corner;
   item.appendChild(handle);
   if(typeof enableResizing==="function")enableResizing(item,handle,corner);
 });

 item.addEventListener("click",ev=>{
   if(document.body.classList.contains("edit-mode")){
     ev.stopPropagation();
     selectItem(item);
     return;
   }
   const idx=lightboxItems.findIndex(x=>x.src===src);
   if(idx>=0)openLightbox(idx);
 });

 if(typeof enableDragging==="function")enableDragging(item);

 wall.appendChild(item);

 if(!lightboxItems.some(x=>x.src===src)){
   lightboxItems.push({type:media.tagName==="VIDEO"?"video":"img",src});
 }

 if(typeof growWallToContent==="function")growWallToContent();
 if(typeof scheduleLocalDraftSave==="function")scheduleLocalDraftSave();
}

function removeOne(src){
 wall.querySelectorAll(".wall-item").forEach(x=>{if(x.dataset.src===src)x.remove()});
 if(typeof growWallToContent==="function")growWallToContent();
 if(typeof scheduleLocalDraftSave==="function")scheduleLocalDraftSave();
}

function render(){
 if(!grid)return;
 grid.innerHTML="";
 const current=wallSet(), chosen=filter?.value||"all";
 catalogue().forEach(m=>{
   const b=bucket(m);
   if(chosen!=="all"&&b!==chosen)return;
   const src=m.getAttribute("src");
   const card=document.createElement("div");
   card.className="library-item";
   card.dataset.kind=m.dataset.kind||"";
   if(current.has(src))card.classList.add("on-wall");
   const preview=m.cloneNode(true);
   if(preview.tagName==="VIDEO"){preview.muted=true;preview.playsInline=true;preview.preload="metadata"}
   const label=document.createElement("span");
   label.className="library-name";label.textContent=src.split("/").pop();
   card.append(preview,label);
   card.onclick=()=>{wallSet().has(src)?removeOne(src):addOne(m);render()};
   grid.appendChild(card);
 });
}

document.getElementById("clear-wall")?.addEventListener("click",()=>{
 if(!confirm("Empty this wall and choose a new set from the media library? The source files stay untouched."))return;
 if(!document.body.classList.contains("edit-mode") && typeof toggleArchiveArrangeMode==="function"){
   toggleArchiveArrangeMode();
 }
 wall.querySelectorAll(".wall-item, .va-annotation").forEach(item=>item.remove());
 selectedItem=null;
 selectedItems.clear();
 if(typeof refreshSelectedClasses==="function")refreshSelectedClasses();
 if(typeof growWallToContent==="function")growWallToContent();
 render();
 library?.classList.add("open");
 if(typeof scheduleLocalDraftSave==="function")scheduleLocalDraftSave();
});
document.getElementById("open-library")?.addEventListener("click",()=>{
 if(!document.body.classList.contains("edit-mode") && typeof toggleArchiveArrangeMode==="function"){
   toggleArchiveArrangeMode();
 }
 render();
 library?.classList.add("open");
});
document.getElementById("close-library")?.addEventListener("click",()=>library?.classList.remove("open"));
filter?.addEventListener("change",render);
document.getElementById("add-visible-library")?.addEventListener("click",()=>{
 const chosen=filter?.value||"all";
 catalogue().forEach(m=>{if(chosen==="all"||bucket(m)===chosen)addOne(m)});
 render();
 if(typeof scheduleLocalDraftSave==="function")scheduleLocalDraftSave();
});
})();
</script>

<script>
/* v12.27 hard-fix: arrange toggle is intentionally independent of the main editor script. */
function toggleArchiveArrangeMode() {
    const body = document.body;
    const button = document.getElementById("editor-toggle");
    const panel = document.getElementById("editor-panel");

    if (!body || !button || !panel) {
        alert("Editor controls could not be found in this HTML.");
        return;
    }

    const entering = !body.classList.contains("edit-mode");
    body.classList.toggle("edit-mode", entering);

    button.textContent = entering ? "[ done ]" : "[ arrange ]";

    /* CSS owns the grouped toolbar; remove any stale inline display value. */
    panel.style.removeProperty("display");

    if (!entering) {
        try {
            if (typeof selectItem === "function") selectItem(null);
        } catch (err) {
            console.warn("Could not clear editor selection:", err);
        }
    }
}

/* Make sure a stale inline style cannot hide the panel after switching views/reloads. */
window.addEventListener("DOMContentLoaded", () => {
    const panel = document.getElementById("editor-panel");
    const button = document.getElementById("editor-toggle");
    if (panel) panel.style.removeProperty("display");
    if (button) button.textContent = "[ arrange ]";
});
</script>
