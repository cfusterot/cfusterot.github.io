<script>
/* Change Visual Archive folders without reloading the page. */
(function () {
    function currentView() {
        return new URLSearchParams(window.location.search).get("view");
    }

    function updateArchiveNavigation() {
        const view = currentView() || "";
        const vaBranch = document.querySelector('details[data-tree-id="visual-archive"]');
        if (vaBranch) vaBranch.open = true;

        document.querySelectorAll('[data-tree-id="visual-archive"] .active').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('[data-tree-id="visual-archive"] [aria-current="page"]').forEach(el => el.removeAttribute('aria-current'));

        document.querySelectorAll("[data-archive-view]").forEach(link => {
            const folder = link.querySelector('.folder');
            const isActive = link.dataset.archiveView === view;
            if (folder) folder.classList.toggle('active', isActive);
            if (isActive) link.setAttribute('aria-current','page');
        });

        const rootLink = document.querySelector('a[href="visual_archive.html"]');
        const rootFolder = rootLink ? rootLink.querySelector('.folder') : null;
        if (rootFolder) rootFolder.classList.toggle('active', !view);
        if (rootLink && !view) rootLink.setAttribute('aria-current','page');

        document.title =
            view === "escitalopram" ? "Escitalopram | Visual Archive" :
            view === "photo" ? "Photo | Visual Archive" :
            view === "video" ? "Video | Visual Archive" :
            "Visual Archive | Coral Fustero-Torre";
    }

function changeView(view, push=true) {
        const url = new URL(window.location.href);

        if (view) url.searchParams.set("view", view);
        else url.searchParams.delete("view");

        if (push) history.pushState({archiveView:view || null}, "", url);

        loadPublishedLayoutForView(view, () => {
            buildWall();
            updateArchiveNavigation();
            window.scrollTo({top:0, behavior:"auto"});
        });
    }

    document.addEventListener("DOMContentLoaded", () => {
        document.querySelectorAll("[data-archive-view]").forEach(link => {
            link.addEventListener("click", event => {
                event.preventDefault();
                changeView(link.dataset.archiveView);
            });
        });

        const rootLink = document.querySelector('a[href="visual_archive.html"]');
        if (rootLink) {
            rootLink.addEventListener("click", event => {
                event.preventDefault();
                changeView(null);
            });
        }

        updateArchiveNavigation();
    });

    window.addEventListener("popstate", () => changeView(currentView(), false));
})();

</script>

<script>
/* v12.36 — public page reads the current /layouts file with no browser cache. */
window.VISUAL_ARCHIVE_PUBLISHED_LAYOUTS = {};

function publishedLayoutFilenames(view) {
    if (view && !["photo", "video", "escitalopram"].includes(view)) return [];
    const basename = view
        ? `visual_archive_layout_${view}.js`
        : "visual_archive_layout.js";
    return [`layouts/${basename}`, basename];
}

async function fetchPublishedLayout(view) {
    const errors = [];

    for (const filename of publishedLayoutFilenames(view)) {
        try {
            const response = await fetch(
                filename + "?v=" + Date.now(),
                {cache:"no-store"}
            );
            if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);

            const code = await response.text();
            const holder = {};
            new Function("window", code)(holder);
            const layout = holder.VISUAL_ARCHIVE_LAYOUT;
            if (!layout || !Array.isArray(layout.items)) {
                throw new Error("file does not define window.VISUAL_ARCHIVE_LAYOUT");
            }
            return layout;
        } catch (err) {
            errors.push(`${filename}: ${err.message}`);
        }
    }

    console.error("Could not load a published Visual Archive layout:", errors.join(" | "));
    return null;
}

function loadPublishedLayoutForView(view, done) {
    const key = view || "main";

    fetchPublishedLayout(view).then(layout => {
        window.VISUAL_ARCHIVE_PUBLISHED_LAYOUTS[key] = layout;
        done();
    });
}

function activePublishedLayout() {
    const view = new URLSearchParams(window.location.search).get("view") || "";
    return window.VISUAL_ARCHIVE_PUBLISHED_LAYOUTS[view || "main"] || null;
}
</script>

/* Tiny old-GUI disclosure triangles */
.file-tree summary::before {
    content: "▶";
    display: inline-block;
    width: 12px;
    margin-right: 2px;
    font-size: 8px;
    vertical-align: 1px;
    color: #111;
}

.file-tree details[open] > summary::before {
    content: "▼";
}

/*
  Classic 90s-style folder icon made only with CSS.
  No emoji: looks closer to old Mac/Windows UI.
*/
.file-tree .folder::before {
    content: "";
    display: inline-block;
    width: 13px;
    height: 9px;
    margin-right: 5px;
    position: relative;
    top: 1px;

    background: #e8c75c;
    border: 1px solid #574a20;
    box-shadow:
        inset 1px 1px 0 #fff5b0,
        inset -1px -1px 0 #a1832d;
}

.file-tree .folder::after {
    content: "";
    position: absolute;
    width: 6px;
    height: 3px;
    left: 1px;
    top: -4px;

    background: #e8c75c;
    border: 1px solid #574a20;
    border-bottom: 0;
    box-shadow: inset 1px 1px 0 #fff5b0;
}

/* Needed for the pseudo-tab positioning */
.file-tree .folder {
    position: relative;
    display: inline-block;
}

/* Old document icon */
.file-tree .file::before {
    content: "";
    display: inline-block;
    width: 10px;
    height: 13px;
    margin-right: 6px;
    position: relative;
    top: 2px;

    background: #f4f4f4;
    border: 1px solid #555;

/* ==========================================================
   SHARED /archive/ FILE BROWSER — classic 90s desktop
   ========================================================== */
:root { --archive-sidebar: 250px; }

.archive-shell {
    min-height: 100vh;
    display: grid;
    grid-template-columns: var(--archive-sidebar) minmax(0, 1fr);
}

.file-sidebar {
    position: fixed;
    inset: 0 auto 0 0;
    width: var(--archive-sidebar);
    height: 100vh;
    overflow-y: auto;
    z-index: 20000;
    background: transparent;
    border-right: 2px solid #8b8b8b;
    box-shadow: inset -1px 0 0 #fff;
    padding: 18px 14px 40px;
    color: #111;
}

.file-index-title,
.file-tree,
.file-tree a,
.file-tree summary,
.file-tree span,
.archive-path {
    font-family: "Courier Prime", "Courier New", Courier, monospace !important;
    letter-spacing: 0;
}

/* text only — deliberately NOT a button */
.file-index-title {
    font-size: 18px;
    font-weight: 700;
    color: #111;
    background: transparent;
    border: 0;
    box-shadow: none;
    padding: 0 0 11px;
    margin: 0 0 13px;
    border-bottom: 1px solid #8b8b8b;
}

.file-tree {
    font-size: 12px;
    line-height: 1.58;
    color: #111;
}
.file-tree details { margin: 1px 0; }
.file-tree summary {
    cursor: pointer;
    list-style: none;
    white-space: nowrap;
}
.file-tree summary::-webkit-details-marker { display: none; }
.file-tree summary::before {
    content: "▶";
    display: inline-block;
    width: 12px;
    margin-right: 2px;
    font-size: 8px;
    vertical-align: 1px;
}
.file-tree details[open] > summary::before { content: "▼"; }

.file-tree .folder,
.file-tree .file {
    position: relative;
    display: inline-block;
    color: #111;
}

/* classic folder */
.file-tree .folder::before {
    content: "";
    display: inline-block;
    width: 13px;
    height: 9px;
    margin-right: 5px;
    position: relative;
    top: 1px;
    background: #e8c75c;
    border: 1px solid #574a20;
    box-shadow: inset 1px 1px 0 #fff5b0, inset -1px -1px 0 #a1832d;
}
.file-tree .folder::after {
    content: "";
    position: absolute;
    width: 6px;
    height: 3px;
    left: 1px;
    top: 1px;
    transform: translateY(-3px);
    background: #e8c75c;
    border: 1px solid #574a20;
    border-bottom: 0;
    box-shadow: inset 1px 1px 0 #fff5b0;
}

/* classic document */
.file-tree .file::before {
    content: "";
    display: inline-block;
    width: 10px;
    height: 13px;
    margin-right: 6px;
    position: relative;
    top: 2px;
    background: #f4f4f4;
    border: 1px solid #555;
    box-shadow: inset 1px 1px 0 #fff, inset -1px -1px 0 #b8b8b8;
}

.file-tree .children { margin-left: 16px; }
.file-tree a { color: #111; text-decoration: none; }
.file-tree a:hover, .file-tree a:focus {
    color: #fff;
    background: #000080;
    text-decoration: none;
    outline: none;
}
.file-tree .active { font-weight: 700; }

.archive-main {
    grid-column: 2;
    min-width: 0;
    padding: 18px 22px 80px;
}
.archive-path {
    display: inline-block;
    font-size: 12px;
    color: #111;
    background: #f1f1f1;
    border: 1px solid #9a9a9a;
    box-shadow: inset 1px 1px 0 #fff, inset -1px -1px 0 #c0c0c0;
    padding: 4px 7px;
    margin: 0 0 24px;
}

@media (max-width: 800px) {
    :root { --archive-sidebar: 165px; }
    .file-sidebar { padding: 12px 9px 30px; }
    .file-index-title { font-size: 14px; }
    .file-tree { font-size: 10px; }
    .archive-main { padding: 14px 10px 60px; }
}

/* ===== v5 hierarchy + type consistency ===== */
.file-index-title,
.file-tree,

.file-tree summary > a,
.file-tree .folder,
.file-tree .file,

/* ===== v6 precise directory indentation ===== */
.file-tree {
    --tree-indent: 18px;
}

/* Every row has the same baseline box model. */
.file-tree > div,
.file-tree > details,
.file-tree .children > div,
.file-tree .children > details {
    margin: 0 !important;
    padding: 0 !important;
}

/* Top-level entries all start at exactly the same x-position. */
.file-tree > div,
.file-tree > details > summary {
    padding-left: 0 !important;
}

/* Children are indented by one fixed unit per nesting level. */
.file-tree .children {
    margin-left: var(--tree-indent) !important;
    padding-left: 0 !important;
}

/* Nested children add one more identical unit, never an arbitrary extra offset. */
.file-tree .children .children {
    margin-left: var(--tree-indent) !important;
}

/* Keep disclosure triangles in a fixed-width column, so folder labels line up. */
.file-tree summary {
    display: flex !important;
    align-items: baseline !important;
    gap: 0 !important;
}

.file-tree summary::before {
    flex: 0 0 12px !important;
    width: 12px !important;
    margin-right: 2px !important;
}

/* Plain top-level files (index.html) need the same icon column as folder summaries. */
.file-tree > div > a.file {
    display: inline-flex !important;
    align-items: baseline !important;
    margin-left: 14px !important; /* 12px triangle column + 2px gap */
}

/* For nested files, align their document icon with nested folder icons. */
.file-tree .children > div > a.file {
    display: inline-flex !important;
    align-items: baseline !important;
    margin-left: 14px !important;
}

/* Main folder names all use identical typography and line box. */
.file-tree > details > summary > a,
.file-tree > details > summary > span,
.file-tree > details > summary .folder {
    font-size: 12px !important;
    line-height: 1.58 !important;
    font-weight: 400 !important;
}

/* Current active main folder may be bold, but never shifted. */
.file-tree > details > summary .folder.active {
    font-weight: 700 !important;
}

/* Prevent links inside summary from creating browser-default spacing. */
.file-tree summary > a {
    display: inline-flex !important;
    align-items: baseline !important;
    margin: 0 !important;
    padding: 0 !important;
}

/* Make folder/document icons occupy consistent width. */
.file-tree .folder::before {
    width: 13px !important;

}
.file-tree .file::before {
    width: 10px !important;

}

<script>
const wall = document.getElementById("image-wall");

const source = document.getElementById("source-media");

function syncArchiveManifest() {
    const existing = new Set(
        Array.from(source.querySelectorAll(":scope > img, :scope > video"))
             .map(el => el.getAttribute("src"))
    );

    const catalogue = Array.isArray(window.ARCHIVE_MEDIA)
        ? [...window.ARCHIVE_MEDIA]
        : [];

    /* The curated layout itself is also a valid source catalogue.
       This guarantees the saved composition can render even if the
       generated manifest is missing or stale. */
    if (window.VISUAL_ARCHIVE_LAYOUT &&
        Array.isArray(window.VISUAL_ARCHIVE_LAYOUT.items)) {
        window.VISUAL_ARCHIVE_LAYOUT.items.forEach(item => {
            if (!item?.src) return;
            catalogue.push({
                src: item.src,
                type: /\.(mp4|mov|m4v)$/i.test(item.src) ? "video" : "img",
                kind: item.src.includes("/cutouts/") ? "cutout" : "",
                project:
                    item.src.includes("/collage/") ? "escitalopram" :
                    item.src.includes("/super8/") ? "video" : ""
            });
        });
    }

    catalogue.forEach(entry => {
        if (!entry || !entry.src || existing.has(entry.src)) return;

        const media = document.createElement(entry.type === "video" ? "video" : "img");
        media.setAttribute("src", entry.src);

        if (entry.project) media.dataset.project = entry.project;
        if (entry.kind) media.dataset.kind = entry.kind;
        if (entry.kind === "cutout") media.dataset.shape = "shape-block";

        source.appendChild(media);
        existing.add(entry.src);
    });
}

syncArchiveManifest();

let lightboxItems = [];
let lightboxIndex = 0;
let selectedItem = null;
let maxZ = 100;

function currentArchiveViewForLayout() {
    return new URLSearchParams(window.location.search).get("view") || "";
}

function currentLayoutStorageKey() {
    const view = currentArchiveViewForLayout();
    return "visualArchiveManualLayout_v5" + (view ? "_" + view : "_main");
}

/* deterministic randomness: same automatic collage after reload */
function mulberry32(seed) {
    return function() {
        let t = seed += 0x6D2B79F5;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
}

let rand = mulberry32(1981);

function choice(arr) {
    return arr[Math.floor(rand() * arr.length)];
}

/*
  Much broader size vocabulary than the previous version.
  This is closer to the reference books: tiny object fragments,
  medium editorial photos and a few dominant images.
*/
const SIZE_PRESETS = [
    [55, 55], [65, 90], [85, 65], [80, 105],
    [95, 95], [105, 135], [120, 80], [120, 150],
    [135, 105], [145, 175], [155, 115], [160, 200],
    [180, 130], [180, 220], [205, 150], [210, 260],
    [235, 170], [240, 240], [260, 185], [275, 225],
    [290, 190], [300, 260]
];

const MOBILE_SCALE = 0.66;

const SHAPES = [
    "shape-block", "shape-block", "shape-block", "shape-block",
    "shape-chamfer-tr", "shape-chamfer-bl",
    "shape-slant-top", "shape-slant-bottom",
    "shape-oval", "shape-circle",
    "shape-arch", "shape-ticket",
    "shape-diamond", "shape-soft-diamond",
    "shape-trapezoid", "shape-inverse-trapezoid",
    "shape-tab-left", "shape-tab-right",
    "shape-torn-1", "shape-torn-2",
    "shape-organic", "shape-pill",
    "shape-halfmoon", "shape-corner-cut",
    "shape-doily-round", "shape-doily-square",
    "shape-beermat-round", "shape-beermat-square",
    "shape-lace-strip", "shape-coaster-flower",
    "shape-triangle-up",
    "shape-triangle-down",
    "shape-triangle-left",
    "shape-triangle-right",
    "shape-hexagon",
    "shape-octagon",
    "shape-parallelogram",
    "shape-chevron"
];

const COLLAGE_PLAY_SHAPES = [
  "shape-block","shape-oval","shape-circle","shape-arch","shape-ticket",
  "shape-diamond","shape-soft-diamond","shape-trapezoid",
  "shape-torn-1","shape-torn-2","shape-organic","shape-pill",
  "shape-halfmoon","shape-doily-round","shape-coaster-flower",
  "shape-triangle-up","shape-triangle-down","shape-hexagon",
  "shape-octagon","shape-parallelogram","shape-chevron"
];

const PRINTS = [
    "", "", "", "", "", "",
    "photocopy", "photocopy",
    "ink-heavy", "faded"
];

/* ----------------------------------------------------------
   COLLISION / AUTO PACKING
   ---------------------------------------------------------- */

function rectsCollide(a, b, gap = 7) {
    return !(
        a.x + a.w + gap <= b.x ||
        b.x + b.w + gap <= a.x ||
        a.y + a.h + gap <= b.y ||
        b.y + b.h + gap <= a.y
    );
}

function findPackedPosition(w, h, placed, containerWidth) {
    const step = 8;
    const maxX = Math.max(0, containerWidth - w);

    /*
      Try positions from top to bottom. For each y we shuffle
      x-start slightly, so the result doesn't read as a strict grid.
    */
    for (let y = 0; y < 30000; y += step) {
        const offset = Math.floor(rand() * 6) * step;

        for (let x0 = offset; x0 <= maxX; x0 += step) {
            const x = Math.min(x0, maxX);
            const rect = {x, y, w, h};

            if (!placed.some(p => rectsCollide(rect, p, 8))) {
                return {x, y};
            }
        }
    }

    return {x: 0, y: placed.length ? Math.max(...placed.map(p => p.y + p.h)) + 8 : 0};
}

function buildWall() {
    const allOriginals = Array.from(
        source.querySelectorAll(":scope > img, :scope > video")
    );

    const archiveView = new URLSearchParams(window.location.search).get("view");
    const durableLayout = activePublishedLayout();

    /*
      IMPORTANT:
      - root Visual Archive = curated summary
      - photo/video/escitalopram = complete catalogue views
      - each view may have its OWN durable published coordinates
    */
    let originals;

    if (!archiveView && durableLayout &&
        Array.isArray(durableLayout.items)) {

        const wanted = new Set(
            durableLayout.items.map(item => item.src)
        );

        originals = allOriginals.filter(el =>
            wanted.has(el.getAttribute("src"))
        );
    } else {
        originals = allOriginals.filter(el => {
            if (!archiveView) return true;

            const src = el.getAttribute("src") || "";

            if (archiveView === "escitalopram") {
                return el.dataset.project === "escitalopram" ||
                       src.includes("/collage/");
            }

            if (archiveView === "photo") {
                return el.tagName === "IMG" &&
                       src.includes("/photography/") &&
                       !src.includes("/photography/derives/");
            }

            if (archiveView === "video") {
                return el.tagName === "VIDEO" &&
                       src.includes("/super8/");
            }

            return true;
        });
    }

    /* Each catalogue view starts its own layout from the top. */
    const viewSeed = archiveView
        ? Array.from(archiveView).reduce((n, ch) => n + ch.charCodeAt(0), 0)
        : 0;
    rand = mulberry32(1981 + viewSeed);

    wall.innerHTML = "";
    lightboxItems = [];

    const mobile = window.innerWidth <= 768;
    const scale = mobile ? MOBILE_SCALE : 1;
    const placed = [];
    const containerWidth = wall.clientWidth;

    const savedLayout =
        durableLayout && Array.isArray(durableLayout.items)
            ? new Map(durableLayout.items.map(x => [x.src, x]))
            : null;

    originals.forEach((original, index) => {
        const item = document.createElement("div");
        item.className = "wall-item";
        item.dataset.index = String(index);
        item.dataset.src = original.getAttribute("src");
        if (original.dataset.kind) item.dataset.kind = original.dataset.kind;
        item.dataset.project = original.dataset.project || "";

        const saved = savedLayout?.get(item.dataset.src);

        let w, h, x, y;

        if (saved) {
            w = parseFloat(saved.width) || 180;
            h = parseFloat(saved.height) || 140;
            x = parseFloat(saved.left) || 0;
            y = parseFloat(saved.top) || 0;

            item.style.width = saved.width || `${w}px`;
            item.style.height = saved.height || `${h}px`;
            item.style.left = saved.left || `${x}px`;
            item.style.top = saved.top || `${y}px`;
            item.style.zIndex = saved.zIndex || "";

            item.classList.add(saved.shape || "shape-block");
            if (saved.silhouette) item.classList.add("silhouette");
        } else {
            [w, h] = choice(SIZE_PRESETS);

            const roll = rand();
            if (roll < .12) {
                [w, h] = choice([[45,45],[50,70],[65,45],[70,55]]);
            } else if (roll > .94) {
                [w, h] = choice([[320,230],[300,300],[340,190]]);
            }

            w *= scale;
            h *= scale;

            item.style.width = `${Math.round(w)}px`;
            item.style.height = `${Math.round(h)}px`;

            /* transparent cutouts should stay as their real silhouette */
            item.classList.add(
                original.dataset.kind === "cutout"
                    ? "shape-block"
                    : (original.dataset.shape ||
                       choice(archiveView === "escitalopram"
                         ? COLLAGE_PLAY_SHAPES
                         : SHAPES))
            );

            const print = original.dataset.kind === "cutout"
                ? ""
                : (original.dataset.treatment || choice(PRINTS));
            if (print) item.classList.add(print);

            const pos = findPackedPosition(w, h, placed, containerWidth);
            x = pos.x; y = pos.y;
            item.style.left = `${Math.round(x)}px`;
            item.style.top = `${Math.round(y)}px`;
        }

        placed.push({x, y, w, h});

        const media = original.cloneNode(true);
        media.removeAttribute("data-project-desc");

        if (media.tagName === "IMG") media.loading = "lazy";

        if (media.tagName === "VIDEO") {
            media.muted = true;
            media.loop = true;
            media.playsInline = true;
            media.autoplay = true;
        }

        item.appendChild(media);

        /*
          Do not permanently capture a lightbox index here.
          The saved layout may later remove/reorder items.
          Resolve the index from the CURRENT visible wall when clicked.
        */
        item.addEventListener("click", () => {
            const src = item.dataset.src;
            const currentIndex = lightboxItems.findIndex(x => x.src === src);
            if (currentIndex >= 0) openLightbox(currentIndex);
        });

        wall.appendChild(item);
    });

    const rendered = Array.from(wall.querySelectorAll(".wall-item"));
    const bottom = rendered.length
        ? Math.max(...rendered.map(el =>
            (parseFloat(el.style.top) || 0) + el.offsetHeight
          ))
        : 500;

    wall.style.height = `${bottom + 80}px`;

    // Apply the local arrangement saved by visual_archive_editor.html.
    // This is intentionally done AFTER the complete section has been built.
    restoreSavedLayout();

    /*
      IMPORTANT:
      Lightbox navigation follows ONLY the items that remain in the current
      visible layout after saved removals have been applied.
      This prevents <- / -> from walking through the hidden catalogue.
    */
    lightboxItems = Array.from(
        wall.querySelectorAll(".wall-item")
    ).map(item => {
        const media = item.querySelector("img, video");
        return {
            type: media && media.tagName === "VIDEO" ? "video" : "img",
            src: item.dataset.src
        };
    });
}
/* ----------------------------------------------------------
   MANUAL ARRANGEMENT MODE
   ---------------------------------------------------------- */

function selectItem(item) {
    document.querySelectorAll(".wall-item.selected")
        .forEach(el => el.classList.remove("selected"));

    selectedItem = item;

    if (item) {
        item.classList.add("selected");

        const shapeSelect = document.getElementById("shape-select");
        const currentShape = EDIT_SHAPES.find(c => item.classList.contains(c));
        if (shapeSelect) shapeSelect.value = currentShape || "";
    }
}

function enableDragging(item) {
    let startX, startY, startLeft, startTop;

    item.addEventListener("pointerdown", e => {
        if (!document.body.classList.contains("edit-mode")) return;
        if (e.target.classList.contains("resize-handle")) return;

        selectItem(item);

        startX = e.clientX;
        startY = e.clientY;
        startLeft = parseFloat(item.style.left) || 0;
        startTop = parseFloat(item.style.top) || 0;

        item.setPointerCapture(e.pointerId);

        const move = ev => {
            const left = Math.max(0, startLeft + ev.clientX - startX);
            const top = Math.max(0, startTop + ev.clientY - startY);

            item.style.left = `${left}px`;
            item.style.top = `${top}px`;

            growWallToContent();
        };

        const up = ev => {
            item.releasePointerCapture(ev.pointerId);
            item.removeEventListener("pointermove", move);
            item.removeEventListener("pointerup", up);
        };

        item.addEventListener("pointermove", move);
        item.addEventListener("pointerup", up);
    });
}

function enableResizing(item, handle, corner) {
    let startX, startY, startW, startH, startLeft, startTop;

    handle.addEventListener("pointerdown", e => {
        if (!document.body.classList.contains("edit-mode")) return;

        e.stopPropagation();
        selectItem(item);

        startX = e.clientX;
        startY = e.clientY;
        startW = item.offsetWidth;
        startH = item.offsetHeight;
        startLeft = parseFloat(item.style.left) || 0;
        startTop = parseFloat(item.style.top) || 0;

        handle.setPointerCapture(e.pointerId);

        const move = ev => {
            const dx = ev.clientX - startX;
            const dy = ev.clientY - startY;

            let newW = startW;
            let newH = startH;
            let newLeft = startLeft;
            let newTop = startTop;

            if (corner.includes("e")) {
                newW = Math.max(35, startW + dx);
            }

            if (corner.includes("s")) {
                newH = Math.max(35, startH + dy);
            }

            if (corner.includes("w")) {
                newW = Math.max(35, startW - dx);
                newLeft = startLeft + (startW - newW);
            }

            if (corner.includes("n")) {
                newH = Math.max(35, startH - dy);
                newTop = startTop + (startH - newH);
            }

            /*
              Prevent the object from being resized beyond the top/left
              edge of the collage.
            */
            if (newLeft < 0) {
                newW += newLeft;
                newLeft = 0;
            }

            if (newTop < 0) {
                newH += newTop;
                newTop = 0;
            }

            item.style.left = `${newLeft}px`;
            item.style.top = `${newTop}px`;
            item.style.width = `${Math.max(35, newW)}px`;
            item.style.height = `${Math.max(35, newH)}px`;

            growWallToContent();
        };

        const up = ev => {
            handle.releasePointerCapture(ev.pointerId);
            handle.removeEventListener("pointermove", move);
            handle.removeEventListener("pointerup", up);
        };

        handle.addEventListener("pointermove", move);
        handle.addEventListener("pointerup", up);
    });
}

function growWallToContent() {
    const items = Array.from(document.querySelectorAll(".wall-item"));

    const bottom = items.length
        ? Math.max(...items.map(el => (parseFloat(el.style.top)||0) + el.offsetHeight))
        : 500;

    wall.style.height = `${bottom + 100}px`;
}

document.getElementById("editor-toggle")?.addEventListener("click", () => {

const EDIT_SHAPES = [

document.getElementById("cycle-shape")?.addEventListener("click", () => {

    if (current < 0) current = 0;

document.getElementById("shape-select")?.addEventListener("change", e => {
    if (!selectedItem || !e.target.value) return;

    EDIT_SHAPES.forEach(c => selectedItem.classList.remove(c));

document.getElementById("bring-front")?.addEventListener("click", () => {

    maxZ += 1;
    selectedItem.style.zIndex = maxZ;

function serializeLayout() {
    const items = Array.from(document.querySelectorAll(".wall-item")).map(item => ({
        src: item.dataset.src,
        left: item.style.left,
        top: item.style.top,
        width: item.style.width,
        height: item.style.height,
        zIndex: item.style.zIndex || "",
        silhouette: item.classList.contains("silhouette"),
        shape: EDIT_SHAPES.find(c => item.classList.contains(c)) || "shape-block"
    }));

    const visibleSources = new Set(items.map(item => item.src));

    const removed = Array.from(
        source.querySelectorAll(":scope > img, :scope > video")
    )
    .map(el => el.getAttribute("src"))
    .filter(src => !visibleSources.has(src));

    return {
        items,
        removed
    };
}


document.getElementById("delete-item")?.addEventListener("click", () => {
    if (!selectedItem) return;

    const src = selectedItem.dataset.src;

    /*
      Remove the selected collage item immediately.
      This does NOT delete the source image file from the repository.
      It only removes it from the current arrangement.
    */
    selectedItem.remove();
    selectedItem = null;

    /*
      Remove the matching source entry from the hidden source list too,
      so an exported HTML cleanup can know which media were intentionally
      excluded from the collage.
    */
    const original = Array.from(
        source.querySelectorAll(":scope > img, :scope > video")
    ).find(el => el.getAttribute("src") === src);

    if (original) {
        original.dataset.removedFromCollage = "true";
    }

    renderVAAnnotations(saved.annotations || []);
    growWallToContent();
});








function renderVAAnnotations(list){
  document.querySelectorAll(".va-annotation").forEach(x=>x.remove());

  function esc(s){
    return String(s||"")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;");
  }
  function markup(type,text,data){
    if(type==="text") return `<div class="va-annotation-text">${esc(text)}</div>`;
    if(type==="box") return "";
    const connector=type.startsWith("arrow-")||type.startsWith("line-");
    if(!connector) return "";

    const curved=type.endsWith("-curve");
    const w=Math.max(1,parseFloat(data.width)||150);
    const h=Math.max(1,parseFloat(data.height)||60);
    const p=data.connector || (curved
      ? {x1:10,y1:h-16,x2:w-12,y2:h*.58,cx:w*.48,cy:10}
      : {x1:10,y1:h*.52,x2:w-12,y2:h*.48,cx:w/2,cy:h/2});
    const path=curved
      ? `M ${p.x1} ${p.y1} Q ${p.cx} ${p.cy} ${p.x2} ${p.y2}`
      : `M ${p.x1} ${p.y1} L ${p.x2} ${p.y2}`;

    let head="";
    if(type.startsWith("arrow-")){
      const tx=p.x2-(curved?p.cx:p.x1);
      const ty=p.y2-(curved?p.cy:p.y1);
      const len=Math.max(.001,Math.hypot(tx,ty));
      const ux=tx/len,uy=ty/len,px=-uy,py=ux;
      const ax=p.x2-ux*8+px*3.4, ay=p.y2-uy*8+py*3.4;
      const bx=p.x2-ux*8-px*3.4, by=p.y2-uy*8-py*3.4;
      head=`M ${ax} ${ay} L ${p.x2} ${p.y2} L ${bx} ${by}`;
    }

    return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
      <path class="va-connector-path" d="${path}"></path>
      <path class="va-connector-head" d="${head}"></path>
    </svg>`;
  }

  (Array.isArray(list)?list:[]).forEach(data=>{
    const item=document.createElement("div");
    item.className="va-annotation";
    if(data.type==="box") item.classList.add("va-annotation-box");
    if((data.type||"").startsWith("arrow-")||(data.type||"").startsWith("line-"))item.classList.add("va-connector");
    item.style.left=data.left||"80px";
    item.style.top=data.top||"80px";
    item.style.width=data.width||"150px";
    item.style.height=data.height||"50px";
    item.style.zIndex=data.zIndex||"7000";
    item.style.transform=`rotate(${Number(data.rotation)||0}deg)`;
    item.innerHTML=markup(data.type||"text",data.text||"",data);
    wall.appendChild(item);
  });
}

function restoreSavedLayout() {
    const params = new URLSearchParams(location.search);
    const allowLocal =
        params.get("draft") === "local" &&
        (location.protocol === "file:" ||
         location.hostname === "localhost" ||
         location.hostname === "127.0.0.1" ||
         location.hostname === "0.0.0.0");

    let saved = activePublishedLayout();

    if (allowLocal) {
        const raw = localStorage.getItem(currentLayoutStorageKey());
        if (raw) {
            try {
                const local = JSON.parse(raw);
                if (local && Array.isArray(local.items)) saved = local;
            } catch {}
        }
    }

    if (!saved || !Array.isArray(saved.items)) return;

    const savedItems = saved.items || [];
    const removedSet = new Set(saved.removed || []);
    const wanted = new Set(savedItems.map(x => x.src));

    document.querySelectorAll(".wall-item").forEach(item => {
        if (removedSet.has(item.dataset.src) ||
            (savedItems.length && !wanted.has(item.dataset.src))) {
            item.remove();
        }
    });

    const bySrc = new Map(savedItems.map(x => [x.src, x]));

    document.querySelectorAll(".wall-item").forEach(item => {
        const s = bySrc.get(item.dataset.src);
        if (!s) return;

        item.style.left = s.left;
        item.style.top = s.top;
        item.style.width = s.width;
        item.style.height = s.height;
        item.style.zIndex = s.zIndex || "";

        EDIT_SHAPES.forEach(c => item.classList.remove(c));
        item.classList.add(s.shape || "shape-block");
        item.classList.toggle("silhouette", !!s.silhouette);
    });

    renderVAAnnotations(saved.annotations || []);
    growWallToContent();
}

/* ----------------------------------------------------------
   LIGHTBOX
   ---------------------------------------------------------- */

function openLightbox(index) {
    lightboxIndex = index;
    renderLightbox();
    document.getElementById("lightbox").classList.add("open");
    document.body.style.overflow = "hidden";
}

function renderLightbox() {
    if (!lightboxItems.length) return;

    const item = lightboxItems[lightboxIndex];
    const img = document.getElementById("lightbox-img");
    const video = document.getElementById("lightbox-video");

    video.pause();

    if (item.type === "video") {
        img.style.display = "none";
        video.src = item.src;
        video.style.display = "block";
        video.play().catch(() => {});
    } else {
        video.style.display = "none";
        img.src = item.src;
        img.style.display = "block";
    }

    document.getElementById("counter").textContent =
        `${lightboxIndex + 1} / ${lightboxItems.length}`;
}

function moveLightbox(direction) {
    lightboxIndex =
        (lightboxIndex + direction + lightboxItems.length)
        % lightboxItems.length;

    renderLightbox();
}

function closeLightbox() {
    const box = document.getElementById("lightbox");
    const video = document.getElementById("lightbox-video");

    box.classList.remove("open");
    video.pause();
    document.body.style.overflow = "";
}

document.addEventListener("keydown", e => {
    const box = document.getElementById("lightbox");

    if (box.classList.contains("open")) {
        if (e.key === "ArrowLeft") moveLightbox(-1);
        if (e.key === "ArrowRight") moveLightbox(1);
        if (e.key === "Escape") closeLightbox();
        return;
    }

    if (document.body.classList.contains("edit-mode") && selectedItem) {
        if (e.key.toLowerCase() === "s") {
            selectedItem.classList.toggle("silhouette");
        }
    }
});

window.addEventListener("DOMContentLoaded", () => {
    const initialView = new URLSearchParams(window.location.search).get("view") || "";
    loadPublishedLayoutForView(initialView, () => buildWall());
});

const EDITOR_IS_LOCAL =
    location.protocol === "file:" ||
    location.hostname === "localhost" ||
    location.hostname === "127.0.0.1";

window.addEventListener("DOMContentLoaded", () => {
    if (!EDITOR_IS_LOCAL) {
        document.getElementById("editor-toggle")?.remove();
        document.getElementById("editor-panel")?.remove();
    }
});

<script>
/* Persist the user's folder state. First visit = all closed. */
(function () {
    const KEY = "archiveTreeOpenStateV2";

    function loadState() {
        try { return JSON.parse(localStorage.getItem(KEY) || "{}"); }
        catch { return {}; }
    }

    function saveState(state) {
        try { localStorage.setItem(KEY, JSON.stringify(state)); }
        catch {}
    }

    function restoreTree() {
        const state = loadState();

        document.querySelectorAll(".file-tree details[data-tree-id]").forEach(details => {
            const id = details.dataset.treeId;
            details.open = Object.prototype.hasOwnProperty.call(state, id)
                ? !!state[id]
                : false;

            details.addEventListener("toggle", () => {
                const current = loadState();
                current[id] = details.open;
                saveState(current);
            });
        });

        document.documentElement.classList.remove("tree-state-pending");
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", restoreTree, {once:true});
    } else {
        restoreTree();
    }
})();
</script>

<div id="collage-play-controls">
  <button type="button" id="collage-play-toggle">[ rearrange ]</button>
  <button type="button" id="collage-play-reset">[ reset ]</button>
</div>


<script>
(function(){
  const view = new URLSearchParams(location.search).get("view");
  if (view !== "escitalopram") return;

  const controls = document.getElementById("collage-play-controls");
  const toggle = document.getElementById("collage-play-toggle");
  const reset = document.getElementById("collage-play-reset");
  const wall = document.getElementById("image-wall");
  const KEY = "publicCollagePlayLayoutV1";
  controls.style.display = "flex";

  let enabled = false;

  function items(){ return Array.from(wall.querySelectorAll(".wall-item")); }

  function save(){
    const data = items().map(el => ({
      src: el.dataset.src,
      left: el.style.left,
      top: el.style.top,
      zIndex: el.style.zIndex || ""
    }));
    localStorage.setItem(KEY, JSON.stringify(data));
  }

  function restore(){
    let data;
    try { data = JSON.parse(localStorage.getItem(KEY) || "null"); } catch {}
    if (!Array.isArray(data)) return;
    const map = new Map(data.map(x => [x.src,x]));
    items().forEach(el => {
      const x = map.get(el.dataset.src);
      if (!x) return;
      el.style.left = x.left;
      el.style.top = x.top;
      el.style.zIndex = x.zIndex;
    });
  }

  function bind(el){
    el.addEventListener("pointerdown", ev => {
      if (!enabled) return;
      ev.preventDefault();
      ev.stopPropagation();

      const rect = el.getBoundingClientRect();
      const wallRect = wall.getBoundingClientRect();
      const offsetX = ev.clientX - rect.left;
      const offsetY = ev.clientY - rect.top;
      el.classList.add("dragging");
      el.setPointerCapture(ev.pointerId);

      const move = e => {
        const x = e.clientX - wallRect.left - offsetX;
        const y = e.clientY - wallRect.top - offsetY;
        el.style.left = Math.max(0,x) + "px";
        el.style.top = Math.max(0,y) + "px";
      };

      const up = e => {
        el.releasePointerCapture(e.pointerId);
        el.classList.remove("dragging");
        el.removeEventListener("pointermove", move);
        el.removeEventListener("pointerup", up);
        save();
      };

      el.addEventListener("pointermove", move);
      el.addEventListener("pointerup", up);
    });
  }

  window.addEventListener("load", () => {
    restore();
    items().forEach(bind);
  });

  toggle.addEventListener("click", () => {
    enabled = !enabled;
    document.body.classList.toggle("collage-play-mode", enabled);
    toggle.textContent = enabled ? "[ done ]" : "[ rearrange ]";
  });

  reset.addEventListener("click", () => {
    localStorage.removeItem(KEY);
    location.reload();
  });
})();
</script>
