<style>
* {
    box-sizing: border-box;
    font-family: "Courier Prime", monospace;
}

:root {
    --paper: #e5e5e2;
    --ink: #444;
    --muted: #969691;
}

html { scroll-behavior: smooth; }

body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    overflow-x: hidden;
}

body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 99999;
    pointer-events: none;
    opacity: .04;
    mix-blend-mode: multiply;
    background-image: radial-gradient(rgba(0,0,0,.18) .45px, transparent .6px);
    background-size: 4px 4px;
}

header {
    max-width: 1500px;
    margin: 0 auto;
    padding: 2rem;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    position: relative;
    z-index: 5000;
}

.logo {
    color: var(--ink);
    text-decoration: none;
    text-transform: uppercase;
    font-size: 1.1rem;
    font-weight: 700;
}

nav a {
    color: var(--muted);
    text-decoration: none;
    font-size: .85rem;
}

main {
    width: 100%;
    max-width: 1500px;
    margin: 0 auto;
    padding: 2vh 2.5vw 12vh;
}

#source-media { display: none; }

/* ==========================================================
   DENSE BOOK / TUMBLR COLLAGE
   ========================================================== */

#image-wall {
    position: relative;
    width: 100%;
    min-height: 100vh;
}

/*
  Absolute positioning is deliberate:
  - automatic layout packs the pieces closely without overlap
  - edit mode can later move them freely
*/
.wall-item {
    position: absolute;
    cursor: zoom-in;
    transform-origin: center center;
    transition: filter .18s ease, opacity .18s ease;
    user-select: none;
    touch-action: none;
}

.wall-item img,
.wall-item video {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: grayscale(100%) sepia(5%) contrast(116%) brightness(96%);
    opacity: .91;
    mix-blend-mode: multiply;
    pointer-events: none;
}

@media (hover:hover) and (pointer:fine) {
    body:not(.edit-mode) .wall-item:hover img,
    body:not(.edit-mode) .wall-item:hover video {
        filter: none !important;
        opacity: 1;
        mix-blend-mode: normal;
    }
}

/* Printing treatments */
.wall-item.photocopy img,
.wall-item.photocopy video {
    filter: grayscale(100%) contrast(178%) brightness(92%);
    opacity: .84;
}

.wall-item.ink-heavy img,
.wall-item.ink-heavy video {
    filter: grayscale(100%) contrast(148%) brightness(80%);
    opacity: .94;
}

.wall-item.faded img,
.wall-item.faded video {
    filter: grayscale(100%) sepia(8%) contrast(91%) brightness(111%);
    opacity: .70;
}

.wall-item.silhouette img,
.wall-item.silhouette video {
    filter: grayscale(100%) contrast(520%) brightness(40%);
    opacity: .98;
}

/* Original shape language + a couple of cut-out options */
.shape-block img, .shape-block video {
    clip-path: inset(0);
}

.shape-chamfer-tr img, .shape-chamfer-tr video {
    clip-path: polygon(0 0, calc(100% - 25px) 0, 100% 25px, 100% 100%, 0 100%);
}

.shape-chamfer-bl img, .shape-chamfer-bl video {
    clip-path: polygon(0 0, 100% 0, 100% 100%, 25px 100%, 0 calc(100% - 25px));
}

.shape-slant-top img, .shape-slant-top video {
    clip-path: polygon(0 15px, 100% 0, 100% 100%, 0 100%);
}

.shape-slant-bottom img, .shape-slant-bottom video {
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 15px), 0 100%);
}

.shape-oval img, .shape-oval video {
    clip-path: ellipse(48% 49% at 50% 50%);
}

.shape-circle img, .shape-circle video {
    clip-path: circle(48% at 50% 50%);
}

/* ==========================================================
   EDIT MODE
   ========================================================== */

#editor-toggle {
    position: fixed;
    right: 22px;
    bottom: 20px;
    z-index: 90000;
    border: 0;
    padding: 8px 10px;
    background: rgba(229,229,226,.9);
    color: #777;
    font-size: .72rem;
    cursor: pointer;
}

#editor-panel {
    position: fixed;
    left: 20px;
    bottom: 18px;
    z-index: 90000;
    display: none;
    gap: 5px;
    flex-wrap: wrap;
    max-width: calc(100vw - 170px);
}

body.edit-mode #editor-panel { display: flex; }

#editor-panel button {
    border: 0;
    padding: 7px 9px;
    background: rgba(229,229,226,.94);
    color: #666;
    font-size: .7rem;
    cursor: pointer;
}

body.edit-mode .wall-item {
    cursor: grab;
    outline: 1px dashed transparent;
}

body.edit-mode .wall-item.selected {
    outline-color: rgba(0,0,0,.35);
    z-index: 50000 !important;
}

.resize-handle {
    display: none;
    position: absolute;
    right: -6px;
    bottom: -6px;
    width: 13px;
    height: 13px;
    background: var(--paper);
    border: 1px solid #555;
    cursor: nwse-resize;
    z-index: 10;
}

body.edit-mode .wall-item.selected .resize-handle {
    display: block;
}

/* ==========================================================
   LIGHTBOX
   ========================================================== */

#lightbox {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 999999;
    align-items: center;
    justify-content: center;
    background: rgba(245,245,242,.975);
    cursor: zoom-out;
}

#lightbox.open { display: flex; }

.lightbox-inner {
    width: 92vw;
    height: 90vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

#lightbox-img,
#lightbox-video {

    max-width: 88vw;
    max-height: 86vh;
    width: auto;
    height: auto;
    object-fit: contain;
    filter: none !important;
    opacity: 1 !important;
    mix-blend-mode: normal !important;
    clip-path: none !important;
}

#lightbox-close {
    position: fixed;
    top: 22px;
    right: 25px;
    z-index: 1000002;
    border: 0;
    background: transparent;
    color: #666;
    font-size: .8rem;
    cursor: pointer;
}

.lightbox-nav {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    z-index: 1000001;
    border: 0;
    background: transparent;
    color: #666;
    font-family: 'Special Elite', monospace !important;
    font-size: 2.2rem;
    cursor: pointer;
    padding: 14px;
}

#prev { left: 2.5vw; }
#next { right: 2.5vw; }

#counter {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    color: #aaa;
    font-size: .7rem;
}

footer {
    padding: 5rem 0;

@media (max-width: 768px) {

    .lightbox-nav { font-size: 1.8rem; }
    #prev { left: 3px; }
    #next { right: 3px; }
}

<script>
const wall = document.getElementById("image-wall");
const source = document.getElementById("source-media");

let lightboxItems = [];
let lightboxIndex = 0;
let selectedItem = null;
let maxZ = 100;

const STORAGE_KEY = "visualArchiveManualLayout_v4";

/* deterministic randomness: same automatic collage after reload */
function mulberry32(seed) {
    return function() {
        let t = seed += 0x6D2B79F5;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
}

const rand = mulberry32(1981);

function choice(arr) {
    return arr[Math.floor(rand() * arr.length)];
}

/*
  Much broader size vocabulary than the previous version.
  This is closer to the reference books: tiny object fragments,
  medium editorial photos and a few dominant images.
*/
const SIZE_PRESETS = [
    [55, 55], [65, 90], [85, 65], [80, 105],
    [95, 95], [105, 135], [120, 80], [120, 150],
    [135, 105], [145, 175], [155, 115], [160, 200],
    [180, 130], [180, 220], [205, 150], [210, 260],
    [235, 170], [240, 240], [260, 185], [275, 225],
    [290, 190], [300, 260]
];

const MOBILE_SCALE = 0.66;

const SHAPES = [
    "shape-block", "shape-block", "shape-block", "shape-block",
    "shape-block", "shape-block",
    "shape-chamfer-tr", "shape-chamfer-bl",
    "shape-slant-top", "shape-slant-bottom",
    "shape-oval", "shape-circle"
];

const PRINTS = [
    "", "", "", "", "", "",
    "photocopy", "photocopy",
    "ink-heavy", "faded"
];

/* ----------------------------------------------------------
   COLLISION / AUTO PACKING
   ---------------------------------------------------------- */

function rectsCollide(a, b, gap = 7) {
    return !(
        a.x + a.w + gap <= b.x ||
        b.x + b.w + gap <= a.x ||
        a.y + a.h + gap <= b.y ||
        b.y + b.h + gap <= a.y
    );
}

function findPackedPosition(w, h, placed, containerWidth) {
    const step = 8;
    const maxX = Math.max(0, containerWidth - w);

    /*
      Try positions from top to bottom. For each y we shuffle
      x-start slightly, so the result doesn't read as a strict grid.
    */
    for (let y = 0; y < 30000; y += step) {
        const offset = Math.floor(rand() * 6) * step;

        for (let x0 = offset; x0 <= maxX; x0 += step) {
            const x = Math.min(x0, maxX);
            const rect = {x, y, w, h};

            if (!placed.some(p => rectsCollide(rect, p, 8))) {
                return {x, y};
            }
        }
    }

    return {x: 0, y: placed.length ? Math.max(...placed.map(p => p.y + p.h)) + 8 : 0};
}

function buildWall() {
    const originals = Array.from(
        source.querySelectorAll(":scope > img, :scope > video")
    );

    wall.innerHTML = "";
    lightboxItems = [];

    const mobile = window.innerWidth <= 768;
    const scale = mobile ? MOBILE_SCALE : 1;
    const placed = [];
    const containerWidth = wall.clientWidth;

    originals.forEach((original, index) => {
        const item = document.createElement("div");
        item.className = "wall-item";
        item.dataset.index = String(index);
        item.dataset.src = original.getAttribute("src");

        let [w, h] = choice(SIZE_PRESETS);

        /*
          Preserve a strong mixture:
          occasional tiny fragments, occasional dominant images.
        */
        const roll = rand();

        if (roll < .12) {
            const tiny = choice([[45,45],[50,70],[65,45],[70,55]]);
            w = tiny[0];
            h = tiny[1];
        } else if (roll > .94) {
            const big = choice([[320,230],[300,300],[340,190]]);
            w = big[0];
            h = big[1];
        }

        w *= scale;
        h *= scale;

        item.style.width = `${Math.round(w)}px`;
        item.style.height = `${Math.round(h)}px`;

        item.classList.add(
            original.dataset.shape || choice(SHAPES)
        );

        const print = original.dataset.treatment || choice(PRINTS);
        if (print) item.classList.add(print);

        const pos = findPackedPosition(w, h, placed, containerWidth);

        item.style.left = `${Math.round(pos.x)}px`;
        item.style.top = `${Math.round(pos.y)}px`;

        placed.push({x: pos.x, y: pos.y, w, h});

        const media = original.cloneNode(true);
        media.removeAttribute("data-project-desc");

        if (media.tagName === "IMG") media.loading = "lazy";

        if (media.tagName === "VIDEO") {
            media.muted = true;
            media.loop = true;
            media.playsInline = true;
            media.autoplay = true;
        }

        item.appendChild(media);

        const handle = document.createElement("div");
        handle.className = "resize-handle";
        item.appendChild(handle);

        lightboxItems.push({
            type: media.tagName === "VIDEO" ? "video" : "img",
            src: media.getAttribute("src")
        });

        item.addEventListener("click", e => {
            if (document.body.classList.contains("edit-mode")) {
                e.stopPropagation();
                selectItem(item);
                return;
            }

            openLightbox(index);
        });

        enableDragging(item);
        enableResizing(item, handle);

        wall.appendChild(item);
    });

    const bottom = placed.length
        ? Math.max(...placed.map(p => p.y + p.h))
        : 500;

    wall.style.height = `${bottom + 80}px`;

    restoreSavedLayout();
}

/* ----------------------------------------------------------
   MANUAL ARRANGEMENT MODE
   ---------------------------------------------------------- */

function selectItem(item) {
    document.querySelectorAll(".wall-item.selected")
        .forEach(el => el.classList.remove("selected"));

    selectedItem = item;

    if (item) item.classList.add("selected");
}

function enableDragging(item) {
    let startX, startY, startLeft, startTop;

    item.addEventListener("pointerdown", e => {
        if (!document.body.classList.contains("edit-mode")) return;
        if (e.target.classList.contains("resize-handle")) return;

        selectItem(item);

        startX = e.clientX;
        startY = e.clientY;
        startLeft = parseFloat(item.style.left) || 0;
        startTop = parseFloat(item.style.top) || 0;

        item.setPointerCapture(e.pointerId);

        const move = ev => {
            const left = Math.max(0, startLeft + ev.clientX - startX);
            const top = Math.max(0, startTop + ev.clientY - startY);

            item.style.left = `${left}px`;
            item.style.top = `${top}px`;

            growWallToContent();
        };

        const up = ev => {
            item.releasePointerCapture(ev.pointerId);
            item.removeEventListener("pointermove", move);
            item.removeEventListener("pointerup", up);
        };

        item.addEventListener("pointermove", move);
        item.addEventListener("pointerup", up);
    });
}

function enableResizing(item, handle) {
    let startX, startY, startW, startH;

    handle.addEventListener("pointerdown", e => {
        if (!document.body.classList.contains("edit-mode")) return;

        e.stopPropagation();
        selectItem(item);

        startX = e.clientX;
        startY = e.clientY;
        startW = item.offsetWidth;
        startH = item.offsetHeight;

        handle.setPointerCapture(e.pointerId);

        const move = ev => {
            const newW = Math.max(35, startW + ev.clientX - startX);
            const newH = Math.max(35, startH + ev.clientY - startY);

            item.style.width = `${newW}px`;
            item.style.height = `${newH}px`;

            growWallToContent();
        };

        const up = ev => {
            handle.releasePointerCapture(ev.pointerId);
            handle.removeEventListener("pointermove", move);
            handle.removeEventListener("pointerup", up);
        };

        handle.addEventListener("pointermove", move);
        handle.addEventListener("pointerup", up);
    });
}

function growWallToContent() {
    const items = Array.from(document.querySelectorAll(".wall-item"));

    const bottom = items.length
        ? Math.max(...items.map(el => (parseFloat(el.style.top)||0) + el.offsetHeight))
        : 500;

    wall.style.height = `${bottom + 100}px`;
}

document.getElementById("editor-toggle").addEventListener("click", () => {
    document.body.classList.toggle("edit-mode");

    document.getElementById("editor-toggle").textContent =
        document.body.classList.contains("edit-mode")
            ? "[ done ]"
            : "[ arrange ]";

    if (!document.body.classList.contains("edit-mode")) {
        selectItem(null);
    }
});

document.getElementById("toggle-silhouette").addEventListener("click", () => {
    if (!selectedItem) return;
    selectedItem.classList.toggle("silhouette");
});

const EDIT_SHAPES = [
    "shape-block",
    "shape-chamfer-tr",
    "shape-chamfer-bl",
    "shape-slant-top",
    "shape-slant-bottom",
    "shape-oval",
    "shape-circle"
];

document.getElementById("cycle-shape").addEventListener("click", () => {
    if (!selectedItem) return;

    let current = EDIT_SHAPES.findIndex(c => selectedItem.classList.contains(c));
    if (current < 0) current = 0;

    EDIT_SHAPES.forEach(c => selectedItem.classList.remove(c));
    selectedItem.classList.add(EDIT_SHAPES[(current + 1) % EDIT_SHAPES.length]);
});

document.getElementById("bring-front").addEventListener("click", () => {
    if (!selectedItem) return;
    maxZ += 1;
    selectedItem.style.zIndex = maxZ;
});

function serializeLayout() {
    const items = Array.from(document.querySelectorAll(".wall-item")).map(item => ({
        src: item.dataset.src,
        left: item.style.left,
        top: item.style.top,
        width: item.style.width,
        height: item.style.height,
        zIndex: item.style.zIndex || "",
        silhouette: item.classList.contains("silhouette"),
        shape: EDIT_SHAPES.find(c => item.classList.contains(c)) || "shape-block"
    }));

    const visibleSources = new Set(items.map(item => item.src));

    const removed = Array.from(
        source.querySelectorAll(":scope > img, :scope > video")
    )
    .map(el => el.getAttribute("src"))
    .filter(src => !visibleSources.has(src));

    return {
        items,
        removed
    };
}


document.getElementById("delete-item").addEventListener("click", () => {
    if (!selectedItem) return;

    const src = selectedItem.dataset.src;

    /*
      Remove the selected collage item immediately.
      This does NOT delete the source image file from the repository.
      It only removes it from the current arrangement.
    */
    selectedItem.remove();
    selectedItem = null;

    /*
      Remove the matching source entry from the hidden source list too,
      so an exported HTML cleanup can know which media were intentionally
      excluded from the collage.
    */
    const original = Array.from(
        source.querySelectorAll(":scope > img, :scope > video")
    ).find(el => el.getAttribute("src") === src);

    if (original) {
        original.dataset.removedFromCollage = "true";
    }

    growWallToContent();
});

document.getElementById("save-layout").addEventListener("click", () => {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(serializeLayout()));
});

document.getElementById("reset-layout").addEventListener("click", () => {
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
});

document.getElementById("export-layout").addEventListener("click", async () => {
    const json = JSON.stringify(serializeLayout(), null, 2);

    try {
        await navigator.clipboard.writeText(json);
        alert("Layout copied to clipboard. The export now also includes a removed list, so the discarded photos can be deleted from the final HTML.");
    } catch {
        console.log(json);
        alert("Could not copy automatically. Layout JSON is in the console.");
    }
});

function restoreSavedLayout() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;

    let saved;

    try {
        saved = JSON.parse(raw);
    } catch {
        return;
    }

    /*
      Backward compatibility:
      older saved layouts were plain arrays.
    */
    const savedItems = Array.isArray(saved) ? saved : (saved.items || []);
    const removed = Array.isArray(saved) ? [] : (saved.removed || []);

    const removedSet = new Set(removed);

    document.querySelectorAll(".wall-item").forEach(item => {
        if (removedSet.has(item.dataset.src)) {
            item.remove();
        }
    });

    const bySrc = new Map(savedItems.map(x => [x.src, x]));

    document.querySelectorAll(".wall-item").forEach(item => {
        const s = bySrc.get(item.dataset.src);
        if (!s) return;

        item.style.left = s.left;
        item.style.top = s.top;
        item.style.width = s.width;
        item.style.height = s.height;
        item.style.zIndex = s.zIndex || "";

        EDIT_SHAPES.forEach(c => item.classList.remove(c));
        item.classList.add(s.shape || "shape-block");

        item.classList.toggle("silhouette", !!s.silhouette);
    });

    growWallToContent();
}

/* ----------------------------------------------------------
   LIGHTBOX
   ---------------------------------------------------------- */

function openLightbox(index) {
    lightboxIndex = index;
    renderLightbox();
    document.getElementById("lightbox").classList.add("open");
    document.body.style.overflow = "hidden";
}

function renderLightbox() {
    if (!lightboxItems.length) return;

    const item = lightboxItems[lightboxIndex];
    const img = document.getElementById("lightbox-img");
    const video = document.getElementById("lightbox-video");

    video.pause();

    if (item.type === "video") {
        img.style.display = "none";
        video.src = item.src;
        video.style.display = "block";
        video.play().catch(() => {});
    } else {
        video.style.display = "none";
        img.src = item.src;
        img.style.display = "block";
    }

    document.getElementById("counter").textContent =
        `${lightboxIndex + 1} / ${lightboxItems.length}`;
}

function moveLightbox(direction) {
    lightboxIndex =
        (lightboxIndex + direction + lightboxItems.length)
        % lightboxItems.length;

    renderLightbox();
}

function closeLightbox() {
    const box = document.getElementById("lightbox");
    const video = document.getElementById("lightbox-video");

    box.classList.remove("open");
    video.pause();
    document.body.style.overflow = "";
}

document.addEventListener("keydown", e => {
    const box = document.getElementById("lightbox");

    if (box.classList.contains("open")) {
        if (e.key === "ArrowLeft") moveLightbox(-1);
        if (e.key === "ArrowRight") moveLightbox(1);
        if (e.key === "Escape") closeLightbox();
        return;
    }

    if (document.body.classList.contains("edit-mode") && selectedItem) {
        if (e.key.toLowerCase() === "s") {
            selectedItem.classList.toggle("silhouette");
        }
    }
});

window.addEventListener("DOMContentLoaded", buildWall);
</script>
