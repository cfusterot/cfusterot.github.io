<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Visual Archive</title>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Courier Prime', monospace !important; box-sizing: border-box; }

        :root {
            --map-bg: #e6e3df; 
            --building-bg: #d2cfc9; 
            --river-color: #dcd9d4; 
            --map-ink: #111;
            --highlight: #d93829; 
        }

        body {
            margin: 0;
            background-color: var(--map-bg);
            color: var(--map-ink);
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPjxm Filter id="n"><ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iMC45IiBudW1PY3RhdmVzPSI0IiBzdGl0Y2hUaWxlcz0ic3RpdGNoIi8+PC9maWx0ZXI+PHJlY3Qgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIgZmlsb=Im5vbmUiIGZpbHRlcj0idXJsKCNuKSIgb3BhY2l0eT0iMC4wOCIvPjwvc3ZnPg==');
            overflow: hidden; 
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        #loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--map-bg); z-index: 10000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.5s ease;
        }

        header { 
            position: fixed; top: 0; left: 0; width: 100%; padding: 2rem; 
            display: flex; justify-content: space-between; align-items: baseline; 
            z-index: 9000; pointer-events: none;
        }
        header * { pointer-events: auto; }
        .logo { text-decoration: none; color: var(--map-ink); font-weight: 700; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px;}
        
        #site-footer {
            position: fixed; bottom: 20px; right: 30px; font-size: 0.8rem; color: var(--map-ink); z-index: 9000; pointer-events: none;
        }

        /* VIEWPORT & CAMERA */
        #viewport {
            width: 100vw; height: 100vh;
            cursor: grab; overflow: hidden; position: relative;
            touch-action: none; 
        }
        #viewport:active { cursor: grabbing; }

        #map-world {
            position: absolute; width: 15000px; height: 10000px;
            transform-origin: 0 0; transition: transform 0.1s linear;
        }

        /* SVG LAYERS */
        #base-layer, #transport-layer, #surveyor-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; 
        }
        #base-layer { z-index: 5; } 
        #transport-layer { z-index: 50; } 
        #surveyor-layer { z-index: 200; } 

        #map-assets {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 20;
        }

        #survey-box {
            fill: rgba(217, 56, 41, 0.03);
            stroke: var(--map-ink);
            stroke-width: 2px;
            stroke-dasharray: 8 6; 
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            opacity: 0;
        }

        .map-river { fill: none; stroke: var(--river-color); stroke-width: 120px; stroke-linejoin: round; stroke-linecap: round; }
        .map-river-outline { fill: none; stroke: rgba(0,0,0,0.08); stroke-width: 124px; stroke-linejoin: round; stroke-linecap: round; }
        .map-park { fill: var(--building-bg); stroke: none; }

        /* MAP BLOCKS */
        .map-block { position: absolute; z-index: 10; transition: transform 0.3s ease, z-index 0s; }
        .map-block-inner { width: 100%; height: 100%; background-color: var(--building-bg); cursor: crosshair; position: relative; overflow: hidden; }
        
        .map-block img, .map-block video {
            width: 100%; height: 100%; object-fit: cover; display: block; background-color: #bbb;
            filter: grayscale(100%) contrast(110%) sepia(20%) brightness(95%);
            transition: filter 0.4s ease;
        }

        .filler-bg { background-color: var(--building-bg); width: 100%; height: 100%; }

        .map-block.highlighted { z-index: 100; transform: scale(1.03); }
        .map-block.highlighted img, .map-block.highlighted video { filter: grayscale(0%) contrast(105%) sepia(0%) brightness(100%); }

        /* Neighborhood Architectural Shapes */
        .shape-block { clip-path: inset(0px); } 
        .shape-circle-exact { clip-path: circle(50% at 50% 50%); border-radius: 50%; } 
        .shape-chamfer-tr { clip-path: polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% 100%, 0 100%); } 
        .shape-chamfer-bl { clip-path: polygon(0 0, 100% 0, 100% 100%, 15px 100%, 0 calc(100% - 15px)); } 
        .shape-slant-top { clip-path: polygon(0 15px, 100% 0, 100% 100%, 0 100%); } 
        .shape-slant-bottom { clip-path: polygon(0 0, 100% 0, 100% calc(100% - 15px), 0 100%); } 
        .shape-l-left { clip-path: polygon(0 0, 45% 0, 45% 55%, 100% 55%, 100% 100%, 0 100%); }
        .shape-l-right { clip-path: polygon(0 0, 100% 0, 100% 100%, 55% 100%, 55% 45%, 0 45%); }
        .shape-t { clip-path: polygon(0 0, 100% 0, 100% 40%, 70% 40%, 70% 100%, 30% 100%, 30% 40%, 0 40%); }
        .shape-u { clip-path: polygon(0 0, 35% 0, 35% 65%, 65% 65%, 65% 0, 100% 0, 100% 100%, 0 100%); }
        .shape-step { clip-path: polygon(0 0, 50% 0, 50% 50%, 100% 50%, 100% 100%, 0 100%); }
        .shape-courtyard { clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%, 0% 25%, 75% 25%, 75% 75%, 25% 75%, 25% 25%, 0% 25%); }
        .shape-poly1 { clip-path: polygon(4% 0, 100% 4%, 96% 100%, 0 96%); }

        /* MOUSE TOOLTIP */
        #cursor-tooltip {
            position: fixed; pointer-events: none; z-index: 9500;
            background: var(--map-ink); color: var(--map-bg);
            padding: 4px 12px; font-size: 1.1rem; font-weight: bold;
            text-transform: uppercase; letter-spacing: 2px;
            opacity: 0; transition: opacity 0.2s ease;
            transform: translate(15px, 15px);
        }

        /* INFO PANEL */
        #info-panel {
            position: fixed; top: 0; right: 0;
            width: 350px; height: 100vh; max-width: 100vw;
            background: rgba(230, 227, 223, 0.95);
            border-left: 1px solid var(--map-ink);
            backdrop-filter: blur(5px);
            padding: 8rem 2rem 2rem 2rem;
            z-index: 8000;
            transform: translateX(100%);
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            display: flex; flex-direction: column; gap: 20px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        #info-panel.active { transform: translateX(0); }
        
        .info-title { font-size: 1.5rem; font-weight: bold; text-transform: uppercase; border-bottom: 2px solid var(--highlight); padding-bottom: 10px; }
        .info-desc { font-size: 0.95rem; line-height: 1.6; }

        /* PROJECT IMAGE GALLERY */
        #info-gallery { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; padding-bottom: 2rem; }
        #info-gallery img {
            width: 100%; height: auto; object-fit: contain; background: #bbb;
            filter: grayscale(100%) contrast(110%); transition: filter 0.3s ease; cursor: pointer;
            border: 0.5px solid rgba(0,0,0,0.08);
        }
        #info-gallery img:hover { filter: grayscale(0%) contrast(100%); }

        /* CONTROLS */
        #ui-controls {
            position: fixed; bottom: 40px; left: 40px;
            display: flex; flex-direction: column; gap: 8px; z-index: 9000;
        }
        #ui-controls button {
            width: 44px; height: 44px; background: var(--map-bg);
            border: 1px solid var(--map-ink); cursor: pointer;
            font-size: 1.6rem; color: var(--map-ink); transition: all 0.2s;
        }
        #ui-controls button:hover { background: var(--map-ink); color: var(--map-bg); }

        .portal-btn {
            display: inline-block; margin-top: 15px; padding: 0; border: none; 
            color: var(--map-ink); font-size: 0.95rem; cursor: pointer; 
            background: transparent; text-decoration: underline; transition: color 0.2s ease;
        }
        .portal-btn:hover { color: var(--highlight); }

        /* LIGHTBOX */
        #lightbox {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(230, 227, 223, 0.95); z-index: 9999;
            justify-content: center; align-items: center; padding: 20px;
            cursor: pointer; backdrop-filter: blur(5px);
        }
        #lightbox img {
            max-width: 90%; max-height: 90vh; object-fit: contain;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3); 
            border: 1px solid rgba(0,0,0,0.08);
            background: #fff; z-index: 10000;
        }
        
        #lb-close {
            position: absolute; top: 30px; right: 40px; 
            font-family: 'Courier Prime', monospace; font-size: 1.5rem; font-weight: 400; 
            color: var(--map-ink); cursor: pointer; z-index: 10001; 
            background: none; border: none; padding: 10px;
        }
        #lb-close:hover { color: var(--highlight); }

        /* FLÂNERIES DRAWER */
        #flanerie-drawer {
            position: fixed; top: 100%; left: 0; width: 100%; height: 100%;
            background: #f4f4f2; z-index: 9600;
            transition: top 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            overflow-y: auto; padding: 4rem 2rem; box-sizing: border-box;
            -webkit-overflow-scrolling: touch;
        }
        #flanerie-drawer.open { top: 0; }
        .close-drawer {
            position: absolute; top: 30px; right: 40px; font-family: 'Courier Prime', monospace; font-size: 1rem; cursor: pointer; 
            background: none; border: none; color: var(--map-ink); z-index: 9700;
        }
        .close-drawer:hover { color: var(--highlight); }

        .archive-table { width: 100%; max-width: 1100px; margin: 0 auto; pointer-events: auto; }
        .archive-title { font-size: 2rem; font-weight: bold; text-transform: uppercase; border-bottom: 2px solid var(--map-ink); padding-bottom: 1rem; margin-bottom: 2rem; color: var(--map-ink); }
        .archive-header { display: flex; font-weight: bold; border-bottom: 1px solid var(--map-ink); padding-bottom: 10px; margin-bottom: 0; font-size: 0.9rem; text-transform: uppercase; color: var(--map-ink);}
        
        .col-time { width: 10%; font-weight: bold; font-size: 0.95rem; }
        .col-media { width: 45%; display: flex; gap: 15px; flex-wrap: wrap; padding-right: 40px; align-items: flex-start; }
        .col-notes { width: 45%; font-size: 0.95rem; line-height: 1.5; color: #222; }
        .archive-row { display: flex; border-bottom: 1px solid var(--map-ink); padding: 20px 0; align-items: flex-start; }
        
        .archive-row .col-media img, .archive-row .col-media video { 
            width: auto; max-width: 100%; height: auto; max-height: 400px; 
            object-fit: contain; border: 1px solid rgba(0,0,0,0.1); filter: grayscale(100%); transition: filter 0.3s ease;
        }
        .archive-row .col-media img:hover, .archive-row .col-media video:hover { filter: grayscale(0%); }

        @media (max-width: 768px) {
            #info-panel { width: 90vw; padding: 6rem 1.5rem 2rem 1.5rem; }
            #ui-controls { bottom: 20px; left: 20px; }
            #ui-controls button { width: 50px; height: 50px; } 
            #site-footer { bottom: 20px; right: 20px; font-size: 0.7rem; }
            .archive-header { display: none; } 
            .archive-row { flex-direction: column; padding: 20px 0; }
            .col-time, .col-media, .col-notes { width: 100%; margin-bottom: 15px; }
            .col-media { padding-right: 0; }
            #lb-close { top: 20px; right: 20px; }
        }
    </style>
</head>

        const tooltip = document.getElementById('cursor-tooltip');
        const infoPanel = document.getElementById('info-panel');
        const infoTitle = document.getElementById('info-title');
        const infoDesc = document.getElementById('info-desc');
        const flanerieBtnContainer = document.getElementById('flanerie-btn-container');
        const surveyBox = document.getElementById('survey-box');
        
        const GRID_UNIT = 160; 
        const STREET_GAP = 6; 
        const CENTER_GX = 35; 
        const CENTER_GY = 25;
        
        const LIMIT_MIN_X = 5;
        const LIMIT_MAX_X = 65;
        const LIMIT_MIN_Y = 5;
        const LIMIT_MAX_Y = 45;

        let occupiedGrid = {}; 
        let generatedBuildings = [];

        const ZONES = [
            { id: 'berlin', minX: 5, maxX: 30, minY: 5, maxY: 24, sizes: [{w:3,h:3},{w:2,h:2},{w:1,h:2}], shapes: ['shape-block', 'shape-courtyard'], density: 0.9, streetSpacing: 6 },
            { id: 'escitalopram', minX: 25, maxX: 45, minY: 5, maxY: 24, sizes: [{w:2,h:2},{w:2,h:1},{w:1,h:2}], shapes: ['shape-block', 'shape-u'], density: 0.9, streetSpacing: 5 },
            { id: 'spain', minX: 45, maxX: 65, minY: 5, maxY: 24, sizes: [{w:2,h:2},{w:1,h:1}], shapes: ['shape-block'], density: 0.95, streetSpacing: 4 },
            { id: 'casitos', minX: 5, maxX: 30, minY: 26, maxY: 45, sizes: [{w:2,h:2},{w:1,h:1}], shapes: ['shape-block', 'shape-circle-exact'], density: 0.9, streetSpacing: 5 },
            { id: 'selfie', minX: 25, maxX: 45, minY: 26, maxY: 45, sizes: [{w:2,h:2},{w:1,h:2}], shapes: ['shape-block', 'shape-poly1'], density: 0.9, streetSpacing: 5 },
            { id: 'uncertainty', minX: 45, maxX: 65, minY: 26, maxY: 45, sizes: [{w:3,h:3},{w:2,h:2}], shapes: ['shape-block', 'shape-chamfer-tr'], density: 0.9, streetSpacing: 5 }
        ];

        const PLACES = [
            { gx: 15, gy: 14, w: 4, h: 4, shape: 'shape-courtyard', zone: 'berlin' },
            { gx: 55, gy: 14, w: 4, h: 4, shape: 'shape-block', zone: 'spain' },
            { gx: 15, gy: 35, w: 5, h: 5, shape: 'shape-circle-exact', zone: 'casitos' },
            { gx: 55, gy: 35, w: 4, h: 4, shape: 'shape-poly1', zone: 'uncertainty' },
            { gx: 35, gy: 35, w: 4, h: 4, shape: 'shape-circle-exact', zone: 'selfie' },
            { gx: 35, gy: 14, w: 4, h: 4, shape: 'shape-circle-exact', zone: 'escitalopram' }
        ];

        for(let i=0; i<15; i++) {
            let px = LIMIT_MIN_X + Math.floor(Math.random() * (LIMIT_MAX_X - LIMIT_MIN_X - 2));
            let py = LIMIT_MIN_Y + Math.floor(Math.random() * (LIMIT_MAX_Y - LIMIT_MIN_Y - 2));
            PLACES.push({ gx: px, gy: py, w: 2, h: 2, shape: Math.random()>0.5?'shape-circle-exact':'shape-block', zone: 'filler', type: 'park' });
        }

        let currentLightboxImages = [];
        let currentLightboxIndex = 0;
        let scale = 1; let pos = { x: 0, y: 0 }; 

        function getRiverY(dx) { return Math.sin(dx * 0.2) * 2 + (dx * -0.05); }

        function isRiverCorridor(gx, gy, w, h) {
            for (let x = 0; x < w; x++) {
                for (let y = 0; y < h; y++) {
                    let cx = gx + x; let cy = gy + y;
                    let ry = CENTER_GY + getRiverY(cx - CENTER_GX);
                    if (Math.abs(cy - ry) <= 1.5) return true; 
                }
            }
            return false;
        }

        function isStrictlyWithinBounds(gx, gy, w, h) {
            return (gx >= LIMIT_MIN_X && gx + w - 1 <= LIMIT_MAX_X && gy >= LIMIT_MIN_Y && gy + h - 1 <= LIMIT_MAX_Y);
        }

        function isOccupied(gx, gy, w, h) {
            for(let x = 0; x < w; x++) for(let y = 0; y < h; y++) if(occupiedGrid[`${gx+x},${gy+y}`]) return true;
            return false;
        }

        function markOccupied(gx, gy, w, h) {
            for(let x = 0; x < w; x++) for(let y = 0; y < h; y++) occupiedGrid[`${gx+x},${gy+y}`] = true;
        }

        function initCartography() {
            document.getElementById('loading-overlay').style.opacity = '0';
            setTimeout(() => document.getElementById('loading-overlay').remove(), 500);

            const fragment = document.createDocumentFragment();

            drawSVG_BaseLayers();
            drawDiagrammaticDetails(); 

            let queues = {};
            for(let k in ARCHIVE) queues[k] = [...ARCHIVE[k]];

            PLACES.forEach(p => {
                if(isStrictlyWithinBounds(p.gx, p.gy, p.w, p.h) && !isRiverCorridor(p.gx, p.gy, p.w, p.h)) {
                    markOccupied(p.gx, p.gy, p.w, p.h);
                    generatedBuildings.push({ x: p.gx, y: p.gy, w: p.w, h: p.h, shape: p.shape, src: null, project: null, zone: p.zone });
                }
            });

            for (let x = LIMIT_MIN_X; x <= LIMIT_MAX_X; x++) {
                let rY = Math.floor(CENTER_GY + getRiverY(x - CENTER_GX));
                if (Math.random() < 0.9) { 
                    let sizes = [{w:3,h:3}, {w:2,h:3}, {w:3,h:2}, {w:2,h:2}]; 
                    let s = sizes[Math.floor(Math.random() * sizes.length)];
                    for (let yOff of [-2, -1, 1, 2].sort(()=>Math.random()-0.5)) {
                        let checkY = rY + yOff;
                        if (isStrictlyWithinBounds(x, checkY, s.w, s.h) && !isOccupied(x, checkY, s.w, s.h) && !isRiverCorridor(x, checkY, s.w, s.h)) {
                            markOccupied(x, checkY, s.w, s.h);
                            generatedBuildings.push({ x, y: checkY, w: s.w, h: s.h, shape: 'shape-block', src: null, project: null, zone: 'natur' });
                            x += Math.floor(s.w / 2); 
                            break;
                        }
                    }
                }
            }

            for (let y = LIMIT_MIN_Y; y <= LIMIT_MAX_Y; y++) {
                for (let x = LIMIT_MIN_X; x <= LIMIT_MAX_X; x++) {
                    let matchingZones = ZONES.filter(z => x >= z.minX && x <= z.maxX && y >= z.minY && y <= z.maxY);
                    if (matchingZones.length > 0) {
                        let zone = matchingZones[Math.floor(Math.random() * matchingZones.length)];
                        
                        if (x % zone.streetSpacing === 0 || y % zone.streetSpacing === 0) continue; 
                        if (isOccupied(x, y, 1, 1)) continue;

                        for (let s of zone.sizes) {
                            let valid = true;
                            if (!isStrictlyWithinBounds(x, y, s.w, s.h)) valid = false;
                            if (valid) {
                                for(let ix=0; ix < s.w; ix++) {
                                    for(let iy=0; iy < s.h; iy++) {
                                        let checkX = x + ix; let checkY = y + iy;
                                        if (checkX % zone.streetSpacing === 0 || checkY % zone.streetSpacing === 0 || isOccupied(checkX, checkY, 1, 1) || isRiverCorridor(checkX, checkY, 1, 1)) {
                                            valid = false; break;
                                        }
                                    }
                                    if(!valid) break;
                                }
                            }
                            if (valid) {
                                if (Math.random() < zone.density) {
                                    markOccupied(x, y, s.w, s.h);
                                    let shape = zone.shapes[Math.floor(Math.random() * zone.shapes.length)];
                                    generatedBuildings.push({ x, y, w: s.w, h: s.h, shape, src: null, project: null, zone: zone.id });
                                }
                                break; 
                            }
                        }
                    }
                }
            }

            for (let y = LIMIT_MIN_Y; y <= LIMIT_MAX_Y; y++) {
                for (let x = LIMIT_MIN_X; x <= LIMIT_MAX_X; x++) {
                    if (isStrictlyWithinBounds(x, y, 1, 1) && !isOccupied(x, y, 1, 1) && !isRiverCorridor(x, y, 1, 1)) {
                        if (Math.random() < 0.9) {
                            markOccupied(x, y, 1, 1);
                            generatedBuildings.push({ x, y, w: 1, h: 1, shape: 'shape-block', src: null, project: null, zone: 'filler' });
                        }
                    }
                }
            }
            
            let naturQueue = queues['natur'];
            if (naturQueue && naturQueue.length > 0) {
                let emptyNatur = generatedBuildings.filter(b => !b.src && b.zone === 'natur');
                emptyNatur.sort((a, b) => {
                    let areaA = a.w * a.h; let areaB = b.w * b.h;
                    if (areaA !== areaB) return areaB - areaA;
                    return a.x - b.x;
                });
                naturQueue.forEach((src, idx) => {
                    if(emptyNatur[idx]) { emptyNatur[idx].src = src; emptyNatur[idx].project = 'natur'; }
                });
            }

            let anchors = {};
            PLACES.forEach(p => { if (p.zone !== 'filler') anchors[p.zone] = {x: p.gx, y: p.gy}; });

            for (const [project, queue] of Object.entries(queues)) {
                if (project === 'natur') continue;
                
                let cx = anchors[project] ? anchors[project].x : 0;
                let cy = anchors[project] ? anchors[project].y : 0;
                let emptyZone = generatedBuildings.filter(b => !b.src && b.zone === project);

                emptyZone.sort((a, b) => {
                    let areaA = a.w * a.h; let areaB = b.w * b.h;
                    let distA = Math.hypot((a.x + a.w/2) - cx, (a.y + a.h/2) - cy);
                    let distB = Math.hypot((b.x + b.w/2) - cx, (b.y + b.h/2) - cy);
                    
                    let scoreA = distA - (areaA * 0.1); 
                    let scoreB = distB - (areaB * 0.1);
                    return scoreA - scoreB;
                });

                queue.forEach((src, idx) => {
                    if (emptyZone[idx]) { emptyZone[idx].src = src; emptyZone[idx].project = project; }
                });
            }

            generatedBuildings.forEach(b => { spawnBlock(fragment, b); });
            drawTransportLines(anchors);
            assets.appendChild(fragment);
            drawCityBounds();
            resetCameraToFit(); 
        }

        function drawDiagrammaticDetails() {
            for (let x = LIMIT_MIN_X; x <= LIMIT_MAX_X; x++) {
                for (let y = LIMIT_MIN_Y; y <= LIMIT_MAX_Y; y++) {
                    if (x % 3 === 0 && y % 3 === 0) { 
                        let cx = x * (GRID_UNIT + STREET_GAP) - (STREET_GAP/2);
                        let cy = y * (GRID_UNIT + STREET_GAP) - (STREET_GAP/2);
                        const cross = document.createElementNS("http://www.w3.org/2000/svg", "path");
                        cross.setAttribute("d", `M ${cx-6},${cy} L ${cx+6},${cy} M ${cx},${cy-6} L ${cx},${cy+6}`);
                        cross.setAttribute("stroke", "var(--map-ink)");
                        cross.setAttribute("stroke-width", "1");
                        cross.setAttribute("opacity", "0.3");
                        baseLayer.appendChild(cross);
                    }
                }
            }

            ZONES.forEach(z => {
                let px = z.minX * (GRID_UNIT + STREET_GAP);
                let py = z.minY * (GRID_UNIT + STREET_GAP);
                let pw = (z.maxX - z.minX + 1) * (GRID_UNIT + STREET_GAP) - STREET_GAP;
                let ph = (z.maxY - z.minY + 1) * (GRID_UNIT + STREET_GAP) - STREET_GAP;
                const zColor = ZONE_COLORS[z.id] || "var(--map-ink)";

                const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                rect.setAttribute("x", px); rect.setAttribute("y", py);
                rect.setAttribute("width", pw); rect.setAttribute("height", ph);
                rect.setAttribute("fill", "none");
                rect.setAttribute("stroke", zColor);
                rect.setAttribute("stroke-width", "1");
                rect.setAttribute("stroke-dasharray", "4 6");
                rect.setAttribute("opacity", "0.4");
                surveyorLayer.appendChild(rect);

                const s = 30; 
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", `
                    M ${px},${py+s} L ${px},${py} L ${px+s},${py}
                    M ${px+pw-s},${py} L ${px+pw},${py} L ${px+pw},${py+s}
                    M ${px},${py+ph-s} L ${px},${py+ph} L ${px+s},${py+ph}
                    M ${px+pw-s},${py+ph} L ${px+pw},${py+ph} L ${px+pw},${py+ph-s}
                `);
                path.setAttribute("fill", "none");
                path.setAttribute("stroke", zColor);
                path.setAttribute("stroke-width", "2");
                path.setAttribute("opacity", "0.6");
                surveyorLayer.appendChild(path);

                const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                text.setAttribute("x", px + 15); text.setAttribute("y", py + 30);
                text.setAttribute("fill", zColor);
                text.setAttribute("font-family", "'Courier Prime', monospace");
                text.setAttribute("font-size", "14px");
                text.setAttribute("font-weight", "bold");
                text.setAttribute("opacity", "0.8");
                text.textContent = `SEC_NODE:[${z.id.toUpperCase()}]`;
                surveyorLayer.appendChild(text);
            });
        }

        function drawSVG_BaseLayers() {
            const gridToPx = (gx, gy) => ({ x: gx * GRID_UNIT + (gx * STREET_GAP) + (GRID_UNIT / 2), y: gy * GRID_UNIT + (gy * STREET_GAP) + (GRID_UNIT / 2) });
            
            let pxMin = LIMIT_MIN_X * (GRID_UNIT + STREET_GAP);
            let pyMin = LIMIT_MIN_Y * (GRID_UNIT + STREET_GAP);
            let pWidth = (LIMIT_MAX_X - LIMIT_MIN_X + 1) * (GRID_UNIT + STREET_GAP) - STREET_GAP;
            let pHeight = (LIMIT_MAX_Y - LIMIT_MIN_Y + 1) * (GRID_UNIT + STREET_GAP) - STREET_GAP;
            
            const defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
            defs.innerHTML = `<clipPath id="map-clip"><rect x="${pxMin}" y="${pyMin}" width="${pWidth}" height="${pHeight}" /></clipPath>`;
            baseLayer.appendChild(defs);
            baseLayer.style.clipPath = "url(#map-clip)";

            PLACES.forEach(p => {
                if (p.type === 'park') {
                    if (p.shape === 'shape-circle-exact') {
                        const circ = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                        circ.className.baseVal = "map-park";
                        let pt = gridToPx(p.gx, p.gy);
                        circ.setAttribute("cx", pt.x); circ.setAttribute("cy", pt.y); circ.setAttribute("r", p.w/2 * (GRID_UNIT + STREET_GAP));
                        baseLayer.appendChild(circ);
                    } else {
                        const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                        rect.className.baseVal = "map-park";
                        let x = p.gx * GRID_UNIT + (p.gx * STREET_GAP); let y = p.gy * GRID_UNIT + (p.gy * STREET_GAP);
                        let w = p.w * GRID_UNIT + (p.w - 1) * STREET_GAP; let h = p.h * GRID_UNIT + (p.h - 1) * STREET_GAP;
                        rect.setAttribute("x", x); rect.setAttribute("y", y); rect.setAttribute("width", w); rect.setAttribute("height", h);
                        baseLayer.appendChild(rect);
                    }
                }
            });

            const rPoints = [];
            for (let dx = -100; dx <= 100; dx += 2) {
                let gx = CENTER_GX + dx; let gy = CENTER_GY + getRiverY(dx);
                if (gx >= LIMIT_MIN_X - 5 && gx <= LIMIT_MAX_X + 5) {
                    rPoints.push(gridToPx(gx, gy));
                }
            }
            const pString = rPoints.map(p => `${p.x},${p.y}`).join(" ");

            const polylineOut = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
            polylineOut.className.baseVal = "map-river-outline"; polylineOut.setAttribute("points", pString);
            baseLayer.appendChild(polylineOut);

            const polyline = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
            polyline.className.baseVal = "map-river"; polyline.setAttribute("points", pString);
            baseLayer.appendChild(polyline);
        }

        function drawTransportLines(anchors) {
            const gridToPx = (gx, gy) => ({ x: gx * GRID_UNIT + (gx * STREET_GAP) + (GRID_UNIT / 2), y: gy * GRID_UNIT + (gy * STREET_GAP) + (GRID_UNIT / 2) });
            const center = gridToPx(CENTER_GX, CENTER_GY);
            
            let pxAnchors = {};
            for(let p in anchors) pxAnchors[p] = gridToPx(anchors[p].x, anchors[p].y);

            // Colored elegant Bezier curves instead of 90-degree lines
            for(let k in pxAnchors) {
                let p = pxAnchors[k];
                let color = ZONE_COLORS[k] || "var(--map-ink)";
                
                // Creates a smooth S-curve connecting the central hub to the specific project plaza
                let ctrlX = center.x + (p.x - center.x) * 0.5;
                let d = `M ${center.x},${center.y} C ${ctrlX},${center.y} ${ctrlX},${p.y} ${p.x},${p.y}`;
                
                const poly = document.createElementNS("http://www.w3.org/2000/svg", "path");
                poly.setAttribute("d", d);
                poly.setAttribute("fill", "none");
                poly.setAttribute("stroke", color);
                poly.setAttribute("stroke-width", "8"); // Much thicker line
                poly.setAttribute("stroke-dasharray", "24 16"); // Larger dashed pattern
                poly.setAttribute("stroke-linecap", "round");
                poly.setAttribute("opacity", "0.9");
                transportLayer.appendChild(poly);
                
                // Diagrammatic station points
                const circ = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                circ.setAttribute("cx", p.x); circ.setAttribute("cy", p.y); circ.setAttribute("r", 16); // Larger station circle
                circ.setAttribute("fill", "var(--map-bg)");
                circ.setAttribute("stroke", color);
                circ.setAttribute("stroke-width", "4");
                
                const innerCirc = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                innerCirc.setAttribute("cx", p.x); innerCirc.setAttribute("cy", p.y); innerCirc.setAttribute("r", 6); // Larger inner dot
                innerCirc.setAttribute("fill", color);
                
                transportLayer.appendChild(circ);
                transportLayer.appendChild(innerCirc);
            }

            // Central diagrammatic hub
            const centerNode = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            centerNode.setAttribute("x", center.x - 16); centerNode.setAttribute("y", center.y - 16);
            centerNode.setAttribute("width", 32); centerNode.setAttribute("height", 32);
            centerNode.setAttribute("fill", "var(--map-bg)");
            centerNode.setAttribute("stroke", "var(--map-ink)"); centerNode.setAttribute("stroke-width", "4");
            transportLayer.appendChild(centerNode);

            const centerDot = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            centerDot.setAttribute("x", center.x - 6); centerDot.setAttribute("y", center.y - 6);
            centerDot.setAttribute("width", 12); centerDot.setAttribute("height", 12);
            centerDot.setAttribute("fill", "var(--map-ink)");
            transportLayer.appendChild(centerDot);
        }

        function drawCityBounds() {
            const boundsGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
            boundsGroup.id = "city-bounds-group";
            
            let px = LIMIT_MIN_X * (GRID_UNIT + STREET_GAP); 
            let py = LIMIT_MIN_Y * (GRID_UNIT + STREET_GAP);
            let pw = (LIMIT_MAX_X - LIMIT_MIN_X + 1) * (GRID_UNIT + STREET_GAP) - STREET_GAP;
            let ph = (LIMIT_MAX_Y - LIMIT_MIN_Y + 1) * (GRID_UNIT + STREET_GAP) - STREET_GAP;

            const outerRect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            outerRect.setAttribute("x", px); outerRect.setAttribute("y", py);
            outerRect.setAttribute("width", pw); outerRect.setAttribute("height", ph);
            outerRect.setAttribute("fill", "none"); outerRect.setAttribute("stroke", "var(--map-ink)"); 
            outerRect.setAttribute("stroke-width", "16"); 

            const padding = 20; 
            const innerRect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            innerRect.setAttribute("x", px + padding); innerRect.setAttribute("y", py + padding);
            innerRect.setAttribute("width", pw - (padding * 2)); innerRect.setAttribute("height", ph - (padding * 2));
            innerRect.setAttribute("fill", "none"); innerRect.setAttribute("stroke", "var(--map-ink)");
            innerRect.setAttribute("stroke-width", "3");
            innerRect.setAttribute("stroke-dasharray", "10 8");

            const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
            text.setAttribute("x", px + padding + 15); text.setAttribute("y", py + padding + 35); 
            text.setAttribute("fill", "var(--map-ink)"); text.setAttribute("font-size", "34px");
            text.setAttribute("font-family", "Georgia, 'Times New Roman', serif");
            text.setAttribute("font-style", "italic"); text.setAttribute("font-weight", "bold"); 
            text.textContent = "I.";

            boundsGroup.appendChild(outerRect); boundsGroup.appendChild(innerRect); boundsGroup.appendChild(text);
            surveyorLayer.appendChild(boundsGroup);
        }

        function spawnBlock(container, buildingData) {
            let px = buildingData.x * GRID_UNIT + (buildingData.x * STREET_GAP); 
            let py = buildingData.y * GRID_UNIT + (buildingData.y * STREET_GAP);
            let pw = buildingData.w * GRID_UNIT + ((buildingData.w-1) * STREET_GAP); 
            let ph = buildingData.h * GRID_UNIT + ((buildingData.h-1) * STREET_GAP);

            const wrapper = document.createElement('div');
            wrapper.className = `map-block`; 
            wrapper.style.left = `${px}px`; wrapper.style.top = `${py}px`; 
            wrapper.style.width = `${pw}px`; wrapper.style.height = `${ph}px`;

            const inner = document.createElement('div');
            inner.className = `map-block-inner ${buildingData.shape}`;

            if (buildingData.src) {
                wrapper.dataset.project = buildingData.project;
                const img = document.createElement('img'); 
                img.src = buildingData.src; 
                img.setAttribute('loading', 'lazy'); 
                img.setAttribute('decoding', 'async'); 
                inner.appendChild(img);
                wrapper.onmouseenter = () => activateProject(buildingData.project);
            } else {
                const filler = document.createElement('div'); 
                filler.className = 'filler-bg'; 
                inner.appendChild(filler);
            }
            
            wrapper.appendChild(inner); container.appendChild(wrapper);
        }

        let currentHover = null;

        function activateProject(project) {
            if (currentHover === project || project === 'filler') return;
            currentHover = project;

            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            const items = document.querySelectorAll(`.map-block[data-project="${project}"]`);
            document.querySelectorAll('.map-block[data-project]').forEach(el => el.classList.remove('highlighted'));
            
            items.forEach(el => {
                el.classList.add('highlighted');
                const x = parseInt(el.style.left); const y = parseInt(el.style.top);
                minX = Math.min(minX, x); minY = Math.min(minY, y);
                maxX = Math.max(maxX, x + parseInt(el.style.width)); maxY = Math.max(maxY, y + parseInt(el.style.height));
            });

            if (items.length > 0) {
                const pad = 20;
                surveyBox.setAttribute('x', minX - pad); surveyBox.setAttribute('y', minY - pad);
                surveyBox.setAttribute('width', (maxX - minX) + (pad*2)); surveyBox.setAttribute('height', (maxY - minY) + (pad*2));
                surveyBox.style.opacity = 1;
                
                if(ZONE_COLORS[project]) {
                    surveyBox.style.stroke = ZONE_COLORS[project];
                    surveyBox.style.fill = ZONE_COLORS[project] + "10"; 
                } else {
                    surveyBox.style.stroke = "var(--map-ink)";
                    surveyBox.style.fill = "rgba(217, 56, 41, 0.03)";
                }
            }

            tooltip.innerText = project; tooltip.style.opacity = 1;
            infoTitle.innerText = project; infoDesc.innerText = DESCRIPTIONS[project] || "";
            infoTitle.style.borderBottomColor = ZONE_COLORS[project] || "var(--highlight)";
            
            flanerieBtnContainer.innerHTML = '';
            if (FIELD_NOTES[project] && FIELD_NOTES[project].length > 0) {
                const btn = document.createElement('button'); btn.className = 'portal-btn'; btn.innerText = 'View Flâneries';
                btn.onclick = () => openFlanerie(project); flanerieBtnContainer.appendChild(btn);
            }

            const infoGallery = document.getElementById('info-gallery'); infoGallery.innerHTML = '';
            
            currentLightboxImages = ARCHIVE[project] ? [...ARCHIVE[project]] : [];

            if (ARCHIVE[project]) {
                ARCHIVE[project].forEach((src, index) => {
                    const img = document.createElement('img'); img.src = src; img.setAttribute('loading', 'lazy');
                    img.onclick = () => openLightbox(index); infoGallery.appendChild(img);
                });
            }
            infoPanel.classList.add('active');
        }

        function openLightbox(index) { 
            if(currentLightboxImages.length === 0) return;
            currentLightboxIndex = index;
            document.getElementById('lightbox-img').src = currentLightboxImages[currentLightboxIndex];
            document.getElementById('lightbox').style.display = 'flex'; 
        }
        
        function closeLightbox(e) {
            if(e) e.stopPropagation();
            document.getElementById('lightbox').style.display = 'none';
        }

        function handleLightboxClick(e) {
            if (e.target.id === 'lb-close') return;
            if (e.clientX > window.innerWidth / 2) navigateLightbox(1);
            else navigateLightbox(-1);
        }

        function navigateLightbox(direction) {
            if(currentLightboxImages.length === 0) return;
            currentLightboxIndex = (currentLightboxIndex + direction + currentLightboxImages.length) % currentLightboxImages.length;
            document.getElementById('lightbox-img').src = currentLightboxImages[currentLightboxIndex];
        }

        window.addEventListener('keydown', e => { 
            if(document.getElementById('lightbox').style.display === 'flex') {
                if (e.key === 'Escape') closeLightbox(); 
                if (e.key === 'ArrowRight') navigateLightbox(1);
                if (e.key === 'ArrowLeft') navigateLightbox(-1);
            }
        });

        let touchStartX = 0;
        const lightboxEl = document.getElementById('lightbox');
        lightboxEl.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; });
        lightboxEl.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            if (touchEndX < touchStartX - 50) navigateLightbox(1);
            if (touchEndX > touchStartX + 50) navigateLightbox(-1);
        });

        window.addEventListener('mousemove', e => { if (currentHover) { tooltip.style.left = `${e.clientX + 15}px`; tooltip.style.top = `${e.clientY + 15}px`; } });
        window.addEventListener('mousedown', e => {
            if (e.target.id === 'viewport' || e.target.id === 'map-world' || e.target.id === 'base-layer' || e.target.id === 'surveyor-layer' || e.target.id === 'transport-layer') {
                currentHover = null; document.querySelectorAll('.map-block').forEach(el => el.classList.remove('highlighted'));
                surveyBox.style.opacity = 0; tooltip.style.opacity = 0; infoPanel.classList.remove('active');
            }
        });

        window.addEventListener('touchstart', e => {
            if (e.target.id === 'viewport' || e.target.id === 'map-world' || e.target.id === 'base-layer' || e.target.id === 'surveyor-layer' || e.target.id === 'transport-layer') {
                currentHover = null;
                document.querySelectorAll('.map-block').forEach(el => el.classList.remove('highlighted'));
                surveyBox.style.opacity = 0; tooltip.style.opacity = 0;
                infoPanel.classList.remove('active');
            }
        });

        function openFlanerie(cityKey) {
            const drawer = document.getElementById('flanerie-drawer'); const content = document.getElementById('flanerie-content');
            content.innerHTML = ''; 
            (FIELD_NOTES[cityKey] || []).forEach((note) => {
                const row = document.createElement('div'); row.className = 'archive-row';
                note.media.sort((a, b) => (a.type === 'video' ? -1 : 1));
                let mediaHTML = note.media.map(m => {
                    if (m.type === 'video') return `<video src="${m.src}" muted autoplay loop playsinline></video>`;
                    else return `<img src="${m.src}" loading="lazy">`;
                }).join('');
                row.innerHTML = `<div class="col-time">${note.time}</div><div class="col-media">${mediaHTML}</div><div class="col-notes">${note.text}</div>`;
                content.appendChild(row);
            });
            drawer.classList.add('open');
        }
        function closeFlanerie() { document.getElementById('flanerie-drawer').classList.remove('open'); }

        function zoomViaButton(factor) { applyZoom(factor, window.innerWidth / 2, window.innerHeight / 2); }

        window.addEventListener('wheel', (e) => {
            if (document.getElementById('lightbox').style.display === 'flex') return;
            if (document.getElementById('flanerie-drawer').classList.contains('open')) return;
            if (document.getElementById('info-panel').classList.contains('active')) {
                const bounds = document.getElementById('info-panel').getBoundingClientRect();
                if (e.clientX > bounds.left && e.clientX < bounds.right) return;
            }
            e.preventDefault(); applyZoom(e.deltaY > 0 ? 0.9 : 1.1, e.clientX, e.clientY);
        }, {passive: false});

        function applyZoom(factor, pointerX, pointerY) {
            const mapX = (pointerX - pos.x) / scale; const mapY = (pointerY - pos.y) / scale;
            scale = Math.max(0.01, Math.min(5.0, scale * factor));
            pos.x = pointerX - (mapX * scale); pos.y = pointerY - (mapY * scale); updateCamera();
        }

        function resetCameraToFit() {
            let pw = (LIMIT_MAX_X - LIMIT_MIN_X + 1) * (GRID_UNIT + STREET_GAP);
            let ph = (LIMIT_MAX_Y - LIMIT_MIN_Y + 1) * (GRID_UNIT + STREET_GAP);
            
            let px = LIMIT_MIN_X * (GRID_UNIT + STREET_GAP); 
            let py = LIMIT_MIN_Y * (GRID_UNIT + STREET_GAP);
            let cx = px + (pw / 2); 
            let cy = py + (ph / 2);
            
            scale = Math.min((window.innerWidth * 0.9) / pw, (window.innerHeight * 0.9) / ph); 
            
            pos.x = (window.innerWidth / 2) - (cx * scale); 
            pos.y = (window.innerHeight / 2) - (cy * scale);
            updateCamera();
        }

        function updateCamera() { world.style.transform = `translate(${pos.x}px, ${pos.y}px) scale(${scale})`; }

        let isDragging = false; let lastPos = { x: 0, y: 0 }; let ticking = false;
        let initialDistance = null; let initialScale = 1;

        const startPan = (clientX, clientY, e) => {
            if(e && e.target && e.target.tagName === 'BUTTON') return;
            isDragging = true; lastPos = { x: clientX, y: clientY }; world.style.cursor = 'grabbing';
        };

        const movePan = (clientX, clientY) => {
            if (!isDragging) return;
            pos.x += (clientX - lastPos.x); pos.y += (clientY - lastPos.y); lastPos = { x: clientX, y: clientY }; 
            if (!ticking) { window.requestAnimationFrame(() => { updateCamera(); ticking = false; }); ticking = true; }
        };

        const endPan = () => { isDragging = false; world.style.cursor = 'grab'; };

        document.getElementById('viewport').addEventListener('mousedown', e => {
            if(document.getElementById('lightbox').style.display === 'flex') return;
            startPan(e.clientX, e.clientY, e);
        });
        window.addEventListener('mouseup', endPan);
        window.addEventListener('mousemove', e => movePan(e.clientX, e.clientY));

        document.getElementById('viewport').addEventListener('touchstart', e => {
            if(document.getElementById('lightbox').style.display === 'flex') return;
            if (e.touches.length === 2) {
                isDragging = false; 
                initialDistance = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                initialScale = scale;
            } else if (e.touches.length === 1) {
                startPan(e.touches[0].clientX, e.touches[0].clientY, e);
            }
        }, {passive: false});

        window.addEventListener('touchend', e => {
            if (e.touches.length < 2) initialDistance = null;
            if (e.touches.length === 0) endPan();
        });

        window.addEventListener('touchmove', e => {
            if(document.getElementById('lightbox').style.display === 'flex') return;
            if (e.touches.length === 2 && initialDistance) {
                e.preventDefault();
                let currentDistance = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                let factor = currentDistance / initialDistance;
                let pointerX = (e.touches[0].clientX + e.touches[1].clientX) / 2; let pointerY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                
                const mapX = (pointerX - pos.x) / scale; const mapY = (pointerY - pos.y) / scale;
                scale = Math.max(0.01, Math.min(5.0, initialScale * factor));
                pos.x = pointerX - (mapX * scale); pos.y = pointerY - (mapY * scale);
                
                if (!ticking) { window.requestAnimationFrame(() => { updateCamera(); ticking = false; }); ticking = true; }
            } else if (e.touches.length === 1 && isDragging && !document.getElementById('flanerie-drawer').classList.contains('open')) {
                const infoPanel = document.getElementById('info-panel');
                if (infoPanel.classList.contains('active')) {
                    const bounds = infoPanel.getBoundingClientRect();
                    if (e.touches[0].clientX > bounds.left && e.touches[0].clientX < bounds.right) return;
                }
                e.preventDefault(); movePan(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, {passive: false});

        window.addEventListener('resize', () => { if(!isDragging) resetCameraToFit(); });
        window.onload = initCartography;
    </script>
</body>
</html>
