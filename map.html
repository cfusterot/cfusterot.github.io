<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Visual Archive</title>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Courier Prime', monospace !important; box-sizing: border-box; }

        :root {
            --map-bg: #e6e3df; 
            --building-bg: #d2cfc9; 
            --river-color: #dcd9d4; 
            --map-ink: #111;
            --highlight: #d93829; 
            --street-width: 6px; 
        }

        body {
            margin: 0;
            background-color: var(--map-bg);
            color: var(--map-ink);
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPjxm Filter id="n"><ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iMC45IiBudW1PY3RhdmVzPSI0IiBzdGl0Y2hUaWxlcz0ic3RpdGNoIi8+PC9maWx0ZXI+PHJlY3Qgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIgZmlsb=Im5vbmUiIGZpbHRlcj0idXJsKCNuKSIgb3BhY2l0eT0iMC4wOCIvPjwvc3ZnPg==');
            overflow: hidden; 
            user-select: none;
            -webkit-user-select: none;
        }

        header { 
            position: fixed; top: 0; left: 0; width: 100%; padding: 2rem; 
            display: flex; justify-content: space-between; align-items: baseline; 
            z-index: 9000; pointer-events: none;
        }
        header * { pointer-events: auto; }
        .logo { text-decoration: none; color: var(--map-ink); font-weight: 700; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px;}
        
        #site-footer {
            position: fixed; bottom: 20px; right: 30px; font-size: 0.8rem; color: var(--map-ink); z-index: 9000; pointer-events: none;
        }

        /* VIEWPORT & CAMERA */
        #viewport {
            width: 100vw; height: 100vh;
            cursor: grab; overflow: hidden; position: relative;
            touch-action: none; 
        }
        #viewport:active { cursor: grabbing; }

        #map-world {
            position: absolute; width: 6000px; height: 6000px;
            transform-origin: 0 0; transition: transform 0.1s linear;
        }

        /* SVG LAYERS */
        #base-layer, #transport-layer, #surveyor-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; 
        }
        #base-layer { z-index: 5; } 
        #transport-layer { z-index: 50; } 
        #surveyor-layer { z-index: 200; } 

        #survey-box {
            fill: rgba(217, 56, 41, 0.03);
            stroke: var(--map-ink);
            stroke-width: 2px;
            stroke-dasharray: 8 6; 
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            opacity: 0;
        }

        .map-river {
            fill: none;
            stroke: var(--river-color);
            stroke-width: 60px; 
            stroke-linejoin: round;
            stroke-linecap: round;
        }
        .map-river-outline {
            fill: none;
            stroke: rgba(0,0,0,0.08); 
            stroke-width: 62px;
            stroke-linejoin: round;
            stroke-linecap: round;
        }

        .map-park {
            fill: var(--building-bg);
            stroke: none;
        }

        .transport-line {
            fill: none;
            stroke: var(--building-bg);
            stroke-width: 4px;
            stroke-linejoin: round;
            stroke-linecap: round;
            opacity: 0.9;
        }
        .transport-station {
            fill: var(--map-bg);
            stroke: var(--building-bg);
            stroke-width: 3px;
        }

        /* MAP BLOCKS */
        .map-block {
            position: absolute;
            z-index: 10;
            transition: transform 0.3s ease, z-index 0s;
        }

        .map-block-inner {
            width: 100%; height: 100%;
            background-color: var(--building-bg);
            cursor: crosshair;
        }

        .map-block img, .map-block video {
            width: 100%; height: 100%;
            object-fit: cover; display: block; background-color: #bbb;
            filter: grayscale(100%) contrast(110%) sepia(20%) brightness(95%);
            transition: filter 0.4s ease;
        }

        .filler-bg {
            background-color: var(--building-bg);
            width: 100%; height: 100%;
        }

        .map-block.highlighted { z-index: 100; transform: scale(1.03); }
        .map-block.highlighted img, .map-block.highlighted video {
            filter: grayscale(0%) contrast(105%) sepia(0%) brightness(100%);
        }

        /* High Variety Architectural Shapes */
        .shape-block { clip-path: inset(0px); } 
        .shape-circle { clip-path: circle(50% at 50% 50%); } 
        .shape-chamfer-tr { clip-path: polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% 100%, 0 100%); } 
        .shape-chamfer-bl { clip-path: polygon(0 0, 100% 0, 100% 100%, 15px 100%, 0 calc(100% - 15px)); } 
        .shape-slant-top { clip-path: polygon(0 15px, 100% 0, 100% 100%, 0 100%); } 
        .shape-slant-bottom { clip-path: polygon(0 0, 100% 0, 100% calc(100% - 15px), 0 100%); } 
        .shape-l-left { clip-path: polygon(0 0, 45% 0, 45% 55%, 100% 55%, 100% 100%, 0 100%); }
        .shape-l-right { clip-path: polygon(0 0, 100% 0, 100% 100%, 55% 100%, 55% 45%, 0 45%); }
        .shape-t { clip-path: polygon(0 0, 100% 0, 100% 40%, 70% 40%, 70% 100%, 30% 100%, 30% 40%, 0 40%); }
        .shape-u { clip-path: polygon(0 0, 35% 0, 35% 65%, 65% 65%, 65% 0, 100% 0, 100% 100%, 0 100%); }
        .shape-cross { clip-path: polygon(33% 0, 66% 0, 66% 33%, 100% 33%, 100% 66%, 66% 66%, 66% 100%, 33% 100%, 33% 66%, 0 66%, 0 33%, 33% 33%); }
        .shape-step { clip-path: polygon(0 0, 50% 0, 50% 50%, 100% 50%, 100% 100%, 0 100%); }
        .shape-courtyard { clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%, 0% 25%, 75% 25%, 75% 75%, 25% 75%, 25% 25%, 0% 25%); }
        .shape-poly1 { clip-path: polygon(4% 0, 100% 4%, 96% 100%, 0 96%); }

        /* MOUSE TOOLTIP */
        #cursor-tooltip {
            position: fixed; pointer-events: none; z-index: 9500;
            background: var(--map-ink); color: var(--map-bg);
            padding: 4px 12px; font-size: 1.1rem; font-weight: bold;
            text-transform: uppercase; letter-spacing: 2px;
            opacity: 0; transition: opacity 0.2s ease;
            transform: translate(15px, 15px);
        }

        /* INFO PANEL */
        #info-panel {
            position: fixed; top: 0; right: 0;
            width: 350px; height: 100vh; max-width: 100vw;
            background: rgba(230, 227, 223, 0.95);
            border-left: 2px solid var(--map-ink);
            backdrop-filter: blur(5px);
            padding: 8rem 2rem 2rem 2rem;
            z-index: 8000;
            transform: translateX(100%);
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            display: flex; flex-direction: column; gap: 20px;
            overflow-y: auto;
        }
        #info-panel.active { transform: translateX(0); }
        
        .info-title { font-size: 1.5rem; font-weight: bold; text-transform: uppercase; border-bottom: 2px solid var(--highlight); padding-bottom: 10px; }
        .info-desc { font-size: 0.95rem; line-height: 1.6; }

        /* PROJECT IMAGE GALLERY */
        #info-gallery {
            display: flex; flex-direction: column; gap: 15px; margin-top: 20px; padding-bottom: 2rem;
        }
        #info-gallery img {
            width: 100%; height: auto; object-fit: contain; background: #bbb;
            filter: grayscale(100%) contrast(110%); transition: filter 0.3s ease; cursor: pointer;
            border: 1px solid rgba(0,0,0,0.1);
        }
        #info-gallery img:hover { filter: grayscale(0%) contrast(100%); }

        /* CONTROLS */
        #ui-controls {
            position: fixed; bottom: 40px; left: 40px;
            display: flex; flex-direction: column; gap: 8px; z-index: 9000;
        }

        #ui-controls button {
            width: 40px; height: 40px; background: var(--map-bg);
            border: 1px solid var(--map-ink); cursor: pointer;
            font-size: 1.4rem; color: var(--map-ink); transition: all 0.2s;
        }
        #ui-controls button:hover { background: var(--map-ink); color: var(--map-bg); }

        .portal-btn {
            display: inline-block; margin-top: 15px; padding: 0; border: none; 
            color: var(--map-ink); font-size: 0.95rem; cursor: pointer; 
            background: transparent; text-decoration: underline; transition: color 0.2s ease;
        }
        .portal-btn:hover { color: var(--highlight); }

        /* LIGHTBOX FOR FULL IMAGES */
        #lightbox {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(230, 227, 223, 0.95); z-index: 9999;
            justify-content: center; align-items: center; padding: 20px;
            cursor: pointer; backdrop-filter: blur(5px);
        }
        #lightbox img {
            max-width: 100%; max-height: 90vh; object-fit: contain;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3); border: 2px solid var(--map-ink);
            background: #fff;
        }

        /* FLÂNERIES DRAWER */
        #flanerie-drawer {
            position: fixed; top: 100%; left: 0; width: 100%; height: 100%;
            background: #f4f4f2;
            z-index: 9600;
            transition: top 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            overflow-y: auto; padding: 4rem 2rem; box-sizing: border-box;
        }
        #flanerie-drawer.open { top: 0; }
        .close-drawer {
            position: absolute; top: 30px; right: 40px; font-size: 1rem; cursor: pointer; 
            background: none; border: none; color: var(--map-ink); z-index: 9700;
        }
        .close-drawer:hover { color: var(--highlight); }

        .archive-table { width: 100%; max-width: 1100px; margin: 0 auto; pointer-events: auto; }
        .archive-title { font-size: 2rem; font-weight: bold; text-transform: uppercase; border-bottom: 2px solid var(--map-ink); padding-bottom: 1rem; margin-bottom: 2rem; color: var(--map-ink); }
        .archive-header { display: flex; font-weight: bold; border-bottom: 1px solid var(--map-ink); padding-bottom: 10px; margin-bottom: 0; font-size: 0.9rem; text-transform: uppercase; color: var(--map-ink);}
        
        .col-time { width: 10%; font-weight: bold; font-size: 0.95rem; }
        .col-media { width: 45%; display: flex; gap: 15px; flex-wrap: wrap; padding-right: 40px; align-items: flex-start; }
        .col-notes { width: 45%; font-size: 0.95rem; line-height: 1.5; color: #222; }
        
        .archive-row { display: flex; border-bottom: 1px solid var(--map-ink); padding: 20px 0; align-items: flex-start; }
        
        /* Uncropped, natural sizes for Flâneries images */
        .archive-row .col-media img, .archive-row .col-media video { 
            width: auto; 
            max-width: 100%;
            height: auto; 
            max-height: 400px; 
            object-fit: contain; 
            border: 1px solid rgba(0,0,0,0.1);
            filter: grayscale(100%);
            transition: filter 0.3s ease;
        }
        .archive-row .col-media img:hover, .archive-row .col-media video:hover { filter: grayscale(0%); }

        /* MOBILE RESPONSIVENESS */
        @media (max-width: 768px) {
            #info-panel { width: 90vw; padding: 6rem 1.5rem 2rem 1.5rem; }
            #ui-controls { bottom: 20px; left: 20px; }
            #site-footer { bottom: 20px; right: 20px; font-size: 0.7rem; }
            .archive-header { display: none; } 
            .archive-row { flex-direction: column; padding: 20px 0; }
            .col-time, .col-media, .col-notes { width: 100%; margin-bottom: 15px; }
            .col-media { padding-right: 0; }
        }
    </style>
</head>

    <header>

            let dx = gx - CENTER_GX;
            let dy = gy - CENTER_GY;

            let riverY = Math.sin(dx * 0.15) * 4 + (dx * -0.05); 
            if (Math.abs(dy - riverY) <= 1.5) return 'river';

            for (let p of PLACES) {
                if (p.type === 'square') {
                    if (Math.sqrt((gx - p.gx)**2 + (gy - p.gy)**2) <= p.r) return 'park';
                } else if (p.type === 'park') {
                    if (gx >= p.gx && gx < p.gx + p.w && gy >= p.gy && gy < p.gy + p.h) return 'park';
                }
            }

            let dist = Math.sqrt((dx*dx)/(36*36) + (dy*dy)/(26*26)); 
            let angle = Math.atan2(dy, dx);
            let noise = Math.sin(angle * 3) * 0.08 + Math.cos(angle * 5) * 0.05;
            
            if (dist + noise <= 1.0) return 'city';
            return 'outside';
        }

        function getRiverY(dx) {
            return Math.sin(dx * 0.15) * 4 + (dx * -0.05);
        }

        function initCartography() {
            const fragment = document.createDocumentFragment();

            const anchors = {
                berlin: { cx: -20, cy: -18 },      
                spain: { cx: 16, cy: 12 },        
                escitalopram: { cx: 12, cy: -12 },
                casitos: { cx: -18, cy: 12 },     
                flaneries: { cx: 0, cy: -14 },     
                selfie: { cx: -6, cy: 18 },       
                uncertainty: { cx: 24, cy: -6 }   
            };

            drawSVG_BaseLayers();

            let naturPaths = ARCHIVE.natur.map(src => ({
                src: src, size: PHOTO_SIZES[Math.floor(Math.random() * PHOTO_SIZES.length)], shape: PHOTO_SHAPES[Math.floor(Math.random() * PHOTO_SHAPES.length)]
            })).sort((a, b) => (b.size.w * b.size.h) - (a.size.w * a.size.h));

            let riverX = CENTER_GX - 30;
            naturPaths.forEach(block => {
                let placed = false;
                let rX = riverX;
                while (!placed && rX < CENTER_GX + 30) {
                    let rY = Math.floor(CENTER_GY + getRiverY(rX - CENTER_GX));
                    
                    for (let yOff = -2; yOff <= 2; yOff++) {
                        let checkY = rY + yOff;
                        if (!isOccupied(rX, checkY, block.size.w, block.size.h)) {
                            markOccupied(rX, checkY, block.size.w, block.size.h);
                            spawnBlock(fragment, block.src, rX, checkY, block.size.w, block.size.h, block.shape, 'natur', true);
                            placed = true;
                            riverX = rX + block.size.w; 
                            break;
                        }
                    }
                    rX++;
                }
            });

            for (const [project, paths] of Object.entries(ARCHIVE)) {
                if (project === 'natur') continue;
                
                // Fallback for new projects not in the anchor dictionary
                if (!anchors[project]) {
                    anchors[project] = { cx: Math.floor(Math.random() * 40) - 20, cy: Math.floor(Math.random() * 40) - 20 };
                }

                let cx = CENTER_GX + anchors[project].cx;
                let cy = CENTER_GY + anchors[project].cy;

                let blocks = paths.map(src => ({
                    src: src, size: PHOTO_SIZES[Math.floor(Math.random() * PHOTO_SIZES.length)], shape: PHOTO_SHAPES[Math.floor(Math.random() * PHOTO_SHAPES.length)]
                })).sort((a, b) => (b.size.w * b.size.h) - (a.size.w * a.size.h));

                blocks.forEach(block => {
                    let placed = false;
                    let radius = 0;

                    while (!placed && radius < 50) { 
                        for (let dx = -radius; dx <= radius; dx++) {
                            for (let dy = -radius; dy <= radius; dy++) {
                                if (Math.abs(dx) !== radius && Math.abs(dy) !== radius) continue;
                                let checkX = cx + dx; let checkY = cy + dy;
                                
                                if (getMapZone(checkX, checkY) === 'city' && !isOccupied(checkX, checkY, block.size.w, block.size.h)) {
                                    let isRiverPath = Math.abs((checkY - CENTER_GY) - getRiverY(checkX - CENTER_GX)) <= 1.5;
                                    
                                    if (!isRiverPath) {
                                        markOccupied(checkX, checkY, block.size.w, block.size.h);
                                        spawnBlock(fragment, block.src, checkX, checkY, block.size.w, block.size.h, block.shape, project, true);
                                        placed = true; break;
                                    }
                                }
                            }
                            if(placed) break;
                        }
                        radius++;
                    }
                });
            }

            for(let pass = 0; pass < FILLER_SIZES.length; pass++) {
                let fw = FILLER_SIZES[pass].w;
                let fh = FILLER_SIZES[pass].h;
                
                for (let y = CENTER_GY - 30; y <= CENTER_GY + 30; y++) {
                    for (let x = CENTER_GX - 40; x <= CENTER_GX + 40; x++) {
                        if (getMapZone(x, y) === 'city' && !isOccupied(x, y, fw, fh)) {
                            let valid = true;
                            for(let ix=0; ix<fw; ix++) {
                                for(let iy=0; iy<fh; iy++) {
                                    if(getMapZone(x+ix, y+iy) !== 'city') valid = false;
                                    if(Math.abs(((y+iy) - CENTER_GY) - getRiverY((x+ix) - CENTER_GX)) <= 1.5) valid = false;
                                }
                            }
                            
                            if(valid) {
                                markOccupied(x, y, fw, fh);
                                if (Math.random() < 0.8) {
                                    spawnBlock(fragment, null, x, y, fw, fh, FILLER_SHAPES[Math.floor(Math.random() * FILLER_SHAPES.length)], 'filler', false);
                                }
                            }
                        }
                    }
                }
            }

            drawTransportLines(anchors);
            assets.appendChild(fragment);
            
            drawCityBounds();
            resetCameraToFit();
        }

        function drawSVG_BaseLayers() {
            const gridToPx = (gx, gy) => ({
                x: gx * GRID_UNIT + (gx * STREET_GAP) + (GRID_UNIT / 2),
                y: gy * GRID_UNIT + (gy * STREET_GAP) + (GRID_UNIT / 2)
            });

            PLACES.forEach(p => {
                if (p.type === 'square') {
                    const circ = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                    circ.className.baseVal = "map-park";
                    let pt = gridToPx(p.gx, p.gy);
                    circ.setAttribute("cx", pt.x);
                    circ.setAttribute("cy", pt.y);
                    circ.setAttribute("r", p.r * (GRID_UNIT + STREET_GAP));
                    baseLayer.appendChild(circ);
                } else if (p.type === 'park') {
                    const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                    rect.className.baseVal = "map-park";
                    let x = p.gx * GRID_UNIT + (p.gx * STREET_GAP);
                    let y = p.gy * GRID_UNIT + (p.gy * STREET_GAP);
                    let w = p.w * GRID_UNIT + (p.w - 1) * STREET_GAP;
                    let h = p.h * GRID_UNIT + (p.h - 1) * STREET_GAP;
                    rect.setAttribute("x", x);
                    rect.setAttribute("y", y);
                    rect.setAttribute("width", w);
                    rect.setAttribute("height", h);
                    baseLayer.appendChild(rect);
                }
            });

            const rPoints = [];
            for (let dx = -35; dx <= 35; dx += 2) {
                let gx = CENTER_GX + dx;
                let gy = CENTER_GY + getRiverY(dx);
                rPoints.push(gridToPx(gx, gy));
            }
            const pString = rPoints.map(p => `${p.x},${p.y}`).join(" ");

            const polylineOut = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
            polylineOut.className.baseVal = "map-river-outline";
            polylineOut.setAttribute("points", pString);
            baseLayer.appendChild(polylineOut);

            const polyline = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
            polyline.className.baseVal = "map-river";
            polyline.setAttribute("points", pString);
            baseLayer.appendChild(polyline);
        }

        function drawTransportLines(anchors) {
            const gridToPx = (gx, gy) => ({
                x: gx * GRID_UNIT + (gx * STREET_GAP) + (GRID_UNIT / 2),
                y: gy * GRID_UNIT + (gy * STREET_GAP) + (GRID_UNIT / 2)
            });

            const center = gridToPx(CENTER_GX, CENTER_GY);
            const aBerlin = gridToPx(CENTER_GX + anchors.berlin.cx, CENTER_GY + anchors.berlin.cy);
            const aSpain = gridToPx(CENTER_GX + anchors.spain.cx, CENTER_GY + anchors.spain.cy);
            const aCasitos = gridToPx(CENTER_GX + anchors.casitos.cx, CENTER_GY + anchors.casitos.cy);
            const aUncertainty = gridToPx(CENTER_GX + anchors.uncertainty.cx, CENTER_GY + anchors.uncertainty.cy);
            const aSelfie = gridToPx(CENTER_GX + anchors.selfie.cx, CENTER_GY + anchors.selfie.cy);

            const drawSchematicLine = (points) => {
                const poly = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
                poly.className.baseVal = "transport-line";
                poly.setAttribute("points", points.map(p => `${p.x},${p.y}`).join(" "));
                transportLayer.appendChild(poly);
            };

            const drawStation = (p) => {
                const circ = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                circ.className.baseVal = "transport-station";
                circ.setAttribute("cx", p.x);
                circ.setAttribute("cy", p.y);
                circ.setAttribute("r", 7);
                transportLayer.appendChild(circ);
            };

            let schematicSpain = { x: aSpain.x - (aSpain.y - center.y), y: center.y }; 
            
            drawSchematicLine([ aUncertainty, aSpain, schematicSpain, center, aBerlin, aCasitos ]);
            drawSchematicLine([ center, aSelfie ]);

            [center, aBerlin, aSpain, aCasitos, aUncertainty, aSelfie].forEach(drawStation);
        }

        function drawCityBounds() {
            const boundsGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
            boundsGroup.id = "city-bounds-group";
            
            const padUnits = 2;
            let minX = mediaBounds.minX - padUnits;
            let maxX = mediaBounds.maxX + padUnits;
            let minY = mediaBounds.minY - padUnits;
            let maxY = mediaBounds.maxY + padUnits;

            let px = minX * (GRID_UNIT + STREET_GAP);
            let py = minY * (GRID_UNIT + STREET_GAP);
            let pw = Math.max(0, (maxX - minX) * (GRID_UNIT + STREET_GAP) - STREET_GAP);
            let ph = Math.max(0, (maxY - minY) * (GRID_UNIT + STREET_GAP) - STREET_GAP);

            const outerRect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            outerRect.setAttribute("x", px);
            outerRect.setAttribute("y", py);
            outerRect.setAttribute("width", pw);
            outerRect.setAttribute("height", ph);
            outerRect.setAttribute("fill", "none");
            outerRect.setAttribute("stroke", "var(--map-ink)");
            outerRect.setAttribute("stroke-width", "4");

            const padding = 15;
            const innerRect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            innerRect.setAttribute("x", px + padding);
            innerRect.setAttribute("y", py + padding);
            innerRect.setAttribute("width", Math.max(0, pw - (padding * 2)));
            innerRect.setAttribute("height", Math.max(0, ph - (padding * 2)));
            innerRect.setAttribute("fill", "none");
            innerRect.setAttribute("stroke", "var(--map-ink)");
            innerRect.setAttribute("stroke-width", "1.5");
            innerRect.setAttribute("stroke-dasharray", "8 6");

            const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
            text.setAttribute("x", px + padding + 15);
            text.setAttribute("y", py + padding + 30);
            text.setAttribute("fill", "var(--map-ink)");
            text.setAttribute("font-size", "28px");
            text.setAttribute("font-family", "Georgia, 'Times New Roman', serif");
            text.setAttribute("font-style", "italic");
            text.setAttribute("font-weight", "normal");
            text.textContent = "I.";

            boundsGroup.appendChild(outerRect);
            boundsGroup.appendChild(innerRect);
            boundsGroup.appendChild(text);

            surveyorLayer.appendChild(boundsGroup);
        }

        function isOccupied(gx, gy, w, h) {
            for(let x = 0; x < w; x++) for(let y = 0; y < h; y++) if(occupiedGrid[`${gx+x},${gy+y}`]) return true;
            return false;
        }

        function markOccupied(gx, gy, w, h) {
            for(let x = 0; x < w; x++) for(let y = 0; y < h; y++) occupiedGrid[`${gx+x},${gy+y}`] = true;
        }

        function spawnBlock(container, src, gx, gy, gw, gh, shape, project, isMedia) {
            if (isMedia) {
                mediaBounds.minX = Math.min(mediaBounds.minX, gx); 
                mediaBounds.maxX = Math.max(mediaBounds.maxX, gx + gw);
                mediaBounds.minY = Math.min(mediaBounds.minY, gy); 
                mediaBounds.maxY = Math.max(mediaBounds.maxY, gy + gh);
            }

            let px = gx * GRID_UNIT + (gx * STREET_GAP); let py = gy * GRID_UNIT + (gy * STREET_GAP);
            let pw = gw * GRID_UNIT + ((gw-1) * STREET_GAP); let ph = gh * GRID_UNIT + ((gh-1) * STREET_GAP);

            const wrapper = document.createElement('div');
            wrapper.className = `map-block`;
            wrapper.style.left = `${px}px`; wrapper.style.top = `${py}px`;
            wrapper.style.width = `${pw}px`; wrapper.style.height = `${ph}px`;

            const inner = document.createElement('div');
            inner.className = `map-block-inner ${shape}`;

            if (isMedia) {
                wrapper.dataset.project = project;
                const img = document.createElement('img');
                img.src = src; 
                img.setAttribute('loading', 'lazy'); 
                img.setAttribute('decoding', 'async'); 
                inner.appendChild(img);
                wrapper.onmouseenter = () => activateProject(project);
            } else {
                const filler = document.createElement('div');
                filler.className = 'filler-bg';
                inner.appendChild(filler);
            }
            
            wrapper.appendChild(inner);
            container.appendChild(wrapper);
        }

        let currentHover = null;

        function activateProject(project) {
            if (currentHover === project) return;
            currentHover = project;

            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            const items = document.querySelectorAll(`.map-block[data-project="${project}"]`);
            document.querySelectorAll('.map-block[data-project]').forEach(el => el.classList.remove('highlighted'));
            
            items.forEach(el => {
                el.classList.add('highlighted');
                const x = parseInt(el.style.left); const y = parseInt(el.style.top);
                minX = Math.min(minX, x); minY = Math.min(minY, y);
                maxX = Math.max(maxX, x + parseInt(el.style.width)); maxY = Math.max(maxY, y + parseInt(el.style.height));
            });

            if (items.length > 0) {
                const pad = 20;
                surveyBox.setAttribute('x', minX - pad); surveyBox.setAttribute('y', minY - pad);
                surveyBox.setAttribute('width', (maxX - minX) + (pad*2)); surveyBox.setAttribute('height', (maxY - minY) + (pad*2));
                surveyBox.style.opacity = 1;
            }

            tooltip.innerText = project; tooltip.style.opacity = 1;
            infoTitle.innerText = project;
            infoDesc.innerText = DESCRIPTIONS[project] || "";
            
            flanerieBtnContainer.innerHTML = '';
            if (FIELD_NOTES[project] && FIELD_NOTES[project].length > 0) {
                const btn = document.createElement('button');
                btn.className = 'portal-btn';
                btn.innerText = 'View Flâneries';
                btn.onclick = () => openFlanerie(project);
                flanerieBtnContainer.appendChild(btn);
            }

            // Populate Gallery List
            const infoGallery = document.getElementById('info-gallery');
            infoGallery.innerHTML = '';
            if (ARCHIVE[project]) {
                ARCHIVE[project].forEach(src => {
                    const img = document.createElement('img');
                    img.src = src;
                    img.setAttribute('loading', 'lazy');
                    img.onclick = () => openLightbox(src);
                    infoGallery.appendChild(img);
                });
            }

            infoPanel.classList.add('active');
            document.body.classList.add('panel-open');
        }

        // Open Lightbox Function
        function openLightbox(src) {
            lightboxImg.src = src;
            lightbox.style.display = 'flex';
        }
        function closeLightbox() {
            lightbox.style.display = 'none';
        }

        window.addEventListener('mousemove', e => {
            if (currentHover) { tooltip.style.left = `${e.clientX + 15}px`; tooltip.style.top = `${e.clientY + 15}px`; }
        });

        window.addEventListener('mousedown', e => {
            if (e.target.id === 'viewport' || e.target.id === 'map-world' || e.target.id === 'base-layer' || e.target.id === 'surveyor-layer' || e.target.id === 'transport-layer') {
                currentHover = null;
                document.querySelectorAll('.map-block').forEach(el => el.classList.remove('highlighted'));
                surveyBox.style.opacity = 0; tooltip.style.opacity = 0;
                infoPanel.classList.remove('active'); document.body.classList.remove('panel-open');
            }
        });

        window.addEventListener('touchstart', e => {
            if (e.target.id === 'viewport' || e.target.id === 'map-world' || e.target.id === 'base-layer' || e.target.id === 'surveyor-layer' || e.target.id === 'transport-layer') {
                currentHover = null;
                document.querySelectorAll('.map-block').forEach(el => el.classList.remove('highlighted'));
                surveyBox.style.opacity = 0; tooltip.style.opacity = 0;
                infoPanel.classList.remove('active'); document.body.classList.remove('panel-open');
            }
        });

        function openFlanerie(cityKey) {
            const drawer = document.getElementById('flanerie-drawer');
            const content = document.getElementById('flanerie-content');
            content.innerHTML = ''; 
            
            (FIELD_NOTES[cityKey] || []).forEach((note) => {
                const row = document.createElement('div'); row.className = 'archive-row';
                
                note.media.sort((a, b) => (a.type === 'video' ? -1 : 1));

                let mediaHTML = note.media.map(m => {
                    if (m.type === 'video') {
                        return `<video src="${m.src}" muted autoplay loop playsinline></video>`;
                    } else {
                        return `<img src="${m.src}" loading="lazy">`;
                    }
                }).join('');
                
                row.innerHTML = `<div class="col-time">${note.time}</div><div class="col-media">${mediaHTML}</div><div class="col-notes">${note.text}</div>`;
                content.appendChild(row);
            });
            drawer.classList.add('open');
        }
        function closeFlanerie() { document.getElementById('flanerie-drawer').classList.remove('open'); }

        function zoomViaButton(factor) {
            const screenW = window.innerWidth; const screenH = window.innerHeight;
            applyZoom(factor, screenW / 2, screenH / 2);
        }

        window.addEventListener('wheel', (e) => {
            if (document.getElementById('flanerie-drawer').classList.contains('open')) return;
            if (document.getElementById('info-panel').classList.contains('active')) {
                const bounds = document.getElementById('info-panel').getBoundingClientRect();
                if (e.clientX > bounds.left && e.clientX < bounds.right) return;
            }
            e.preventDefault();
            const factor = e.deltaY > 0 ? 0.9 : 1.1;
            applyZoom(factor, e.clientX, e.clientY);
        }, {passive: false});

        function applyZoom(factor, pointerX, pointerY) {
            const mapX = (pointerX - pos.x) / scale; const mapY = (pointerY - pos.y) / scale;
            scale = Math.max(0.15, Math.min(3.5, scale * factor));
            pos.x = pointerX - (mapX * scale); pos.y = pointerY - (mapY * scale);
            updateCamera();
        }

        function resetCameraToFit() {
            const padUnits = 3;
            let minX = mediaBounds.minX - padUnits;
            let maxX = mediaBounds.maxX + padUnits;
            let minY = mediaBounds.minY - padUnits;
            let maxY = mediaBounds.maxY + padUnits;

            let pw = (maxX - minX) * (GRID_UNIT + STREET_GAP) - STREET_GAP;
            let ph = (maxY - minY) * (GRID_UNIT + STREET_GAP) - STREET_GAP;
            let cx = minX * (GRID_UNIT + STREET_GAP) + (pw / 2);
            let cy = minY * (GRID_UNIT + STREET_GAP) + (ph / 2);
            
            scale = Math.min((window.innerWidth * 0.85) / pw, (window.innerHeight * 0.85) / ph, 1.2); 
            pos.x = (window.innerWidth / 2) - (cx * scale);
            pos.y = (window.innerHeight / 2) - (cy * scale);
            updateCamera();
        }

        function updateCamera() { 
            world.style.transform = `translate(${pos.x}px, ${pos.y}px) scale(${scale})`; 
        }

        let isDragging = false; 
        let lastPos = { x: 0, y: 0 };
        let ticking = false;

        const startPan = (clientX, clientY, e) => {
            if(e.target.tagName === 'BUTTON') return;
            isDragging = true; lastPos = { x: clientX, y: clientY }; 
            world.style.cursor = 'grabbing';
        };

        const movePan = (clientX, clientY) => {
            if (!isDragging) return;
            pos.x += (clientX - lastPos.x); pos.y += (clientY - lastPos.y);
            lastPos = { x: clientX, y: clientY }; 
            if (!ticking) {
                window.requestAnimationFrame(() => { updateCamera(); ticking = false; });
                ticking = true;
            }
        };

        const endPan = () => { isDragging = false; world.style.cursor = 'grab'; };

        document.getElementById('viewport').addEventListener('mousedown', e => startPan(e.clientX, e.clientY, e));
        window.addEventListener('mouseup', endPan);
        window.addEventListener('mousemove', e => movePan(e.clientX, e.clientY));

        document.getElementById('viewport').addEventListener('touchstart', e => startPan(e.touches[0].clientX, e.touches[0].clientY, e), {passive: false});
        window.addEventListener('touchend', endPan);
        window.addEventListener('touchmove', e => {
            if (isDragging && !document.getElementById('flanerie-drawer').classList.contains('open')) {
                const infoPanel = document.getElementById('info-panel');
                if (infoPanel.classList.contains('active')) {
                    const bounds = infoPanel.getBoundingClientRect();
                    if (e.touches[0].clientX > bounds.left && e.touches[0].clientX < bounds.right) return;
                }
                e.preventDefault(); 
                movePan(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, {passive: false});

        window.addEventListener('resize', () => { if(!isDragging) resetCameraToFit(); });
        window.onload = initCartography;
    </script>
